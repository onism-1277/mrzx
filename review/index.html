</style></head><body data-astro-cid-5vqnc7pn><div class="container" data-astro-cid-5vqnc7pn><h1 data-astro-cid-5vqnc7pn>📋 论文标注审查</h1><p class="progress" id="progress" data-astro-cid-5vqnc7pn>加载中...</p><div id="paperCard" class="card" style="display:none;" data-astro-cid-5vqnc7pn><div class="title" id="paperTitle" data-astro-cid-5vqnc7pn></div><div class="title-cn" id="paperTitleCn" data-astro-cid-5vqnc7pn></div><div class="meta" id="paperMeta" data-astro-cid-5vqnc7pn></div><div class="abstract" id="paperAbstract" data-astro-cid-5vqnc7pn></div><div class="buttons" data-astro-cid-5vqnc7pn><button class="btn yes" onclick="annotate(true)" data-astro-cid-5vqnc7pn>✅ 相关</button><button class="btn no" onclick="annotate(false)" data-astro-cid-5vqnc7pn>❌ 不相关</button></div></div><div id="doneMessage" class="done" style="display:none;" data-astro-cid-5vqnc7pn><p data-astro-cid-5vqnc7pn>🎉 全部标注完成！</p><button class="btn export" onclick="exportResults()" data-astro-cid-5vqnc7pn>📥 导出标注结果</button><button class="btn reset" onclick="resetAll()" data-astro-cid-5vqnc7pn>🔄 重新开始</button><button class="btn back" onclick="goBack()" data-astro-cid-5vqnc7pn>↩️ 返回上一篇</button></div></div><script>(function(){const papersJson = "[{\"title\":\"浙江省两栖动物新纪录——黄岗山蝾螈\",\"title_cn\":\"浙江省两栖动物新纪录——黄岗山蝾螈\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2024年10月，在浙江省衢州市采集到2号滇螈属（Hypselotriton）动物标本，其形态特征与黄岗山蝾螈（H.huanggangensis）一致。基于线粒体ND2基因片段的分子系统学分析显示，2号标本与黄岗山蝾螈聚为一支，它们之间的未校正遗传距离最近（0.6%）。确认这2号标本为黄岗山蝾螈浙江省新记录。黄岗山蝾螈首次发现于武夷山国家公园江西片区，本次新纪录扩大了对黄岗山蝾螈分布范围的认知，为黄岗山蝾螈的种群分化和生物地理学研究提供了基础信息。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=105559091\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-浙江省两栖动物新纪录——黄岗山蝾螈\",\"category\":\"zoology\"},{\"title\":\"中国福建发现布角蟾属一新种（两栖纲：角蟾科）\",\"title_cn\":\"中国福建发现布角蟾属一新种（两栖纲：角蟾科）\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2024年9月在福建省梅花山国家级自然保护区采集到布角蟾属（Boulenophrys）物种3号标本，经形态特征比较及基于72个物种的2个线粒体片段（16S rRNA和COI）联合建树，支持采集到的布角蟾标本为新种——梅花山角蟾（Boulenophrys meihuamontis Luo and Huang sp.nov.）。正模标本：MHSLX18-2，雄性成体，2024年9月14日采自福建省龙岩市上杭县梅花山国家级自然保护区（25°16′19.33″N，116°50′20.32″E；海拔1 059 m）；副模标本：MHSLX18-1和MHSLX18-3，雄性成体，采集信息与正模标本相同。正模和副模标本均保存于福建农林大学林学院标本馆（FJFC）。新物种可通过以下形态特征组合和所有已知同属物种区分：（1）成体体型小，雄性头体长26.9～28.3 mm（n = 3）；（2）头扁平，头长小于头宽；（3）舌后端无缺刻；（4）无犁骨齿及犁骨棱；（5）背面皮肤较粗糙，有稀疏的小疣粒，四肢表面及外侧均具明显锯齿状肤棱；（6）后肢贴体前伸胫跗关节均达眼后角；（7）左右跟部不相遇；（8）趾扁平，趾侧无\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=102114452\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-中国福建发现布角蟾属一新种（两栖纲：角蟾科）\",\"category\":\"zoology\"},{\"title\":\"浙江省爬行动物新纪录——光蜥\",\"title_cn\":\"浙江省爬行动物新纪录——光蜥\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2024年11月4日，于浙江省温州市泰顺县左溪村（27°38′50″N，119°47′02″E）采集到1号光蜥属（Ateuchosaurus）标本，经形态鉴定比对，和光蜥（A.chinensis Gray， 1845）相似。基于线粒体COI基因构建的石龙子科（Scincidae）部分物种系统发育树显示，采集的光蜥属标本与广东广州和福建灵江的光蜥聚为一支；基于Kimura双参数（K2P）模型估算本次浙江泰顺采集的光蜥属标本与广东广州和福建灵江光蜥的遗传距离为0.002～0.004，远小于不同物种之间的遗传距离。结合形态特征和分子系统发育比较，确认本次采集的光蜥属标本为石龙子科光蜥属光蜥，系浙江省爬行动物新纪录种。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=101739591\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-浙江省爬行动物新纪录——光蜥\",\"category\":\"zoology\"},{\"title\":\"江苏省兽类新纪录——安徽麝鼩\",\"title_cn\":\"江苏省兽类新纪录——安徽麝鼩\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"安徽麝鼩（Crocidura anhuiensis）是2019年基于安徽黄山标本命名并确立的新种，为中国特有种，分布在安徽省、江西省、福建省、浙江省和湖南省。2024年9月—2025年3月，在江苏省南京市陆生野生动物资源调查期间，于汤山（32°03′25.92″—32°02′57.12″N，119°02′56.40″—119°00′30.96″E）采集到2号麝鼩标本。经形态和分子鉴定确认其为安徽麝鼩，系江苏省兽类分布新纪录。该发现进一步拓展了安徽麝鼩在中国的分布范围，丰富了其生物地理学数据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=154183571\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-江苏省兽类新纪录——安徽麝鼩\",\"category\":\"zoology\"},{\"title\":\"甘肃和宁夏发现狭耳鼠耳蝠\",\"title_cn\":\"甘肃和宁夏发现狭耳鼠耳蝠\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2013年6月和7月，本研究组分别在甘肃省平凉市、永昌县及宁夏回族自治区固原市的废弃窑洞中捕获4只鼠耳蝠，均为雄性（标本号：KT13744、KT13748、YC13754、PY13771），结合其外部形态特征、体型参数及部分标本的Cyt b基因序列对比结果进行物种鉴定。结果表明：上述鼠耳蝠体型较大（头体长66.5～69.2 mm，前臂长58.00～61.11 mm），后足长约为胫骨长的一半，耳狭长，呈三角形，耳屏细长；体毛细长柔密，背毛毛基黑灰色，毛尖浅褐色；腹毛基黑灰色，毛尖烟白色，背腹毛色分明；头骨整体粗壮狭长，颅全长22.26～23.16 mm，脑颅低而圆，矢状嵴明显，齿式为2.1.3.3/3.1.3.3 = 38。所有形态及颅骨特征均与狭耳鼠耳蝠（Myotis blythii）相符。Cyt b序列比对显示，甘肃标本（YC13754）与狭耳鼠耳蝠聚为一支，遗传距离最小（0.00%）。基于形态、颅骨特征及系统发育证据，鉴定这4号标本为狭耳鼠耳蝠，该物种为甘肃省和宁夏回族自治区翼手目（Chiroptera）分布新纪录，标本保藏于广东省科学院动物研究所。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=154146303\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-甘肃和宁夏发现狭耳鼠耳蝠\",\"category\":\"zoology\"},{\"title\":\"湖北发现大耳菊头蝠\",\"title_cn\":\"湖北发现大耳菊头蝠\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"本研究组于2013年4月在湖北省十堰市使用手抄网采集到2只菊头蝠（Rhinolophus sp.）。该种体型较小，耳相对头部较大，鼻叶发达，前臂长分别为46.15、47.77 mm；体毛短而细密，背面淡棕色，腹面米黄色；马蹄叶中部具明显缺刻，前端两侧下方各有一小附叶；鞍状叶宽大，呈舌形；连接叶起自鞍状叶背部，顶部高于鞍状叶；顶叶长，顶端呈圆形；颅骨较为扁平，颅全长分别为19.52、19.72 mm，脑颅高7.32、7.55 mm，矢状嵴不明显，额凹较浅；齿式为1.1.2.3/2.1.3.3 = 32。基于COI基因序列的系统发育分析表明，本次所获标本与大耳菊头蝠（R.episcopus）聚为一支。结合形态特征与分子数据，将其鉴定为大耳菊头蝠，为湖北省翼手目（Chiroptera）分布新纪录种。标本（标本号：FX13216、FX13221；均为雄性）现保存于广东省科学院动物研究所。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=128518517\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-湖北发现大耳菊头蝠\",\"category\":\"zoology\"},{\"title\":\"声学监测与样线法在森林鸟类监测中的应用比较\",\"title_cn\":\"声学监测与样线法在森林鸟类监测中的应用比较\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为评估声学监测技术在森林鸟类调查中的应用效果及其与传统样线法的差异，本研究于2024年3月—2025年2月在江苏省盱眙铁山寺国家森林公园开展为期1年的对比监测。传统样线法布设6条样线，每季度开展2次人工调查；声学监测在每条样线上各布设1套声纹设备，全天候采集鸟鸣声，并基于江苏省鸟类名录构建的AI模型进行物种识别与声纹分析。结果显示：（1）两种方法共记录鸟类114种，其中共有种70种，样线法独有28种（共98种），声学监测独有16种（共86种）；（2）样线法在物种数量统计及目视确认方面具优势，而声学监测有效补充了普通夜鹰（Caprimulgus jotaka）、红角鸮（Otus sunia）等夜行性及隐蔽物种的观测结果，并揭示鸟类活动节律特征；（3）声学监测提升了数据处理效率，显著降低了人工辨识强度。研究表明，传统样线法在特定生境和类群监测中仍不可替代，而声学监测凭借其全天候、自动化优势拓展了监测的时空维度，二者协同应用可显著提升森林鸟类多样性监测的准确性和全面性。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=145120943\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-声学监测与样线法在森林鸟类监测中的应用比较\",\"category\":\"zoology\"},{\"title\":\"基于简化基因组测序的吐鲁番沙虎遗传多样性分析\",\"title_cn\":\"基于简化基因组测序的吐鲁番沙虎遗传多样性分析\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"吐鲁番沙虎（Teratoscincus roborowskii）是我国吐鲁番盆地特有的爬行动物，也是国家二级重点保护野生动物。为评估其遗传多样性及群体结构，本研究以盆地内鄯善（SS）、托克逊（TS）、吐鲁番（TP）和艾丁湖（AL）4个居群的32只个体为研究对象，通过基因分型测序（GBS）技术在全基因组范围内开发单核苷酸多态性（SNP）分子标记，最终获得90 543个高质量SNP位点。基于获得的SNPs数据进行遗传多样性、系统发育与群体遗传结构分析。结果表明：各居群观测杂合度（Ho）均高于期望杂合度（He），Ho均值为0.241，He均值为0.232，其中AL居群的多样性最高。居群间遗传分化程度存在差异，SS与TS居群间的遗传分化系数（FST）最大（0.157）；TP与AL居群间的FST最小（0.014）。系统发育树与群体遗传结构分析的结果一致，即SS居群单独聚簇，其余3个居群聚为一簇。Tajima’s D中性检验结果提示该物种可能经历了近期群体收缩或受到平衡选择影响。综合表明，吐鲁番沙虎在遗传结构上呈现显著的东（SS居群）—西（TP、TS、AL居群）分化，其遗传多样性特征可能受地理隔离\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=147068456\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于简化基因组测序的吐鲁番沙虎遗传多样性分析\",\"category\":\"zoology\"},{\"title\":\"基于粪便皮质醇的野化放归大熊猫应激性研究\",\"title_cn\":\"基于粪便皮质醇的野化放归大熊猫应激性研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"保护性易位是野生动物保护的重要手段之一，易位过程会给动物带来不同程度的应激压力，可能影响其放归后的健康状态和生存力，在动物保护计划中应充分考虑。大熊猫（Ailuropoda melanoleuca）是生物多样性保护的旗舰物种，其放归工作成效显著，但对野化放归大熊猫的应激性研究鲜有报道。本研究收集了2010—2017年出生的12只圈养大熊猫在不同野化培训阶段和其放归后（其中4只）的粪便样品，以及圈养与野生大熊猫的粪便样品，测定并比较粪便皮质醇水平。结果显示：野化放归大熊猫在培训第二阶段的皮质醇水平显著低于第一阶段，放归后显著低于培训第二阶段，且放归后个体与野生个体无显著差异；此外，野化培训个体的皮质醇水平显著低于圈养个体。结果表明，随着野化培训阶段的递进，大熊猫粪便皮质醇水平逐渐降低并趋近野生个体水平。本研究积累了野化放归大熊猫的基础生理数据，对大熊猫野化放归与迁地保护具有指导意义，建议将粪便皮质醇监测纳入野化放归大熊猫的长期监测工作中。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=153685633\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于粪便皮质醇的野化放归大熊猫应激性研究\",\"category\":\"zoology\"},{\"title\":\"夜间路灯对东亚伏翼觅食行为的影响\",\"title_cn\":\"夜间路灯对东亚伏翼觅食行为的影响\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"路灯被广泛应用于道路夜间照明，然而目前针对路灯对夜行性动物觅食行为的影响研究仍较为匮乏。本研究以东亚伏翼（Pipistrellus abramus）为研究对象，探究夜间路灯对食虫蝙蝠觅食行为的影响。沿选定的公路布设10条东西走向样线，共设置50个监测样点（有路灯与无路灯样点各25个）；于日落后录制东亚伏翼回声定位声波，量化其飞行通过次数和捕食蜂鸣数量，同步监测各样点光照强度、环境温度、昆虫丰度及微生境类型。克鲁斯卡尔-沃利斯检验显示，有路灯样点的平均光照强度（12.54 lx）显著高于无路灯样点（1.04 lx）；有路灯样点的东亚伏翼通过次数和捕食蜂鸣数量均显著低于无路灯样点。广义线性混合模型分析表明，光照强度是影响两种觅食行为指标的关键因子；随样点光照强度升高，东亚伏翼的通过次数（P = 0.003 2）和捕食蜂鸣数量（P = 0.038 0）均呈显著下降趋势。本研究支持“环境风险假说”，表明夜间路灯产生的高强度光照会显著抑制东亚伏翼的正常觅食行为。建议在城市规划中统筹兼顾照明需求与蝙蝠保护，合理降低核心生境的路灯照度，以减缓光污染对蝙蝠种群的负面效应。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=156593747\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-夜间路灯对东亚伏翼觅食行为的影响\",\"category\":\"zoology\"},{\"title\":\"熔岩台地生境中大林姬鼠植物性食物季节性特征研究\",\"title_cn\":\"熔岩台地生境中大林姬鼠植物性食物季节性特征研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为揭示熔岩台地生境中大林姬鼠（Apodemus peninsulae）的植物性食物组成特征，于2021年9—11月（秋季）与2022年4—6月（春季）在镜泊湖熔岩台地地区使用铗捕法采集大林姬鼠样本，利用DNA宏条形码技术分析其肠道内容物中的植物组成。结果表明：春秋两季植物性食物共包含36目66科130属，以草本和木本植物为主，含少量苔藓和藻类；春季食物包含30目46科82属，优势类群为榆属（Ulmus）、洼瓣花属（Lloydia）和小滨菊属（Leucanthemella）；秋季食物包含35目58科116属，优势类群为榛属（Corylus）、蛇葡萄属（Ampelopsis）和大豆属（Glycine）；两季共有植物性食物68属，以大豆属、洼瓣花属和小滨菊属为主。α和β多样性分析表明，秋季大林姬鼠植物性食物多样性和丰富度均高于春季，且食物组成存在显著季节性差异。研究结果丰富了熔岩台地生境中啮齿动物摄食生态学的基础资料。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=145781050\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-熔岩台地生境中大林姬鼠植物性食物季节性特征研究\",\"category\":\"zoology\"},{\"title\":\"春秋季节狍三维栖息地选择和营养策略研究\",\"title_cn\":\"春秋季节狍三维栖息地选择和营养策略研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"狍（Capreolus pygargus）是我国温带森林生态系统中常见的有蹄类动物，适宜的栖息地和营养策略对其生存与繁殖至关重要。近年来，利用无人机搭载激光雷达技术探究野生动物的三维栖息地结构和食物资源选择模式已成为动物生态学研究的前沿。本研究于2023年10月—2024年4月，利用无人机搭载激光雷达获取森林的垂直和水平结构信息，结合红外自动触发相机监测狍的空间分布，并通过地面植被样方调查获取不同季节中狍可摄取食物的资源分布情况，量化其营养空间分布。在此基础上，采用广义可加模型（GAM）分析不同季节狍栖息地选择如何受三维栖息地结构、营养空间分布的协同影响。结果表明：狍在春秋季节的栖息地选择模式存在显著差异。春季，狍偏好选择中等单木数量的阳坡；而秋季则偏好选择垂直复杂度指数较高、单木数量较少的阳坡。在营养策略上，狍春季偏好选择碳水化合物含量较高的区域，而秋季则偏好选择蛋白质资源丰富的区域。本研究通过应用无人机激光雷达技术及营养生态学理论，突破了传统二维分析无法全面表征栖息地复杂性的局限，揭示了三维栖息地结构下野生动物的营养选择策略，对于野生动物的精准保护和管理具有重要科学价值。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=140629918\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-春秋季节狍三维栖息地选择和营养策略研究\",\"category\":\"zoology\"},{\"title\":\"景区人为干扰对野生岩羊行为节律的影响\",\"title_cn\":\"景区人为干扰对野生岩羊行为节律的影响\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探究景区旅游活动对野生动物的干扰效应，本研究以贺兰山国家级自然保护区内野生岩羊（Pseudois nayaur）为研究对象，通过量化苏峪口（强干扰区）与岩画（弱干扰区）两处景区的游客密度、道路与设施邻近度评估人为干扰强度，并结合长期行为观测，分析了不同干扰强度下岩羊行为节律的季节性响应。结果表明：在强干扰区，夏季岩羊的取食行为与游客数量呈显著负相关（P \\u0026lt; 0.05或P \\u0026lt; 0.01），警戒行为（成年雌性除外）与游客数量呈极显著正相关（P \\u0026lt; 0.01），其日活动节律表现出明显的适应性调整；冬季因食物资源有限，岩羊通过延长取食时间优化能量获取，仅幼体与亚成体的取食行为与游客数量呈显著正相关（P \\u0026lt; 0.01），同时，成年雄性和亚成体的休息行为与游客数量呈显著正相关（P \\u0026lt; 0.05）。相比之下，弱干扰区岩羊的行为模式相对稳定，仅冬季成年雄性与成年雌性取食行为与游客数量呈显著正相关（P \\u0026lt; 0.05）。研究表明，人为干扰强度显著影响岩羊的行为策略与时间分配，高强度干扰可迫使其调整核心活动节律以规避风险。据此建议，保护区在旅游开发中实施分区管理，限制游\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=147725140\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-景区人为干扰对野生岩羊行为节律的影响\",\"category\":\"zoology\"},{\"title\":\"脉冲式太阳能电围栏在亚洲象食物源基地应用成效研究\",\"title_cn\":\"脉冲式太阳能电围栏在亚洲象食物源基地应用成效研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为保护亚洲象食物源基地新种植的食源植物幼苗在生长初期免受象群损害，本研究于2022年7月—2023年5月在云南西双版纳国家级自然保护区勐养子保护区关坪亚洲象食物源基地，开展脉冲式太阳能电围栏防护试验。通过分析25台红外相机记录的亚洲象（Elephas maximus）造访影像数据，并结合随机抽样法测量电围栏内外小果野蕉（Musa acuminata）和象草（Pennisetum purpureum）的生长与受损情况，评估电围栏防护效果。结果表明：（1）脉冲式太阳能电围栏显著提升了管控区内植物的生长量和增长率，并有效降低了亚洲象对幼苗的采食率；（2）监测期间记录到亚洲象造访48次，电围栏成功阻挡45次，防护成功率达93.75%；（3）从4 314条亚洲象影像数据（含照片和视频）中识别出造访亚洲象48头，以家庭单元为主，独象均为成年雄象。研究表明，脉冲式太阳能电围栏在亚洲象食物源基地建设中具有良好的防护作用，可有效促进食源植物生长，但其设计与布设需结合亚洲象行为习性和地形特点进一步优化，本文据此给出了相应的改进建议。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=153999056\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-脉冲式太阳能电围栏在亚洲象食物源基地应用成效研究\",\"category\":\"zoology\"},{\"title\":\"融合红外相机与无人机载激光雷达技术揭示喀斯特生境黑叶猴和猕猴时空共存模式\",\"title_cn\":\"融合红外相机与无人机载激光雷达技术揭示喀斯特生境黑叶猴和猕猴时空共存模式\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为准确探究狭布种黑叶猴（Trachypithecus francoisi）与广布种猕猴（Macaca mulatta）在喀斯特生境中的共存模式，本研究于2023年6月—2025年6月在贵州野钟黑叶猴自然保护区对两物种开展调查。利用无人机载激光雷达技术提取高精度地形与植被三维结构变量，并结合红外相机监测技术获取物种日活动数据。基于集成物种分布模型、核密度估计法与Watson双样本检验分析二者时空共存模式。结果显示：（1）空间上，黑叶猴呈聚集分布，主要位于保护区中部喀斯特河谷底部及悬崖两侧，高适宜生境面积为6.71 km2，占保护区总面积的25.09%；猕猴分布则较分散，高适宜生境面积为8.79 km2，占32.88%；二者高适宜生境重叠区位于中部河谷两侧（3.02 km2），空间生态位重叠度较高（Schoener’s D = 0.733，Warren’s I = 0.935），空间竞争较大。（2）二者对环境因子的选择性存在差异，地形和水源是塑造黑叶猴空间分布的主导因子，而猕猴的分布主要受人为干扰因子制约。（3）时间上，两者的日活动节律高度重叠且受季节影响（雨季重叠系数0.74，旱季0.8\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=153041432\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-融合红外相机与无人机载激光雷达技术揭示喀斯特生境黑叶猴和猕猴\",\"category\":\"zoology\"},{\"title\":\"Modeling the effects of climate risk on primates globally: New perspectives on conservation priorities.\",\"title_cn\":\"模拟全球气候风险对灵长类动物的影响：保护优先事项的新视角。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-08-21\",\"authors\":\"Teng Y, Yin Y, Shen Y et al.\",\"abstract\":\"Rapid climate change poses a severe threat to biodiversity, and phylogenetic diversity-a key metric capturing evolutionary uniqueness and adaptive potential-is critical for conservation. Integrating a well-resolved phylogenetic tree of 424 primate species, we combined spatial analysis and climate risk modeling to explore global spatiotemporal patterns of primates and assess their vulnerability under future climate scenarios. The results suggest a pronounced latitudinal pattern in primate distrib\",\"doi\":\"10.1126/sciadv.aeg0031\",\"url\":\"https://doi.org/10.1126/sciadv.aeg0031\",\"pmid\":\"42627898\",\"category\":\"evolution\"},{\"title\":\"野生动物友好型农业研究与实践进展\",\"title_cn\":\"野生动物友好型农业研究与实践进展\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"全球人口增长带来的粮食需求增加，导致农业用地不断扩张与农药化肥过量使用，这是造成野生动物生境丧失、破碎化及质量下降的主要原因之一。野生动物友好型农业（wildlife-friendly farming， WFF）作为一种新兴农业模式，为缓解农业发展与野生动物保护之间的矛盾提供了可行路径。本研究综述了国内外相关研究和实践经验，梳理了WFF的起源与概念，分析了其在实践中的进展，并详细阐述了通过改造农业景观为野生动物提供栖息地的多种策略，借助经济激励手段促进野生动物保护与控制农药化肥过度使用所形成的正反馈循环，以及野生动物智慧监测技术在WFF的应用前景，并总结了当前国内外WFF的经济和社会实践。尽管WFF在小范围内的成功案例已展现出明显优势，但在更广泛的实施过程中仍面临诸多挑战，包括农业景观中野生动物监测技术落后、欠缺对气候变化的考量，以及市场机制低效、政策支持和公众意识不足等。未来，WFF需充分利用人工智能监测设备、区块链等先进技术，增强其实际应用的可行性；应因地制宜，结合不同地理区域的生态与经济需求，在政策、经济和社会层面加强协调合作，以支持可持续农业和野生动物保护的协同目标，最终实现农\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=143585403\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-野生动物友好型农业研究与实践进展\",\"category\":\"zoology\",\"match_count\":1,\"is_hot\":false},{\"title\":\"China's solar expansion policy reduces bird diversity.\",\"title_cn\":\"\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-20\",\"authors\":\"Zhang H, Zhang A, Wu K et al.\",\"abstract\":\"Could the global transition to renewable energy create a green dilemma that pits carbon reduction against biodiversity conservation? This study examined the effect of policies promoting solar photovoltaics on local avian biodiversity using a panel dataset covering 2344 counties in China from 2014 to 2023. Policies that favored photovoltaic expansion led to reductions in bird diversity, disproportionately affecting wealthier and nondesert regions, as well as widespread species. The mechanism oper\",\"doi\":\"10.1126/science.aee0747\",\"url\":\"https://doi.org/10.1126/science.aee0747\",\"pmid\":\"42623453\",\"category\":\"zoology\",\"match_count\":3,\"is_hot\":true},{\"title\":\"A queen odour mediates reproductive suppression in a eusocial mammal.\",\"title_cn\":\"蜂后气味介导真社会性哺乳动物的生殖抑制。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-08-01\",\"authors\":\"Khallaf MA, Hart DW, Luo W et al.\",\"abstract\":\"Eusociality is exceptionally rare in mammals, and its proximate mechanisms remain poorly understood. Naked mole-rats provide a striking example, with reproduction restricted to a single queen, while all other females remain infertile\",\"doi\":\"10.1038/s41586-026-10772-5\",\"url\":\"https://doi.org/10.1038/s41586-026-10772-5\",\"pmid\":\"42457958\",\"category\":\"zoology\"},{\"title\":\"A 5.3-million-year-old deep-sea whale necropolis in the Diamantina Zone.\",\"title_cn\":\"五百三十万年前深海鲸类墓群：迪亚曼蒂纳区的发现\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-06-01\",\"authors\":\"Peng X, Zhou P, Song X et al.\",\"abstract\":\"Whale falls are biodiversity oases at seabeds\",\"doi\":\"10.1038/s41586-026-10546-z\",\"url\":\"https://doi.org/10.1038/s41586-026-10546-z\",\"pmid\":\"42271050\",\"category\":\"conservation\"},{\"title\":\"Darkness and body size shaped end-Cretaceous marine extinction patterns.\",\"title_cn\":\"黑暗与体型塑造了白垩纪末期海洋灭绝模式。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Ying R, Monteiro FM, Witts JD et al.\",\"abstract\":\"The Chicxulub asteroid impact at the Cretaceous-Paleogene (K-Pg) boundary (66 Ma) is thought to have caused the extinction of around 75% of species in the fossil record by triggering catastrophic environmental changes\",\"doi\":\"10.1038/s41586-026-10541-4\",\"url\":\"https://doi.org/10.1038/s41586-026-10541-4\",\"pmid\":\"42203866\",\"category\":\"paleontology\"},{\"title\":\"Adaptive cellular evolution in the intestine of hyperdiverse cichlid fishes.\",\"title_cn\":\"高多样性丽鱼科鱼类肠道中的适应性细胞进化。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Fages A, Luxey M, Ronco F et al.\",\"abstract\":\"The ability of animals to efficiently track down and digest food is crucial for their survival, and the specialization to different diets is a major driver of diversification in this group\",\"doi\":\"10.1038/s41586-026-10494-8\",\"url\":\"https://doi.org/10.1038/s41586-026-10494-8\",\"pmid\":\"42129563\",\"category\":\"zoology\"},{\"title\":\"Specific expansion of motor cortical projections in a singing mouse.\",\"title_cn\":\"鸣唱小鼠运动皮层投射的特异性扩展。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Isko EC, Harpole CE, Zheng XM et al.\",\"abstract\":\"Elucidating how modifications in neural circuit architecture drive behavioural innovation remains a key challenge in neuroscience and evolutionary biology. In mammals, the neocortex is posited to play a crucial part in facilitating rapid behavioural innovations\",\"doi\":\"10.1038/s41586-026-10458-y\",\"url\":\"https://doi.org/10.1038/s41586-026-10458-y\",\"pmid\":\"42092144\",\"category\":\"zoology\"},{\"title\":\"The scales of strain on sharks.\",\"title_cn\":\"鲨鱼承受压力的尺度。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-13\",\"authors\":\"Roopnarine PD\",\"abstract\":\"The fossil record attributes shark decline in the Caribbean to human activity.\",\"doi\":\"10.1126/science.aek0549\",\"url\":\"https://doi.org/10.1126/science.aek0549\",\"pmid\":\"42594218\",\"category\":\"paleontology\"},{\"title\":\"Fossil denticles reveal how ocean productivity shapes shark baselines and recovery potential.\",\"title_cn\":\"化石皮齿揭示海洋生产力如何塑造鲨鱼基线及恢复潜力。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-13\",\"authors\":\"Dillon EM, McCauley DJ, González M et al.\",\"abstract\":\"Shark populations on coral reefs have declined globally, but few baselines exist to quantify natural variability before human impact. Using fossil dermal denticles preserved in reef sediments, we reconstructed shark communities across the Isthmus of Panama before substantial exploitation [~7 to 3 thousand years ago (ka)] and recently (past century). We found differences in shark baselines and responses to fishing between the oceans on either side of the Isthmus. Reefs in the Pacific supported an\",\"doi\":\"10.1126/science.aec2144\",\"url\":\"https://doi.org/10.1126/science.aec2144\",\"pmid\":\"42594196\",\"category\":\"ecology\"},{\"title\":\"Fossil evidence favors a role for vision in the modular evolution of the primate neocortex.\",\"title_cn\":\"化石证据支持视觉在灵长类新皮层模块化进化中的作用。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-06\",\"authors\":\"Kay RF, Organ CL, Morse PE et al.\",\"abstract\":\"Neocortical expansion is a key innovation of crown primates, although fossil evidence for how the neocortex has evolved remains elusive. We studied neocortical evolution using virtual brain endocasts from extant and Eocene-Miocene fossil primates. We found that neocortex size increased in parallel across crown primate clades, with rapid increases in tarsiers and anthropoids. Although the frontal lobe is commonly described as having expanded disproportionately in primates, we show that it evolved\",\"doi\":\"10.1126/science.aee3541\",\"url\":\"https://doi.org/10.1126/science.aee3541\",\"pmid\":\"42561065\",\"category\":\"evolution\"},{\"title\":\"Genes of an icon.\",\"title_cn\":\"一个偶像的基因。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-06\",\"authors\":\"Price M\",\"abstract\":\"In the DNA of bison, scientists find clues to the animals' past-and keys to safeguarding their future.\",\"doi\":\"10.1126/science.ael2158\",\"url\":\"https://doi.org/10.1126/science.ael2158\",\"pmid\":\"42561059\",\"category\":\"zoology\"},{\"title\":\"When mammals crossed between continents.\",\"title_cn\":\"当哺乳动物跨越大陆之间。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"McGuire JL, Williams CM\",\"abstract\":\"The Great American Biotic Interchange informs the dynamics of modern species invasions.\",\"doi\":\"10.1126/science.aei5362\",\"url\":\"https://doi.org/10.1126/science.aei5362\",\"pmid\":\"42531416\",\"category\":\"zoology\"},{\"title\":\"A 10-million-year biogeographic holding pen primed the Great American Biotic Interchange.\",\"title_cn\":\"一千万年的生物地理学“暂存围栏”为美洲大生物交流做好了准备。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"Tseng ZJ, Kahn LX, Pacheco-Castro A et al.\",\"abstract\":\"The movement of taxa between North and South America across the Panamanian land bridge, known as the Great American Biotic Interchange (GABI), established modern-day mammal assemblages in the Americas, heralding the decisive end of what has been called the \\\"splendid isolation\\\" of the South American fauna. Lacking substantive low-latitude records, previous work on this pattern relied on South American and temperate North American fossils to conclude that pulsed interchanges began about 2.8 millio\",\"doi\":\"10.1126/science.aef2893\",\"url\":\"https://doi.org/10.1126/science.aef2893\",\"pmid\":\"42531382\",\"category\":\"zoology\"},{\"title\":\"Beyond the scales: Marine archaeogenomics for the conservation and restoration of fisheries.\",\"title_cn\":\"超越尺度：海洋古基因组学在渔业保护与恢复中的应用\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"Atmore LM, Star B\",\"abstract\":\"Protection and restoration of marine environments are essential for food security and climate change mitigation. Yet historical and archaeological research have shown that conservation and management often rely on arbitrary ecological baselines in ecosystems already shaped by long-term human impacts. Archaeogenomics, the combination of ancient DNA (aDNA) and whole-genome sequencing, provides invaluable insights into these impacts. Recent improvements in laboratory and computational techniques en\",\"doi\":\"10.1126/science.aeg0333\",\"url\":\"https://doi.org/10.1126/science.aeg0333\",\"pmid\":\"42531380\",\"category\":\"ecology\"},{\"title\":\"Birdsong diversity across the world.\",\"title_cn\":\"全球鸟类鸣声多样性。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-23\",\"authors\":\"Briefer EF\",\"abstract\":\"Birdsong motifs are shaped by evolutionary history, biological traits, and environmental constraints.\",\"doi\":\"10.1126/science.aej0087\",\"url\":\"https://doi.org/10.1126/science.aej0087\",\"pmid\":\"42490503\",\"category\":\"zoology\"},{\"title\":\"The global biogeography of passerine songs.\",\"title_cn\":\"雀形目鸟类鸣唱的全球生物地理格局。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-23\",\"authors\":\"Bacquelé Q, Barnagaud JY, Violle C et al.\",\"abstract\":\"Although bird songs are classic models for understanding the evolution of vocal communication, their global diversity has long made the development of a unifying framework challenging. By analyzing the acoustic architecture of songs from more than 3000 passerine species worldwide, we show that this acoustic space can be structured around eight elemental motifs. The differential use of these motifs is driven by a combination of species' biological traits (social organization, morphology, and mati\",\"doi\":\"10.1126/science.aee6239\",\"url\":\"https://doi.org/10.1126/science.aee6239\",\"pmid\":\"42490479\",\"category\":\"zoology\"},{\"title\":\"Performance trade-offs define a fundamental dental dichotomy in mammals.\",\"title_cn\":\"性能权衡定义了哺乳动物牙齿的一个基本二分法。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-16\",\"authors\":\"Chatar N, Vankelst M, Pérez-Ramos A et al.\",\"abstract\":\"Teeth define mammalian evolution, and one of many adaptive dental breakthroughs in crown mammals is the tribosphenic molar: a tooth with a dual shearing-crushing function, often considered a key adaptation in crown mammals. However, we do not know how potential trade-offs between these antagonistic functions may influence the macroevolutionary outcomes of mammalian lineages. Here, we show that predatory mammals evolved dichotomized performance in their tribosphenic carnassial teeth, with slicing\",\"doi\":\"10.1126/science.aee3453\",\"url\":\"https://doi.org/10.1126/science.aee3453\",\"pmid\":\"42462039\",\"category\":\"zoology\"},{\"title\":\"As bird flu threatens, New Zealand vaccinates endangered birds.\",\"title_cn\":\"禽流感威胁下，新西兰为濒危鸟类接种疫苗。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-09\",\"authors\":\"Larson C\",\"abstract\":\"Arrival of H5N1 virus on Australian mainland triggers ambitious vaccination program.\",\"doi\":\"10.1126/science.aek3889\",\"url\":\"https://doi.org/10.1126/science.aek3889\",\"pmid\":\"42424466\",\"category\":\"zoology\"},{\"title\":\"Innate factors and ontogeny determine nonbreeding areas of migrant songbirds.\",\"title_cn\":\"先天因素和个体发育决定迁徙鸣禽的非繁殖区域。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-25\",\"authors\":\"Lamers KP, Ouwehand J, Ubels R et al.\",\"abstract\":\"Migratory birds connect ecosystems worldwide and often show connectivity between breeding and nonbreeding areas, meaning that individuals have nonbreeding (\\\"wintering\\\") locations close to others from the same breeding population. Although much work has characterized migration routes, we know little about what determines nonbreeding areas. We tracked pied flycatchers (\",\"doi\":\"10.1126/science.ads0532\",\"url\":\"https://doi.org/10.1126/science.ads0532\",\"pmid\":\"42348687\",\"category\":\"zoology\"},{\"title\":\"Lamprey 3D single-cell transcriptomics reveals ancestral and specialized features of the vertebrate brain.\",\"title_cn\":\"七鳃鳗三维单细胞转录组学揭示脊椎动物大脑的祖先性和特化特征。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Wu H, Chen D, Li J et al.\",\"abstract\":\"The lamprey occupies a pivotal position for elucidating vertebrate brain evolution. Using spatial transcriptomics and single-nucleus RNA sequencing, we generated a three-dimensional molecular atlas of the lamprey brain, identifying 209 distinct cell clusters across 14 regions. Cross-species comparisons revealed broad conservation of regional spatial architecture, defining an ancestral organizational blueprint. Within this conserved framework, however, marked lineage-specific divergence emerged. \",\"doi\":\"10.1126/science.aea2535\",\"url\":\"https://doi.org/10.1126/science.aea2535\",\"pmid\":\"42313957\",\"category\":\"zoology\"},{\"title\":\"Tracking the roots of zoonoses.\",\"title_cn\":\"追踪人畜共患病的根源。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Key FM\",\"abstract\":\"Ancient pathogen DNA from animals elucidates the origin and evolution of infectious diseases.\",\"doi\":\"10.1126/science.aef0941\",\"url\":\"https://doi.org/10.1126/science.aef0941\",\"pmid\":\"42313956\",\"category\":\"zoology\"},{\"title\":\"Changes in wildlife activity patterns in response to war in Ukraine.\",\"title_cn\":\"乌克兰战争对野生动物活动模式变化的影响\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Kudrenko S, Bischof R, Zedrosser A et al.\",\"abstract\":\"Conflict zones are inherently hazardous and inaccessible for researchers, which results in a knowledge gap about the immediate effects of armed conflicts on the environment, particularly wildlife. We used camera-trap detections to investigate the impact of armed conflict on wildlife activity patterns before, during, and after the Russian occupation of the Chornobyl Exclusion Zone (Ukraine) in 2022 and compared it to the same period in 2021. Mammal species responded to armed conflict through imme\",\"doi\":\"10.1126/science.aed1493\",\"url\":\"https://doi.org/10.1126/science.aed1493\",\"pmid\":\"42313953\",\"category\":\"zoology\"},{\"title\":\"Threatened 'rolling stone reefs' are surprisingly diverse.\",\"title_cn\":\"受威胁的“滚动石礁”生物多样性惊人。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-04\",\"authors\":\"Moutinho S\",\"abstract\":\"DNA study reveals hidden biodiversity off Brazil-and raises alarm over oil exploration.\",\"doi\":\"10.1126/science.aej3866\",\"url\":\"https://doi.org/10.1126/science.aej3866\",\"pmid\":\"42241541\",\"category\":\"conservation\"},{\"title\":\"A kinematic convergence in ape and monkey vertical climbing informs debates on early hominin arborealism.\",\"title_cn\":\"猿猴垂直攀爬中的运动学趋同，为早期人类树栖生活的争论提供了启示。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-01\",\"authors\":\"Fannin LD, Pape C, McGraw WS\",\"abstract\":\"Recent debates on early hominin arborealism center around interpretations of fossilized foot bones as being either \\\"African ape\\\"- or \\\"monkey\\\"- like in their morphology. These dueling interpretations fuel competing locomotor reconstructions of the last common ancestor of chimpanzees and humans (LCA), including disagreements about the prevalence of vertical climbing behaviors. Yet it remains unclear if possessing an ape- or monkey-like foot impacts the safety and efficiency of climbing, in part be\",\"doi\":\"10.1073/pnas.2608183123\",\"url\":\"https://doi.org/10.1073/pnas.2608183123\",\"pmid\":\"42607191\",\"category\":\"behavior\"},{\"title\":\"Decision rules diverge between sympatric Featherfin cichlids despite shared preferences, ecology, and evolutionary history.\",\"title_cn\":\"尽管共享偏好、生态和进化历史，同域分布的羽鳍丽鱼科鱼类的决策规则仍存在分歧。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Tomasek M, Dunster B, Goverts Z et al.\",\"abstract\":\"It has been hypothesized that divergence in animal decision processes can be attributed to differences in information processing mechanisms. However, the required comparative tests of this idea are hindered by ecological, perceptual, or motivational divergence among species that confound a direct analysis of decision processes. To overcome these limitations, we study two closely related, sympatric cichlid fishes (\",\"doi\":\"10.1073/pnas.2620602123\",\"url\":\"https://doi.org/10.1073/pnas.2620602123\",\"pmid\":\"42584995\",\"category\":\"zoology\"},{\"title\":\"How illegal wildlife trade adheres to and defies conventional market behavior.\",\"title_cn\":\"非法野生动物贸易如何遵循并违背常规市场行为。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Midgette G, Gore ML\",\"abstract\":\"Illegal wildlife markets comprise a complex global economy generating criminal profits while harming biodiversity and livelihoods. The negative externalities from biodiversity loss, ecosystem destabilization, and zoonotic disease risk may be orders of magnitude larger than the multibillion dollar annual total market value. Despite decades of international policy attention, fundamental economic characteristics of these markets remain poorly understood. We suggest distinguishing three categories o\",\"doi\":\"10.1073/pnas.2525056123\",\"url\":\"https://doi.org/10.1073/pnas.2525056123\",\"pmid\":\"42574631\",\"category\":\"zoology\"},{\"title\":\"Many-eyes and sentinels in selfish and cooperative groups.\",\"title_cn\":\"自私与协作群体中的多眼与哨兵机制。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Pilgrim C, Bate AM, Sigalou A et al.\",\"abstract\":\"Collective vigilance describes how animals in groups benefit from the predator detection efforts of others. Empirical observations typically find either a many-eyes strategy with all (or many) group members maintaining a low level of individual vigilance, or a sentinel strategy with one (or a few) individuals maintaining a high level of individual vigilance while others do not. With an analytical treatment that makes minimal assumptions, we show that these two strategies are alternative solution\",\"doi\":\"10.1073/pnas.2536017123\",\"url\":\"https://doi.org/10.1073/pnas.2536017123\",\"pmid\":\"42574625\",\"category\":\"zoology\"},{\"title\":\"Pair living emerged early in placental mammals.\",\"title_cn\":\"胎盘哺乳动物早期便出现了成对生活。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Walmsley SF, Olivier CA, Jaeggi AV et al.\",\"abstract\":\"It is widely assumed that the first placental mammals were solitary. Here, we tested this assumption and which ecological and life history factors are related to mammalian social organization. We compiled a comprehensive database by reviewing over 14,000 primary peer-reviewed publications on the social organization of the 5,390 extant placental mammal species. We found empirical data for 726 species across 1,473 populations: 353 populations were primarily solitary, 250 populations pair living, a\",\"doi\":\"10.1073/pnas.2528458123\",\"url\":\"https://doi.org/10.1073/pnas.2528458123\",\"pmid\":\"42520129\",\"category\":\"zoology\"},{\"title\":\"Sprint-like cardiac dynamics support repeated acrobatic lunges in foraging rorqual whales.\",\"title_cn\":\"冲刺式心脏动力学支持须鲸觅食时重复的杂技式冲刺捕食。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Blawas AM, Fahlbusch J, Barkowski J et al.\",\"abstract\":\"The dive response decreases heart rate, regulates blood flow distribution, conserves oxygen, and extends dive duration. In diving animals, dive heart rate can be modulated to meet increased demands of exercise during foraging. However, lunge-feeding rorquals represent an extreme example of exercise under breath-hold conditions: Though most of their dive time is spent gliding and filtering, lunges require high-power, acrobatic sprints to engulf massive volumes of prey-laden water. Our biologging \",\"doi\":\"10.1073/pnas.2613082123\",\"url\":\"https://doi.org/10.1073/pnas.2613082123\",\"pmid\":\"42507932\",\"category\":\"zoology\"},{\"title\":\"Dominant functional group explains global bird diversity responses to farmland abandonment.\",\"title_cn\":\"优势功能群解释了全球鸟类多样性对农田弃耕的响应。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Kitazawa M, Yamaura Y, Kawamura K et al.\",\"abstract\":\"Reversing biodiversity declines will require redesigning agricultural landscapes and their management. Farmland abandonment and intensification are emerging as major drivers of biodiversity changes, and their consequences vary widely from negative to positive among continents. Despite decades of research on agricultural biodiversity, no generalizable framework has been established to predict these variations globally, hindering the development of effective conservation strategies. Here, we combi\",\"doi\":\"10.1073/pnas.2530120123\",\"url\":\"https://doi.org/10.1073/pnas.2530120123\",\"pmid\":\"42507928\",\"category\":\"zoology\"},{\"title\":\"Echolocating bats sacrifice binaural localization cues for target-focused hearing during high-speed foraging.\",\"title_cn\":\"回声定位蝙蝠在高速觅食时牺牲双耳定位线索以聚焦目标听觉。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-28\",\"authors\":\"Häfele FT, Wisniewska DM, Vesterholm KK et al.\",\"abstract\":\"Accurate sound localization is critical to navigation and foraging in echolocating animals. During both passive listening and active echolocation, bats are thought to rely solely on interaural level differences (ILDs) between the two ears, attaining very large ILDs by orienting their outer ears apart. However, detecting weak prey echoes during high-speed foraging should instead favor target-focused pinnae that maximize sonar range and reduce clutter interference. Therefore, we propose that flyin\",\"doi\":\"10.1073/pnas.2605701123\",\"url\":\"https://doi.org/10.1073/pnas.2605701123\",\"pmid\":\"42475565\",\"category\":\"zoology\"},{\"title\":\"Human and animal morbillivirus strains causing chronic neurological infections share key genotypic and phenotypic traits.\",\"title_cn\":\"引起慢性神经系统感染的人类和动物麻疹病毒属毒株共享关键基因型和表型特征。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-14\",\"authors\":\"Daniel Roji M, Geiselhardt F, Beythien G et al.\",\"abstract\":\"Long-term persistent measles virus (MeV) infection of the central nervous system (CNS) can result in subacute sclerosing panencephalitis (SSPE), an invariably fatal late neurological complication of measles. Analogous SSPE-like chronic diseases have also been reported in adult dogs, cetaceans, and more recently harbor seals following infection by canine distemper virus (CDV), dolphin morbillivirus (DMV), and phocine distemper virus (PDV), respectively. Here, we characterize different animal morb\",\"doi\":\"10.1073/pnas.2604205123\",\"url\":\"https://doi.org/10.1073/pnas.2604205123\",\"pmid\":\"42412932\",\"category\":\"zoology\"},{\"title\":\"A transcription factor modulates dermal architecture to generate structural and pigment color diversity in lizards.\",\"title_cn\":\"一种转录因子通过调节皮肤结构，在蜥蜴中产生结构和色素颜色的多样性。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Aguilar P, Andrade P, Brejcha J et al.\",\"abstract\":\"The way organisms perceive the world influences their evolution. Many animals detect ultraviolet (UV) light invisible to humans, creating sensory contexts that alter the selective landscape for coloration. Here, we dissected the molecular basis of a UV-reflecting color morph in common wall lizards, uncovering its association with a noncoding region upstream of the transcription factor\",\"doi\":\"10.1073/pnas.2604532123\",\"url\":\"https://doi.org/10.1073/pnas.2604532123\",\"pmid\":\"42384684\",\"category\":\"zoology\"},{\"title\":\"Monitoring major biodiversity stronghold in war zones: Model predicts Lake Chad remains Africa's most important wetland for waterbirds.\",\"title_cn\":\"战乱地区主要生物多样性堡垒监测：模型预测乍得湖仍是非洲最重要的水鸟湿地。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Defos du Rau P, Godeau U, Carenton N et al.\",\"abstract\":\"Lake Chad is both one of the largest transboundary wetlands in Africa and a major biodiversity hotspot. As such, Lake Chad would require sound and long-term biodiversity monitoring, but it is also a war zone. Using several mitigation measures, we succeeded in surveying a major part of it in 2022 to estimate the abundance of wildlife. This study marked the first comprehensive population estimates for some species. Compared to previous total count approaches, we introduced an aerial distance sampl\",\"doi\":\"10.1073/pnas.2603538123\",\"url\":\"https://doi.org/10.1073/pnas.2603538123\",\"pmid\":\"42378274\",\"category\":\"zoology\"},{\"title\":\"Natural history on canvas: Brueghel knew about bird-eating noctule bats.\",\"title_cn\":\"画布上的自然史：勃鲁盖尔了解食鸟夜蝠。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Romero-Vidal P, Sánchez-Navarro S, Tena E et al.\",\"abstract\":\"A recent study has provided the first direct evidence that the greater noctule bat (\",\"doi\":\"10.1073/pnas.2536525123\",\"url\":\"https://doi.org/10.1073/pnas.2536525123\",\"pmid\":\"42372166\",\"category\":\"zoology\"},{\"title\":\"Genomic and structural evidence of SARS-CoV-2 and MERS-CoV in migratory birds.\",\"title_cn\":\"迁徙鸟类中SARS-CoV-2和MERS-CoV的基因组及结构证据。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Cao J, Liu S, Su C et al.\",\"abstract\":\"Migratory birds are the natural reservoir of influenza A virus (IAV), but their role as a carrier of SARS-CoV-2 remains unclear. Here, we report the identification of three almost full-length viral genome sequences of SARS-CoV-2 variants of concern (VOCs) in Tundra swans. These sequences are named hCoV-19/Tundra swan/Jiangxi/IMCAS_M1/2021 (IMCAS_M1), hCoV-19/Tundra swan/Jiangxi /IMCAS_M2/2021 (IMCAS_M2), and hCoV-19/Tundra swan/Jiangxi/IMCAS_M3/2021 (IMCAS_M3). IMCAS_M1 and IMCAS_M3 have the sam\",\"doi\":\"10.1073/pnas.2400023123\",\"url\":\"https://doi.org/10.1073/pnas.2400023123\",\"pmid\":\"42372155\",\"category\":\"zoology\"},{\"title\":\"Neural tissues and chondrostean traits in a Carboniferous actinopterygian.\",\"title_cn\":\"石炭纪辐鳍鱼中的神经组织和软骨硬鳞鱼特征。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Caron AM, Tietjen K, Coates MI\",\"abstract\":\"Ray-finned fishes (Actinopterygii) represent over half of extant vertebrate species, but their early evolutionary history is largely unresolved. Current phylogenetic estimates, corroborated by discoveries of preserved neural tissues, place most Palaeozoic actinopterygians outside the crown group and leave the deep roots of major extant divisions depauperate. Moreover, apparent fossil brains in early fishes are minuscule relative to endocranial chamber space, implying that endocasts are poor indi\",\"doi\":\"10.1073/pnas.2610438123\",\"url\":\"https://doi.org/10.1073/pnas.2610438123\",\"pmid\":\"42372151\",\"category\":\"zoology\"},{\"title\":\"A general framework for predicting the ecological effects of range expansions in marine systems.\",\"title_cn\":\"预测海洋系统中范围扩张生态效应的通用框架。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Beshai RA, Sorte CJB\",\"abstract\":\"Warming global temperatures are driving species to shift beyond their historical geographic ranges into novel, expanded ranges, where they may have both positive and negative effects on recipient populations. Although no framework currently exists to anticipate these effects, invasion biology theory suggests expanders' effects may be predictable from expanders' historical roles and trophic positions. We conducted a global synthesis of over 1,200 population-level effects of marine range-expanding\",\"doi\":\"10.1073/pnas.2600491123\",\"url\":\"https://doi.org/10.1073/pnas.2600491123\",\"pmid\":\"42372141\",\"category\":\"ecology\"},{\"title\":\"Unique fingerprint of marine ectotherm body size change during hyperthermal crises.\",\"title_cn\":\"海洋变温动物体型在高热危机期间变化的独特指纹。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Nätscher PS, De Baets K, Kiessling W\",\"abstract\":\"The term \\\"Lilliput Effect\\\" describes a substantial decrease in the average body size of fossil assemblages during major environmental perturbations in Earth's history, which is reported in many paleontological studies. The limited regional, temporal and taxonomic focus of most studies, however, has sparked discussions concerning its generality. Additionally, even though a negative relationship between warming and body size has been established in recent marine ectotherms, the environmental and m\",\"doi\":\"10.1073/pnas.2505564123\",\"url\":\"https://doi.org/10.1073/pnas.2505564123\",\"pmid\":\"42335231\",\"category\":\"paleontology\"},{\"title\":\"Physiology is a hidden dimension of diversity in the radiation of woodland salamanders.\",\"title_cn\":\"生理学是林地蝾螈辐射分化中一个隐藏的多样性维度。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Alomar NM, Camarillo H, Burress ED et al.\",\"abstract\":\"Morphological evolution can be explosive, producing visually spectacular adaptive radiations like Caribbean anoles, Malagasy vangas, and African Rift Lake cichlids. Yet morphological stasis, the long-term retention of a conserved body plan, is often observed across evolutionary radiations. Woodland salamanders (\",\"doi\":\"10.1073/pnas.2523895123\",\"url\":\"https://doi.org/10.1073/pnas.2523895123\",\"pmid\":\"42330273\",\"category\":\"evolution\"},{\"title\":\"Horseshoe bats foraging in the wild adjust sensing to separate prey echoes from background clutter.\",\"title_cn\":\"野生菊头蝠在觅食时调整感知以将猎物回声与背景杂波分离。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Yovel Y, Stidsholt L, Mimran Y et al.\",\"abstract\":\"How animals handle immense incoming sensory information and regulate sensing is difficult to study under natural conditions. Using miniature GPS tags with microphones we monitored the sensing of freely foraging greater horseshoe bats. Bats stayed in acoustic contact with the environment and caught insects while commuting and in short flights from a perch. Bats adjusted their call frequency to maintain the highest-frequency echoes from background in a forward-directed, spatially limited sector at\",\"doi\":\"10.1073/pnas.2525520123\",\"url\":\"https://doi.org/10.1073/pnas.2525520123\",\"pmid\":\"42330269\",\"category\":\"zoology\"},{\"title\":\"Allopatric coevolution: Migratory predators may facilitate mimicry between geographically nonoverlapping species.\",\"title_cn\":\"异域共演化：迁徙捕食者可能促进地理上不重叠物种之间的拟态。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Topper A, Ben-Oren Y, Kolodny O\",\"abstract\":\"A natural assumption in evolutionary biology is that to coevolve, species must interact with each other and should therefore co-occur. However, many evolutionary dynamics may be mediated by migratory or vector-borne agents, raising the possibility of coevolutionary interactions between allopatric species. In mimicry theory, a recurring assumption is that all species participating in a mimicry system must be sympatric, because predators must encounter both model and mimic/co-mimic to confuse betw\",\"doi\":\"10.1073/pnas.2527304123\",\"url\":\"https://doi.org/10.1073/pnas.2527304123\",\"pmid\":\"42313983\",\"category\":\"zoology\"},{\"title\":\"Dark diversity framework reconciles Darwin's naturalization conundrum for freshwater fish invasions.\",\"title_cn\":\"暗多样性框架调和了达尔文归化难题在淡水鱼类入侵中的应用。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Zhang WG, Xu M, Fan SY et al.\",\"abstract\":\"The spread of invasive species poses a major threat to global biodiversity, yet predicting successful establishment of exotic species in novel environments remains challenging. Darwin's naturalization conundrum is a longstanding debate over whether exotic species closely or distantly related to native communities are more likely to succeed. Despite its long history, empirical studies continue to yield conflicting evidence. Here, we introduce the dark diversity concept, which refers to species th\",\"doi\":\"10.1073/pnas.2604929123\",\"url\":\"https://doi.org/10.1073/pnas.2604929123\",\"pmid\":\"42268899\",\"category\":\"conservation\"},{\"title\":\"Integrating trophic importance into conservation of terrestrial vertebrates.\",\"title_cn\":\"将营养重要性纳入陆生脊椎动物的保护中。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Hao X, Holyoak M, Zhang Z et al.\",\"abstract\":\"There is global consensus on the need to prioritize conservation efforts to prevent biodiversity loss and defaunation. Most current conservation initiatives focus on areas with high species diversity or many threatened species, treating species independently and neglecting trophic interactions. To address these oversights, we developed a framework to quantify species' roles along continuums of trophic importance (TI) and global endangerment (GE), estimated from a global terrestrial meta-food web\",\"doi\":\"10.1073/pnas.2605237123\",\"url\":\"https://doi.org/10.1073/pnas.2605237123\",\"pmid\":\"42263132\",\"category\":\"zoology\"},{\"title\":\"Memory, chaos, and noise in ecological forecasting.\",\"title_cn\":\"生态预测中的记忆、混沌与噪声。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-09\",\"authors\":\"Munch SB, Rogers TL\",\"abstract\":\"Ecological populations fluctuate for reasons that are often ascribed-separately-to historical legacies, intrinsic nonlinear dynamics, or stochastic noise. Yet these forces rarely act in isolation. We assembled a global database of 302 abundance time series spanning birds, mammals, fishes, insects, and plankton to ask how memory, nonlinearity, and dynamical stability interact to shape predictability. We used empirical dynamic modeling to estimate the memory length and classified time series stabi\",\"doi\":\"10.1073/pnas.2604256123\",\"url\":\"https://doi.org/10.1073/pnas.2604256123\",\"pmid\":\"42224580\",\"category\":\"zoology\"},{\"title\":\"Female dolphins use individual vocal labels to track coercive males.\",\"title_cn\":\"雌性海豚使用个体声音标签来追踪胁迫性雄性。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Bouchard A, Allen SJ, Sørensen PM et al.\",\"abstract\":\"Animals rely on identity signaling to navigate social relationships, assess potential mates, and avoid costly interactions. While species- and group-level recognition signals can provide fitness advantages by preventing inbreeding depression and hybridization, our understanding of the role that individual identity signals can play in mate choice is notably lacking. In species with coercive mating systems, females must carefully evaluate male behavior to minimize risks while also maximizing repro\",\"doi\":\"10.1073/pnas.2531602123\",\"url\":\"https://doi.org/10.1073/pnas.2531602123\",\"pmid\":\"42224502\",\"category\":\"zoology\"},{\"title\":\"Arctic ecosystems shaped mammalian dispersal and diversification before the Cretaceous-Paleogene mass extinction.\",\"title_cn\":\"北极生态系统在白垩纪-古近纪大灭绝前塑造了哺乳动物的扩散与多样化。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-02\",\"authors\":\"Shelley SL, Eberle JJ, Erickson GM et al.\",\"abstract\":\"High-latitude terrestrial ecosystems are commonly viewed as marginal environments to deep-time evolutionary innovation, yet their role in shaping biotic dispersal, diversification, and survivorship remains poorly understood. The Upper Cretaceous Prince Creek Formation of northern Alaska (paleolatitude ~80-85°N) yields the most northerly known Mesozoic mammals and provides a rare opportunity to examine the ecological and biogeographic roles of polar terrestrial ecosystems. Here, we describe three\",\"doi\":\"10.1073/pnas.2601794123\",\"url\":\"https://doi.org/10.1073/pnas.2601794123\",\"pmid\":\"42150091\",\"category\":\"zoology\"},{\"title\":\"Language-like statistical structure arises in learned signaling: evidence from birdsong.\",\"title_cn\":\"语言类统计结构在学习信号中出现：来自鸟类鸣叫的证据。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-08-07\",\"authors\":\"Kirby S, Okanoya K, Garland EC et al.\",\"abstract\":\"All languages have statistically coherent subsequences (e.g., words) whose frequency distribution follows a power law. These properties facilitate language learning in humans, making them good candidates for arising through cultural transmission as a way to help faithful transmission across generations. Recently, both properties were found in whale song, which is also culturally transmitted, leading to the strong prediction that they should be found wherever complex sequential signaling is cultu\",\"doi\":\"10.1126/sciadv.aea3015\",\"url\":\"https://doi.org/10.1126/sciadv.aea3015\",\"pmid\":\"42566530\",\"category\":\"zoology\"},{\"title\":\"Global patterns and drivers of extinction risk in island endemic terrestrial vertebrates.\",\"title_cn\":\"岛屿特有陆生脊椎动物灭绝风险的全球格局与驱动因素\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-08-07\",\"authors\":\"Zhang Y, Wang J, Li Y et al.\",\"abstract\":\"Island endemic terrestrial vertebrates, shaped by long-term isolation and ecological specialization, are particularly vulnerable to extinction pressure in the Anthropocene. However, cross-taxon extinction patterns and their drivers remain poorly understood. Here, we compiled a global dataset of 31,865 terrestrial vertebrates, including more than 7500 island endemic species, to evaluate the patterns and drivers of extinction risk in island endemics, in comparison with continent endemics and dual-\",\"doi\":\"10.1126/sciadv.aef9781\",\"url\":\"https://doi.org/10.1126/sciadv.aef9781\",\"pmid\":\"42555717\",\"category\":\"zoology\"},{\"title\":\"Highly aquatic marine stem archosaur with soft tissue preservation.\",\"title_cn\":\"保存有软组织的极度水生海洋干群主龙类\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-31\",\"authors\":\"Wang W, Fraser NC, Spiekman SNF et al.\",\"abstract\":\"Archosauromorpha is a dominant reptile clade that primarily occupied terrestrial ecosystems with limited secondarily aquatic invasions that are poorly known. Here we report on a well-preserved Triassic reptile representing the earliest stem-archosaur to evolve unequivocal aquatic specializations. This taxon exhibits a suite of aquatic adaptations previously unknown in stem-archosaurs, such as hyperphalangy, enhanced paddle-like forelimbs, and a loss of articulation between the sacrum and pelvis,\",\"doi\":\"10.1126/sciadv.aeb7528\",\"url\":\"https://doi.org/10.1126/sciadv.aeb7528\",\"pmid\":\"42525755\",\"category\":\"ecology\"},{\"title\":\"Immunoglobulin heavy chain locus duplication in bats.\",\"title_cn\":\"蝙蝠免疫球蛋白重链基因座的重复。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-31\",\"authors\":\"Pursell T, Reers A, Mikelov A et al.\",\"abstract\":\"Bats are major reservoirs of viruses that can be transmitted to humans in zoonotic outbreaks. Antibody-mediated immunity plays an important role in shaping viral evolution and immune evasion but remains understudied in bats. All known mammals have a single immunoglobulin heavy chain (IgH) gene locus and up to two light chain loci. We have identified dual IgH loci on separate chromosomes in 26 bat species, highlighting extreme variation of immunogenetic architecture in order Chiroptera. In a mode\",\"doi\":\"10.1126/sciadv.aeb6714\",\"url\":\"https://doi.org/10.1126/sciadv.aeb6714\",\"pmid\":\"42525754\",\"category\":\"zoology\"},{\"title\":\"Genomic structural variation rescues a classic biological invader from a population bottleneck.\",\"title_cn\":\"基因组结构变异使典型生物入侵者摆脱种群瓶颈。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Osborne CA, Foote BM, Fleck SJ et al.\",\"abstract\":\"Invasion genetics presents a classic paradox: How do species successfully spread despite severe population bottlenecks? The brown treesnake (\",\"doi\":\"10.1126/sciadv.aed3656\",\"url\":\"https://doi.org/10.1126/sciadv.aed3656\",\"pmid\":\"42497265\",\"category\":\"ecology\"},{\"title\":\"Emergent patterns of island biodiversity in the Anthropocene.\",\"title_cn\":\"人类世岛屿生物多样性的涌现模式。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Matthews TJ, Sayol F, Soares FC et al.\",\"abstract\":\"Islands have long been foundational to the development of ecological and evolutionary theory, serving as model systems for studying patterns of biodiversity. However, pervasive anthropogenic impacts-particularly species extinctions and introductions-have substantially altered island ecosystems, complicating inferences drawn from contemporary data. Here, we review how these human-driven changes have reshaped key biodiversity patterns on islands, including patterns of species richness, community c\",\"doi\":\"10.1126/sciadv.aee1788\",\"url\":\"https://doi.org/10.1126/sciadv.aee1788\",\"pmid\":\"42490450\",\"category\":\"ecology\"},{\"title\":\"The legacy of privilege: Social inheritance reverses sex differences in reproductive inequality in the spotted hyena.\",\"title_cn\":\"特权的遗产：社会继承逆转了斑鬣狗繁殖不平等中的性别差异。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Mosna M, Courtiol A, Naman P et al.\",\"abstract\":\"Inequalities in reproductive success among females and males shape natural and sexual selection. For sexually reproducing species, the Darwin-Bateman paradigm predicts greater reproductive inequality in males than females. A mechanism driving reproductive inequality in humans and other animals is social inheritance of privilege. Here, we show that this mechanism can reverse the male bias in reproductive inequality. Using a 29-year dataset spanning eight generations of spotted hyenas (\",\"doi\":\"10.1126/sciadv.aee7880\",\"url\":\"https://doi.org/10.1126/sciadv.aee7880\",\"pmid\":\"42490420\",\"category\":\"zoology\"},{\"title\":\"Predictors of extinction risk in large tropical forest mammals: From global to local.\",\"title_cn\":\"大型热带森林哺乳动物灭绝风险的预测因子：从全球到局部\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-17\",\"authors\":\"Schowanek SD, Sheil D, Beaudrot L et al.\",\"abstract\":\"Studies can only guide conservation if their findings are informative at the scales at which practitioners and policy-makers operate. Yet, it is rarely tested whether large-scale studies reach similar conclusions to the smaller-scale studies on which conservation traditionally relies. We examine whether predictors of extinction risk are consistent across global, regional, and local scales, for 210 tropical forest mammal species (≥1 kg) that existed during the last 130,000 years, in 64 tropical f\",\"doi\":\"10.1126/sciadv.aeb7543\",\"url\":\"https://doi.org/10.1126/sciadv.aeb7543\",\"pmid\":\"42455935\",\"category\":\"zoology\"},{\"title\":\"Dexterous single sniffs for ethological active olfaction.\",\"title_cn\":\"灵巧单嗅探用于行为学主动嗅觉。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Gao M, Barrett JM, Fischer R et al.\",\"abstract\":\"Rhythmic sniffing is considered intrinsic to active olfaction among terrestrial mammals. However, mice are known to briefly hold food under their nares while feeding, suggesting coordination of oromanual dexterity, breathing, and olfaction for nonrhythmic single sniffs. Here, we recorded kinematics and breathing as mice foraged and fed, finding that mice indeed, with clockwork-like dexterity and millisecond timing, synchronize a single inspiration with rapid head and hand movements. These solita\",\"doi\":\"10.1126/sciadv.aed3610\",\"url\":\"https://doi.org/10.1126/sciadv.aed3610\",\"pmid\":\"42397911\",\"category\":\"zoology\"},{\"title\":\"Hemisphere-wide evidence of Early Paleoindian megaherbivore specialization.\",\"title_cn\":\"半球范围内早期古印第安人对巨型食草动物专食化的证据。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Potter BA, Chatters JC, Prates L et al.\",\"abstract\":\"The adaptive strategies of Early Paleoindians associated with the rapid and continent-wide expansions of Clovis and related Fishtail Projectile Point (FPP) complexes in the Americas have been subject to differing interpretations. Were Early Paleoindians megafauna specialists or dietary generalists? These alternative models offer profoundly different implications for Early Paleoindian prey choice, mobility, and technology. We synthesize and evaluate the zooarchaeological records of the earliest w\",\"doi\":\"10.1126/sciadv.aef9628\",\"url\":\"https://doi.org/10.1126/sciadv.aef9628\",\"pmid\":\"42384804\",\"category\":\"zoology\"},{\"title\":\"Jurassic avialan reveals stepwise evolution of bony tail in birds.\",\"title_cn\":\"侏罗纪鸟类揭示了鸟类骨尾的逐步演化。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Wang M, Tang J, Deng K et al.\",\"abstract\":\"The evolutionary assembly of the flight-adapted bird body plan encompasses some of the most profound morphological changes in terrestrial vertebrate history. Beyond feathered wings, the short pygostyle-bearing tail has been pivotal to the clade's ecological success. However, transition from the long bony tail to the short pygostyle-bearing tail remains a mystery, hindered by the scarcity of early branching avialans with transitional morphologies. Here, we report on a new avialan,\",\"doi\":\"10.1126/sciadv.aeb5202\",\"url\":\"https://doi.org/10.1126/sciadv.aeb5202\",\"pmid\":\"42384792\",\"category\":\"zoology\"},{\"title\":\"Records of compass heading for long-distance ocean migrators show mid-ocean reorientation.\",\"title_cn\":\"远洋长距离迁徙者罗盘航向记录显示洋中重新定向。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-26\",\"authors\":\"Hays GC, Stokes KL, Cerritelli G et al.\",\"abstract\":\"The mechanisms by which animals navigate during long ocean migrations to specific targets remain equivocal despite over a century of investigation. To address this question, we developed and deployed a new tag that allowed the compass heading of migrators to be remotely relayed via satellite. On transocean migrations (\\u003e1000 kilometers and mean duration 27.5 days) between nesting and foraging sites, green turtles (\",\"doi\":\"10.1126/sciadv.aed8113\",\"url\":\"https://doi.org/10.1126/sciadv.aed8113\",\"pmid\":\"42341127\",\"category\":\"zoology\"},{\"title\":\"The wisdom of crowds emerges in flocks of thousands of migrating songbirds.\",\"title_cn\":\"群体智慧涌现于数千只迁徙鸣禽的鸟群之中。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-26\",\"authors\":\"Morford J, Lewin PJ, Wynn J et al.\",\"abstract\":\"While enhanced decision-making in larger groups, known as the wisdom of crowds, has been demonstrated in controlled experimental conditions, the intractability of observing large-scale wild groups has limited the availability of evidence from natural systems. Addressing this challenge, we analyze migratory trajectories of flocks of thousands of wild songbirds extracted from 23 years of weather radar data across the Great Lakes of North America. We show that the wisdom of crowds emerged: Larger f\",\"doi\":\"10.1126/sciadv.aef3512\",\"url\":\"https://doi.org/10.1126/sciadv.aef3512\",\"pmid\":\"42341115\",\"category\":\"zoology\"},{\"title\":\"Extreme weather effects on marine predator breeding outcomes in a global climate change hotspot.\",\"title_cn\":\"极端天气对全球气候变化热点地区海洋捕食者繁殖结果的影响。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-19\",\"authors\":\"Sojitra M, Corney S, Hemer M et al.\",\"abstract\":\"Extreme weather events (EWEs) are increasing in both intensity and frequency globally. For long-lived, slow-reproducing marine predators, repeated or sequential EWE-driven breeding failures can have population-level consequences. We quantified effects of EWEs on reproductive output and identified temporal windows of vulnerability during breeding in three sentinel species across 14 colonies with varying population trajectories in Tasmania, Australia. Using long-term breeding datasets and daily we\",\"doi\":\"10.1126/sciadv.aea3220\",\"url\":\"https://doi.org/10.1126/sciadv.aea3220\",\"pmid\":\"42319917\",\"category\":\"zoology\"},{\"title\":\"Global impacts of drifting fish aggregating devices on marine protected areas.\",\"title_cn\":\"漂流式集鱼装置对海洋保护区的全球影响。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-19\",\"authors\":\"Schiller L, Villaseñor-Derbez JC, Lynham J et al.\",\"abstract\":\"Protected areas are a critical component of efforts to reverse biodiversity loss by 2050. In the ocean, free-drifting fish aggregating devices (dFADs) are released in large numbers by industrial purse seine fishing companies to help catch tuna. These devices can enter marine protected areas (MPAs) undetected, potentially leading to wildlife entanglement, plastic pollution, and habitat degradation. Here we investigate processes by which dFADs may compromise MPA objectives and assess the burden th\",\"doi\":\"10.1126/sciadv.aee6998\",\"url\":\"https://doi.org/10.1126/sciadv.aee6998\",\"pmid\":\"42308291\",\"category\":\"zoology\"},{\"title\":\"Evolution of a ZW sex determination system in sticklebacks.\",\"title_cn\":\"刺鱼中ZW性别决定系统的演化。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"Cheng X, Zou M, Wang Y et al.\",\"abstract\":\"The stickleback system offers a powerful model for investigating the evolutionary dynamics of sex chromosome differentiation. Although a ZW sex determination mechanism has previously been reported in sticklebacks, its origin and evolutionary history remain poorly resolved. Here, integrated multiomics analyses were applied to elucidate the evolutionary trajectory of the ZW system in\",\"doi\":\"10.1126/sciadv.aeb1484\",\"url\":\"https://doi.org/10.1126/sciadv.aeb1484\",\"pmid\":\"42247502\",\"category\":\"evolution\"},{\"title\":\"Rise of modern marine fishes captured in an early Paleocene Lagerstätte.\",\"title_cn\":\"现代海洋鱼类的崛起记录于古新世早期的化石库中。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"El-Sayed S, Friedman M, Salem BS et al.\",\"abstract\":\"The Cretaceous-Paleogene (K-Pg) extinction reshaped Earth's biodiversity, yet its impact on marine fishes remains debated due to gaps in the Paleocene record. Here, we report a paleotropical assemblage from the early Paleocene (Danian) of Egypt that provides a window into this transition. The Qreiya 3 Lagerstätte [62.2 million years ago (Ma)] reveals an offshore marine ecosystem with at least 21 actinopterygian taxa across nine orders, exceeding the diversity of all other Danian skeletal assembl\",\"doi\":\"10.1126/sciadv.aec8978\",\"url\":\"https://doi.org/10.1126/sciadv.aec8978\",\"pmid\":\"42234753\",\"category\":\"ecology\"},{\"title\":\"Transposons drove the evolution of a male sex-determining gene from a female gene with deep introgression across cichlids.\",\"title_cn\":\"转座子驱动了丽鱼科鱼类中一个雄性性别决定基因从雌性基因的演化，并伴随深度的种间渐渗。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"Wang L, Sun F, Yang Z et al.\",\"abstract\":\"Sex-determination mechanisms and their master regulators are diverse among vertebrates. Components of downstream regulatory pathways can sometimes be co-opted as new upstream triggers. Here, we report a notable finding of cross-pathway recruitment: A gene from the female differentiation cascade was repurposed as a male master sex-determining (MSD) gene. We identify\",\"doi\":\"10.1126/sciadv.aed6242\",\"url\":\"https://doi.org/10.1126/sciadv.aed6242\",\"pmid\":\"42234737\",\"category\":\"zoology\"},{\"title\":\"SARS-CoV-2 Delta variant re-emerges in US farmed mink and free-ranging white-tailed deer in 2022-2023.\",\"title_cn\":\"2022-2023年SARS-CoV-2德尔塔变异株在美国养殖水貂和自由放养白尾鹿中重新出现。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-07-09\",\"authors\":\"Crespo-Bellido A, Owsiany MC, Chillson NN et al.\",\"abstract\":\"American mink (Neogale vison) are susceptible to SARS-CoV-2, but little is known about virus circulation in mink since 2021. Here, in the first active surveillance study of SARS-CoV-2 in apparently healthy farmed mink in the United States, we find a ~0.9% (760/85,656) RT-PCR positivity rate among nasal swabs collected in 18 farms across six states during 2022-2023. Phylogenetic analysis of 293 viral genome sequences shows that human-adapted SARS-CoV-2 variants (e.g., Omicron) repeatedly spill ov\",\"doi\":\"10.1038/s41467-026-75363-4\",\"url\":\"https://doi.org/10.1038/s41467-026-75363-4\",\"pmid\":\"42425991\",\"category\":\"genetics\"},{\"title\":\"Global inequality in roadkill burden concentrates collision risk on threatened species in low- and middle-income countries.\",\"title_cn\":\"全球道路致死负担的不平等性使碰撞风险集中于中低收入国家的受威胁物种。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-07-01\",\"authors\":\"Li Y, Zhao Z, Chen X et al.\",\"abstract\":\"Global development relies on vast and expanding road networks, yet the global distribution of the wildlife mortality they cause remains poorly quantified. Here we show, using researcher-led surveys, global citizen-science records and a high-resolution national dataset for China, that wildlife-vehicle collisions disproportionately burden biodiversity in low- and middle-income countries. After standardising for species pools and sampling effort, low- and middle-income countries bear a heavier road\",\"doi\":\"10.1038/s41467-026-74963-4\",\"url\":\"https://doi.org/10.1038/s41467-026-74963-4\",\"pmid\":\"42386729\",\"category\":\"zoology\"},{\"title\":\"FRAME: Fine-Resolution Asymmetric Migration Estimation.\",\"title_cn\":\"FRAME：精细分辨率非对称迁移估计\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Shen H, Novembre J\",\"abstract\":\"The genetic structure of populations is often shaped by processes and events that introduce asymmetries to gene flow between geographic locations. Here, we first develop an algorithm that allows efficient computation of pairwise coalescent times in time-homogeneous models of population structure at migration-drift equilibrium. We then use the algorithm as the foundation for a new method-Fine-Resolution Asymmetric Migration Estimation (FRAME)-to infer asymmetric migration rates in spatial models \",\"doi\":\"10.1038/s41467-026-74129-2\",\"url\":\"https://doi.org/10.1038/s41467-026-74129-2\",\"pmid\":\"42337232\",\"category\":\"zoology\"},{\"title\":\"Linking species local trends from assemblage monitoring to global extinction risk.\",\"title_cn\":\"将物种集合监测中的局部趋势与全球灭绝风险联系起来。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Antão LH, Moyes F, Dornelas M et al.\",\"abstract\":\"While biodiversity is being reshaped across the globe, extinction risk assessments are lacking for most species, and a major challenge remains in understanding whether global threat status aligns with local population trends. Here, we assess whether population temporal prevalence trends are consistent with a species' global extinction risk, using over 60,000 populations of 2362 species across 978 marine and terrestrial assemblages (sampled for at least 20 years, mostly from temperate regions). W\",\"doi\":\"10.1038/s41467-026-74132-7\",\"url\":\"https://doi.org/10.1038/s41467-026-74132-7\",\"pmid\":\"42337229\",\"category\":\"ecology\"},{\"title\":\"Migratory jackpot individuals fuel rapid ecotype shifts in Galaxias fishes.\",\"title_cn\":\"洄游“大奖”个体推动加拉西亚鱼快速生态型转变。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Iwikau A, Augspurger J, Bailie MA et al.\",\"abstract\":\"Adaptation is considered essential for species facing environmental change, but our understanding of the evolution of complex ecotypes remains limited. We show that a substantial genomic cluster of co-adapted alleles has repeatedly fuelled complex life-history shifts in fishes. Specifically, the majority of strong outlier loci underpinning repeated landlocking of formerly marine-migratory Galaxias lineages are co-located on a single chromosome. Phenotypic, behavioural and genomic comparisons rev\",\"doi\":\"10.1038/s41467-026-74946-5\",\"url\":\"https://doi.org/10.1038/s41467-026-74946-5\",\"pmid\":\"42336867\",\"category\":\"zoology\"},{\"title\":\"Ground squirrel coprolites preserve complex archives of ancient environmental DNA over 700,000 years.\",\"title_cn\":\"地松鼠粪化石保存了超过70万年的复杂古环境DNA档案。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-09\",\"authors\":\"Murchie TJ, Cocker SL, Baleka S et al.\",\"abstract\":\"Permafrost-preserved ground squirrel (Urocitellus) burrows in Yukon, Canada contain coprolites (palaeofaeces) that span from the Holocene to at least the Middle Pleistocene (~700 kya). Using shotgun metagenomics and targeted enrichment, we recover a rich, multi-taxon spectrum of ancient environmental DNA from these pellets, including: plants, insects, microbes, and megafauna consistent with eastern Beringian ecosystems. These coprolites consistently preserve an abundance of eukaryotic DNA, enabl\",\"doi\":\"10.1038/s41467-026-72977-6\",\"url\":\"https://doi.org/10.1038/s41467-026-72977-6\",\"pmid\":\"42265123\",\"category\":\"zoology\"},{\"title\":\"A pegivirus associated with encephalitis in red-legged partridges shows neurotropism across avian species.\",\"title_cn\":\"一种与红腿鹧鸪脑炎相关的佩吉病毒在禽类物种间表现出嗜神经性。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-05\",\"authors\":\"Matos M, Bilic I, Viloux N et al.\",\"abstract\":\"Pegiviruses are generally regarded as non-pathogenic viruses with controversial clinical significance. Here, we describe an avian pegivirus (partridge pegivirus, ParPgV) associated with field outbreaks of encephalitis in red-legged partridges (Alectoris rufa). Next-generation sequencing identified ParPgV in brain tissues, revealing two distinct avian-origin pegiviruses. Histopathology and electron microscopy revealed encephalitic lesions, neuronal degeneration, and viral particles within neurons\",\"doi\":\"10.1038/s41467-026-73858-8\",\"url\":\"https://doi.org/10.1038/s41467-026-73858-8\",\"pmid\":\"42248885\",\"category\":\"zoology\"},{\"title\":\"Quantification of molar sub-regions suggests increasing herbivory during primate origins.\",\"title_cn\":\"臼齿亚区域量化表明灵长类起源期间食草性增强。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-05\",\"authors\":\"Bradley-Cronkwright M, Anaya A, Fulwood EL et al.\",\"abstract\":\"We investigated patterns of evolutionary changes to primate molar morphology, focused on the front-most (mesial) region. Methodological constraints have prevented objectively quantifying anatomical sub-regions to conduct tests of the evolutionary processes that shaped them. Previously, sub-regions across a dental surface were qualitatively scored or subjectively described. We overcame this methodological constraint with Hecate, an algorithm incorporating computer vision and machine learning. Hec\",\"doi\":\"10.1038/s41467-026-73688-8\",\"url\":\"https://doi.org/10.1038/s41467-026-73688-8\",\"pmid\":\"42248848\",\"category\":\"evolution\"},{\"title\":\"Multiple modes of selection underlie repeated and human-mediated adaptation in a formerly migratory fish.\",\"title_cn\":\"多种选择模式共同驱动一种曾迁徙鱼类的重复性及人为介导的适应性进化。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Corcoran RM, Schultz ET, Velotta JP\",\"abstract\":\"The extent to which we can predict evolution is crucial in our era of rapid anthropogenic change. Alewives (Alosa pseudoharengus) in the Atlantic coastal USA are a unique model to test for evolutionary predictability in an anthropogenic context, as multiple, formerly anadromous (migratory from ocean to freshwater) populations have been independently restricted to freshwater (landlocked) by dams built in the last 350 years. Landlocked alewives show parallel changes in life history, feeding morpho\",\"doi\":\"10.1093/molbev/msag149\",\"url\":\"https://doi.org/10.1093/molbev/msag149\",\"pmid\":\"42295111\",\"category\":\"zoology\"},{\"title\":\"Adaptive evolution of endothelial nitric oxide synthase (NOS3) may reduce cetacean susceptibility to decompression sickness.\",\"title_cn\":\"内皮型一氧化氮合酶（NOS3）的适应性进化可能降低鲸类对减压病的易感性。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Tian R, Zhao L, Li T et al.\",\"abstract\":\"Cetaceans tolerate repeated diving bouts. While the extent to which cetaceans experience decompression sickness remains debated, this group of fully aquatic mammals must have evolved a tolerance to damaging nitrogen (N2) gas bubbles that can form during overly rapid ascents or after prolonged dives. Here, we present the first in-depth molecular evolutionary analysis of the nitric oxide synthase gene family across cetaceans and identify cetacean-specific amino acid substitutions in NOS3 (encoding\",\"doi\":\"10.1093/molbev/msag144\",\"url\":\"https://doi.org/10.1093/molbev/msag144\",\"pmid\":\"42275597\",\"category\":\"zoology\"},{\"title\":\"Mutation rate estimate and population genomic analysis reveals decline of koalas prior to human arrival.\",\"title_cn\":\"突变率估计与群体基因组分析揭示考拉在人类到来之前的种群衰退。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Kovacs TGL, Foley NM, Silver LW et al.\",\"abstract\":\"The koala (Phascolarctos cinereus), an iconic Australian marsupial, has experienced substantial historical and contemporary population declines. Identifying the drivers of these declines has been hindered by limited genomic data and uncertainty regarding the koala mutation rate. Here, we report a direct estimate of the koala mutation rate, based on genome sequences of four parent-offspring trios, yielding a mean of 6.12 × 10-9 mutations per base pair per generation (95% confidence interval: 5.03\",\"doi\":\"10.1093/molbev/msag108\",\"url\":\"https://doi.org/10.1093/molbev/msag108\",\"pmid\":\"42262248\",\"category\":\"ecology\"},{\"title\":\"Phylogenomic analysis of vocal fold length evolution reveals links between vocal and auditory systems in terrestrial mammals.\",\"title_cn\":\"声带长度演化的系统发育基因组学分析揭示陆生哺乳动物发声系统与听觉系统之间的联系。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-07-02\",\"authors\":\"Zhou X, Liu F, Liu M et al.\",\"abstract\":\"Vocal fold length is a primary anatomical determinant of pitch and fundamental frequency in terrestrial mammal vocalizations, playing a key role in social communication, mate attraction, and competition. However, its phenotypic diversification and genetic basis remain unclear. Here, using a phylogenetic genotype-to-phenotype mapping (PhyloG2P) framework to 75 species representing Primates, Carnivora, and Artiodactyla, we investigate the evolutionary dynamics and genetic architecture of relative \",\"doi\":\"10.1093/molbev/msag126\",\"url\":\"https://doi.org/10.1093/molbev/msag126\",\"pmid\":\"42184971\",\"category\":\"zoology\"},{\"title\":\"Exploring legal- and health-risk messaging to reduce demand for elephant skin.\",\"title_cn\":\"探索法律与健康风险信息传播以减少对象牙皮肤的需求\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Duan B, Posada-Baynham Z, Yong J et al.\",\"abstract\":\"Asian elephants (Elephas maximus) are poached for an illegal trade in their skins, which are used in traditional medicine in Africa and Asia. We explored whether messages about the legal and health risks of using elephant skin for medicinal purposes (stomach illness) could reduce such consumption. We conducted a randomized controlled trial intervention experiment based on a health belief model. We showed 1673 residents at China's Yunnan-Myanmar border comic strips that portrayed these risks (leg\",\"doi\":\"10.1111/cobi.70342\",\"url\":\"https://doi.org/10.1111/cobi.70342\",\"pmid\":\"42322633\",\"category\":\"conservation\"},{\"title\":\"Uncovering correlates of decline and critical
