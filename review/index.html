:\"半球范围内早期古印第安人对巨型食草动物专食化的证据。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Potter BA, Chatters JC, Prates L et al.\",\"abstract\":\"The adaptive strategies of Early Paleoindians associated with the rapid and continent-wide expansions of Clovis and related Fishtail Projectile Point (FPP) complexes in the Americas have been subject to differing interpretations. Were Early Paleoindians megafauna specialists or dietary generalists? These alternative models offer profoundly different implications for Early Paleoindian prey choice, mobility, and technology. We synthesize and evaluate the zooarchaeological records of the earliest w\",\"doi\":\"10.1126/sciadv.aef9628\",\"url\":\"https://doi.org/10.1126/sciadv.aef9628\",\"pmid\":\"42384804\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过综合评估美洲最早期的动物考古记录，在半球范围内验证了早期古印第安人（克洛维斯及相关鱼尾形投射尖状器文化）对巨型食草动物存在专食化倾向，获得了相应研究进展，为理解早期人类捕食策略、流动性及技术选择提供了相关研究价值。\"},{\"title\":\"Jurassic avialan reveals stepwise evolution of bony tail in birds.\",\"title_cn\":\"侏罗纪鸟类揭示了鸟类骨尾的逐步演化。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Wang M, Tang J, Deng K et al.\",\"abstract\":\"The evolutionary assembly of the flight-adapted bird body plan encompasses some of the most profound morphological changes in terrestrial vertebrate history. Beyond feathered wings, the short pygostyle-bearing tail has been pivotal to the clade's ecological success. However, transition from the long bony tail to the short pygostyle-bearing tail remains a mystery, hindered by the scarcity of early branching avialans with transitional morphologies. Here, we report on a new avialan,\",\"doi\":\"10.1126/sciadv.aeb5202\",\"url\":\"https://doi.org/10.1126/sciadv.aeb5202\",\"pmid\":\"42384792\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析新发现的侏罗纪鸟类化石，在早期鸟类过渡形态研究的基础上，揭示了鸟类骨尾从长尾向短尾逐步演化的过程，获得了关于尾综骨形态演化的新认识，为理解鸟类飞行适应及相关形态演化提供了重要参考。\"},{\"title\":\"Records of compass heading for long-distance ocean migrators show mid-ocean reorientation.\",\"title_cn\":\"远洋长距离迁徙者罗盘航向记录显示洋中重新定向。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-26\",\"authors\":\"Hays GC, Stokes KL, Cerritelli G et al.\",\"abstract\":\"The mechanisms by which animals navigate during long ocean migrations to specific targets remain equivocal despite over a century of investigation. To address this question, we developed and deployed a new tag that allowed the compass heading of migrators to be remotely relayed via satellite. On transocean migrations (\\u003e1000 kilometers and mean duration 27.5 days) between nesting and foraging sites, green turtles (\",\"doi\":\"10.1126/sciadv.aed8113\",\"url\":\"https://doi.org/10.1126/sciadv.aed8113\",\"pmid\":\"42341127\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过开发并部署可经卫星远程传输迁徙者罗盘航向的新型标记装置，在绿海龟于筑巢地与觅食地之间跨洋迁徙（距离超1000公里、平均历时27.5天）的研究基础上，记录了其洋中重新定向行为，获得了关于远洋长距离迁徙导航机制的相关研究进展，为理解动物在特定目标迁徙中的定向策略提供了相应价值。\"},{\"title\":\"The wisdom of crowds emerges in flocks of thousands of migrating songbirds.\",\"title_cn\":\"群体智慧涌现于数千只迁徙鸣禽的鸟群之中。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-26\",\"authors\":\"Morford J, Lewin PJ, Wynn J et al.\",\"abstract\":\"While enhanced decision-making in larger groups, known as the wisdom of crowds, has been demonstrated in controlled experimental conditions, the intractability of observing large-scale wild groups has limited the availability of evidence from natural systems. Addressing this challenge, we analyze migratory trajectories of flocks of thousands of wild songbirds extracted from 23 years of weather radar data across the Great Lakes of North America. We show that the wisdom of crowds emerged: Larger f\",\"doi\":\"10.1126/sciadv.aef3512\",\"url\":\"https://doi.org/10.1126/sciadv.aef3512\",\"pmid\":\"42341115\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析北美五大湖区23年天气雷达数据提取的数千只野生鸣禽迁徙轨迹，在自然大规模群体观测的基础上，验证了群体智慧在更大鸟群中涌现的现象，获得了相应研究进展，为理解野生群体决策机制提供了相关研究价值。\"},{\"title\":\"Extreme weather effects on marine predator breeding outcomes in a global climate change hotspot.\",\"title_cn\":\"极端天气对全球气候变化热点地区海洋捕食者繁殖结果的影响。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-19\",\"authors\":\"Sojitra M, Corney S, Hemer M et al.\",\"abstract\":\"Extreme weather events (EWEs) are increasing in both intensity and frequency globally. For long-lived, slow-reproducing marine predators, repeated or sequential EWE-driven breeding failures can have population-level consequences. We quantified effects of EWEs on reproductive output and identified temporal windows of vulnerability during breeding in three sentinel species across 14 colonies with varying population trajectories in Tasmania, Australia. Using long-term breeding datasets and daily we\",\"doi\":\"10.1126/sciadv.aea3220\",\"url\":\"https://doi.org/10.1126/sciadv.aea3220\",\"pmid\":\"42319917\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过长期繁殖数据集与每日天气数据，在澳大利亚塔斯马尼亚14个种群轨迹各异的群落中，量化了极端天气事件对三种哨兵海洋捕食者繁殖产出的影响，并识别了繁殖期易受干扰的时间窗口，发现重复或连续的极端天气驱动的繁殖失败可能产生种群层面的后果，为气候变化热点地区相关物种保护提供了参考。\"},{\"title\":\"Global impacts of drifting fish aggregating devices on marine protected areas.\",\"title_cn\":\"漂流式集鱼装置对海洋保护区的全球影响。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-19\",\"authors\":\"Schiller L, Villaseñor-Derbez JC, Lynham J et al.\",\"abstract\":\"Protected areas are a critical component of efforts to reverse biodiversity loss by 2050. In the ocean, free-drifting fish aggregating devices (dFADs) are released in large numbers by industrial purse seine fishing companies to help catch tuna. These devices can enter marine protected areas (MPAs) undetected, potentially leading to wildlife entanglement, plastic pollution, and habitat degradation. Here we investigate processes by which dFADs may compromise MPA objectives and assess the burden th\",\"doi\":\"10.1126/sciadv.aee6998\",\"url\":\"https://doi.org/10.1126/sciadv.aee6998\",\"pmid\":\"42308291\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析漂流式集鱼装置（dFADs）的释放与漂移过程，在工业围网渔业广泛使用此类装置捕捞金枪鱼的背景下，发现其可未被察觉地进入海洋保护区，可能引发野生动物缠绕、塑料污染及栖息地退化，验证了dFADs对保护区目标构成潜在威胁的机制，获得了关于其全球影响范围的相应研究进展，为评估和缓解相关生态风险提供了科学依据。\"},{\"title\":\"Evolution of a ZW sex determination system in sticklebacks.\",\"title_cn\":\"刺鱼中ZW性别决定系统的演化。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"Cheng X, Zou M, Wang Y et al.\",\"abstract\":\"The stickleback system offers a powerful model for investigating the evolutionary dynamics of sex chromosome differentiation. Although a ZW sex determination mechanism has previously been reported in sticklebacks, its origin and evolutionary history remain poorly resolved. Here, integrated multiomics analyses were applied to elucidate the evolutionary trajectory of the ZW system in\",\"doi\":\"10.1126/sciadv.aeb1484\",\"url\":\"https://doi.org/10.1126/sciadv.aeb1484\",\"pmid\":\"42247502\",\"category\":\"evolution\",\"ai_summary\":\"该研究团队通过整合多组学分析，在刺鱼中已报道的ZW性别决定机制基础上，探究了其起源与演化历史，发现并验证了ZW系统的演化轨迹，获得了关于性别染色体分化动态的相应研究进展，为理解刺鱼类性别决定系统的演化提供了相关研究的价值。\"},{\"title\":\"Rise of modern marine fishes captured in an early Paleocene Lagerstätte.\",\"title_cn\":\"现代海洋鱼类的崛起记录于古新世早期的化石库中。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"El-Sayed S, Friedman M, Salem BS et al.\",\"abstract\":\"The Cretaceous-Paleogene (K-Pg) extinction reshaped Earth's biodiversity, yet its impact on marine fishes remains debated due to gaps in the Paleocene record. Here, we report a paleotropical assemblage from the early Paleocene (Danian) of Egypt that provides a window into this transition. The Qreiya 3 Lagerstätte [62.2 million years ago (Ma)] reveals an offshore marine ecosystem with at least 21 actinopterygian taxa across nine orders, exceeding the diversity of all other Danian skeletal assembl\",\"doi\":\"10.1126/sciadv.aec8978\",\"url\":\"https://doi.org/10.1126/sciadv.aec8978\",\"pmid\":\"42234753\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过分析埃及古新世早期（达宁期）Qreiya 3化石库（约6220万年前），在相关研究对象的基础上，发现该远洋海洋生态系统包含至少21个辐鳍鱼分类单元、隶属9个目，其多样性超过其他所有达宁期骨骼化石组合，验证了现代海洋鱼类在K-Pg灭绝后的快速崛起，获得了相应研究进展，为理解海洋鱼类演化提供了相关价值。\"},{\"title\":\"Transposons drove the evolution of a male sex-determining gene from a female gene with deep introgression across cichlids.\",\"title_cn\":\"转座子驱动了丽鱼科鱼类中一个雄性性别决定基因从雌性基因的演化，并伴随深度的种间渐渗。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"Wang L, Sun F, Yang Z et al.\",\"abstract\":\"Sex-determination mechanisms and their master regulators are diverse among vertebrates. Components of downstream regulatory pathways can sometimes be co-opted as new upstream triggers. Here, we report a notable finding of cross-pathway recruitment: A gene from the female differentiation cascade was repurposed as a male master sex-determining (MSD) gene. We identify\",\"doi\":\"10.1126/sciadv.aed6242\",\"url\":\"https://doi.org/10.1126/sciadv.aed6242\",\"pmid\":\"42234737\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过基因组与演化分析，在丽鱼科鱼类性别决定机制研究基础上，发现雌性分化通路中的一个基因被转座子驱动重塑为雄性主性别决定基因，并伴随深度的种间渐渗。该成果揭示了性别决定通路间的交叉招募机制，为理解脊椎动物性别决定基因的演化起源提供了新视角。\"},{\"title\":\"SARS-CoV-2 Delta variant re-emerges in US farmed mink and free-ranging white-tailed deer in 2022-2023.\",\"title_cn\":\"2022-2023年SARS-CoV-2德尔塔变异株在美国养殖水貂和自由放养白尾鹿中重新出现。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-07-09\",\"authors\":\"Crespo-Bellido A, Owsiany MC, Chillson NN et al.\",\"abstract\":\"American mink (Neogale vison) are susceptible to SARS-CoV-2, but little is known about virus circulation in mink since 2021. Here, in the first active surveillance study of SARS-CoV-2 in apparently healthy farmed mink in the United States, we find a ~0.9% (760/85,656) RT-PCR positivity rate among nasal swabs collected in 18 farms across six states during 2022-2023. Phylogenetic analysis of 293 viral genome sequences shows that human-adapted SARS-CoV-2 variants (e.g., Omicron) repeatedly spill ov\",\"doi\":\"10.1038/s41467-026-75363-4\",\"url\":\"https://doi.org/10.1038/s41467-026-75363-4\",\"pmid\":\"42425991\",\"category\":\"genetics\",\"ai_summary\":\"该研究团队通过主动监测和系统发育分析，在2022-2023年美国六个州18个养殖场的85,656份水貂鼻拭子样本中，发现约0.9%的RT-PCR阳性率，并基于293条病毒基因组序列，验证了德尔塔变异株在养殖水貂和自由放养白尾鹿中的重新出现，获得了关于病毒跨物种传播动态的相应研究进展，为理解SARS-CoV-2在野生动物中的持续循环及潜在公共卫生风险提供了相关研究价值。\"},{\"title\":\"Global inequality in roadkill burden concentrates collision risk on threatened species in low- and middle-income countries.\",\"title_cn\":\"全球道路致死负担的不平等性使碰撞风险集中于中低收入国家的受威胁物种。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-07-01\",\"authors\":\"Li Y, Zhao Z, Chen X et al.\",\"abstract\":\"Global development relies on vast and expanding road networks, yet the global distribution of the wildlife mortality they cause remains poorly quantified. Here we show, using researcher-led surveys, global citizen-science records and a high-resolution national dataset for China, that wildlife-vehicle collisions disproportionately burden biodiversity in low- and middle-income countries. After standardising for species pools and sampling effort, low- and middle-income countries bear a heavier road\",\"doi\":\"10.1038/s41467-026-74963-4\",\"url\":\"https://doi.org/10.1038/s41467-026-74963-4\",\"pmid\":\"42386729\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过整合研究者主导调查、全球公民科学记录及中国高分辨率国家数据集，在评估全球道路网络对野生动物致死影响的基础上，发现中低收入国家的道路致死负担不成比例地集中于受威胁物种，且经物种库和采样努力标准化后其碰撞风险更高，获得了全球道路致死不平等性的量化进展，为道路生态学与生物多样性保护的相关研究提供了重要参考价值。\"},{\"title\":\"FRAME: Fine-Resolution Asymmetric Migration Estimation.\",\"title_cn\":\"FRAME：精细分辨率非对称迁移估计\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Shen H, Novembre J\",\"abstract\":\"The genetic structure of populations is often shaped by processes and events that introduce asymmetries to gene flow between geographic locations. Here, we first develop an algorithm that allows efficient computation of pairwise coalescent times in time-homogeneous models of population structure at migration-drift equilibrium. We then use the algorithm as the foundation for a new method-Fine-Resolution Asymmetric Migration Estimation (FRAME)-to infer asymmetric migration rates in spatial models \",\"doi\":\"10.1038/s41467-026-74129-2\",\"url\":\"https://doi.org/10.1038/s41467-026-74129-2\",\"pmid\":\"42337232\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过开发高效计算迁移-漂移平衡状态下成对溯祖时间的算法，在此基础上提出FRAME方法，用于推断空间模型中的非对称迁移率，验证了该方法在精细分辨率下估计非对称基因流的有效性，获得了相应研究进展，为理解种群遗传结构形成过程提供了相关研究价值。\"},{\"title\":\"Linking species local trends from assemblage monitoring to global extinction risk.\",\"title_cn\":\"将物种集合监测中的局部趋势与全球灭绝风险联系起来。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Antão LH, Moyes F, Dornelas M et al.\",\"abstract\":\"While biodiversity is being reshaped across the globe, extinction risk assessments are lacking for most species, and a major challenge remains in understanding whether global threat status aligns with local population trends. Here, we assess whether population temporal prevalence trends are consistent with a species' global extinction risk, using over 60,000 populations of 2362 species across 978 marine and terrestrial assemblages (sampled for at least 20 years, mostly from temperate regions). W\",\"doi\":\"10.1038/s41467-026-74132-7\",\"url\":\"https://doi.org/10.1038/s41467-026-74132-7\",\"pmid\":\"42337229\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过分析978个海洋与陆地生物集合中2362个物种的逾6万个种群数据（采样至少20年，多来自温带地区），在评估物种局部种群时间趋势的基础上，发现局部趋势与全球灭绝风险状态存在一致性，获得了将集合监测与全球威胁评估相联系的研究进展，为利用局部监测数据推断物种全球受威胁程度提供了参考价值。\"},{\"title\":\"Migratory jackpot individuals fuel rapid ecotype shifts in Galaxias fishes.\",\"title_cn\":\"洄游“大奖”个体推动加拉西亚鱼快速生态型转变。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Iwikau A, Augspurger J, Bailie MA et al.\",\"abstract\":\"Adaptation is considered essential for species facing environmental change, but our understanding of the evolution of complex ecotypes remains limited. We show that a substantial genomic cluster of co-adapted alleles has repeatedly fuelled complex life-history shifts in fishes. Specifically, the majority of strong outlier loci underpinning repeated landlocking of formerly marine-migratory Galaxias lineages are co-located on a single chromosome. Phenotypic, behavioural and genomic comparisons rev\",\"doi\":\"10.1038/s41467-026-74946-5\",\"url\":\"https://doi.org/10.1038/s41467-026-74946-5\",\"pmid\":\"42336867\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过基因组与表型行为比较，在洄游性加拉西亚鱼多次陆封化的基础上，发现多数强离群位点共定位于单条染色体，构成共适应等位基因簇，反复驱动复杂生活史转变，获得相应研究进展，为理解物种适应环境变化的快速生态型演化提供了相关价值。\"},{\"title\":\"Ground squirrel coprolites preserve complex archives of ancient environmental DNA over 700,000 years.\",\"title_cn\":\"地松鼠粪化石保存了超过70万年的复杂古环境DNA档案。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-09\",\"authors\":\"Murchie TJ, Cocker SL, Baleka S et al.\",\"abstract\":\"Permafrost-preserved ground squirrel (Urocitellus) burrows in Yukon, Canada contain coprolites (palaeofaeces) that span from the Holocene to at least the Middle Pleistocene (~700 kya). Using shotgun metagenomics and targeted enrichment, we recover a rich, multi-taxon spectrum of ancient environmental DNA from these pellets, including: plants, insects, microbes, and megafauna consistent with eastern Beringian ecosystems. These coprolites consistently preserve an abundance of eukaryotic DNA, enabl\",\"doi\":\"10.1038/s41467-026-72977-6\",\"url\":\"https://doi.org/10.1038/s41467-026-72977-6\",\"pmid\":\"42265123\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过鸟枪法宏基因组学和靶向富集方法，在加拿大育空地区永久冻土保存的地松鼠粪化石（可追溯至至少70万年前的中更新世）基础上，恢复了涵盖植物、昆虫、微生物及大型动物等多类群的丰富古环境DNA档案，获得了与东白令陆桥生态系统相符的相应研究进展，为理解该区域古生态与生物多样性演化提供了相关研究价值。\"},{\"title\":\"A pegivirus associated with encephalitis in red-legged partridges shows neurotropism across avian species.\",\"title_cn\":\"一种与红腿鹧鸪脑炎相关的佩吉病毒在禽类物种间表现出嗜神经性。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-05\",\"authors\":\"Matos M, Bilic I, Viloux N et al.\",\"abstract\":\"Pegiviruses are generally regarded as non-pathogenic viruses with controversial clinical significance. Here, we describe an avian pegivirus (partridge pegivirus, ParPgV) associated with field outbreaks of encephalitis in red-legged partridges (Alectoris rufa). Next-generation sequencing identified ParPgV in brain tissues, revealing two distinct avian-origin pegiviruses. Histopathology and electron microscopy revealed encephalitic lesions, neuronal degeneration, and viral particles within neurons\",\"doi\":\"10.1038/s41467-026-73858-8\",\"url\":\"https://doi.org/10.1038/s41467-026-73858-8\",\"pmid\":\"42248885\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过下一代测序和组织病理学、电镜技术，在红腿鹧鸪脑炎暴发相关研究对象的基础上，发现了一种禽类佩吉病毒（ParPgV）存在于脑组织中，并鉴定出两种禽源佩吉病毒，观察到脑炎病变、神经元变性及神经元内病毒颗粒，验证了该病毒在禽类物种间表现出嗜神经性，获得了相应研究进展，为禽类脑炎相关病毒学研究提供了参考价值。\"},{\"title\":\"Quantification of molar sub-regions suggests increasing herbivory during primate origins.\",\"title_cn\":\"臼齿亚区域量化表明灵长类起源期间食草性增强。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-05\",\"authors\":\"Bradley-Cronkwright M, Anaya A, Fulwood EL et al.\",\"abstract\":\"We investigated patterns of evolutionary changes to primate molar morphology, focused on the front-most (mesial) region. Methodological constraints have prevented objectively quantifying anatomical sub-regions to conduct tests of the evolutionary processes that shaped them. Previously, sub-regions across a dental surface were qualitatively scored or subjectively described. We overcame this methodological constraint with Hecate, an algorithm incorporating computer vision and machine learning. Hec\",\"doi\":\"10.1038/s41467-026-73688-8\",\"url\":\"https://doi.org/10.1038/s41467-026-73688-8\",\"pmid\":\"42248848\",\"category\":\"evolution\",\"ai_summary\":\"该研究团队通过整合计算机视觉与机器学习的Hecate算法，在灵长类臼齿形态演化研究的基础上，客观量化了臼齿近中区域亚结构，克服了以往定性描述的限制，验证了灵长类起源期间食草性增强的演化趋势，获得了相应研究进展，为理解早期灵长类食性适应提供了方法学价值。\"},{\"title\":\"Multiple modes of selection underlie repeated and human-mediated adaptation in a formerly migratory fish.\",\"title_cn\":\"多种选择模式共同驱动一种曾迁徙鱼类的重复性及人为介导的适应性进化。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Corcoran RM, Schultz ET, Velotta JP\",\"abstract\":\"The extent to which we can predict evolution is crucial in our era of rapid anthropogenic change. Alewives (Alosa pseudoharengus) in the Atlantic coastal USA are a unique model to test for evolutionary predictability in an anthropogenic context, as multiple, formerly anadromous (migratory from ocean to freshwater) populations have been independently restricted to freshwater (landlocked) by dams built in the last 350 years. Landlocked alewives show parallel changes in life history, feeding morpho\",\"doi\":\"10.1093/molbev/msag149\",\"url\":\"https://doi.org/10.1093/molbev/msag149\",\"pmid\":\"42295111\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过比较分析美国大西洋沿岸多种曾溯河洄游的灰西鲱（Alosa pseudoharengus）种群，在近350年因水坝阻隔而独立转为陆封型的研究基础上，验证了多种选择模式共同驱动其重复性及人为介导的适应性进化，获得了关于进化可预测性的相应研究进展，为理解人为环境变化下的进化规律提供了相关价值。\"},{\"title\":\"Adaptive evolution of endothelial nitric oxide synthase (NOS3) may reduce cetacean susceptibility to decompression sickness.\",\"title_cn\":\"内皮型一氧化氮合酶（NOS3）的适应性进化可能降低鲸类对减压病的易感性。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Tian R, Zhao L, Li T et al.\",\"abstract\":\"Cetaceans tolerate repeated diving bouts. While the extent to which cetaceans experience decompression sickness remains debated, this group of fully aquatic mammals must have evolved a tolerance to damaging nitrogen (N2) gas bubbles that can form during overly rapid ascents or after prolonged dives. Here, we present the first in-depth molecular evolutionary analysis of the nitric oxide synthase gene family across cetaceans and identify cetacean-specific amino acid substitutions in NOS3 (encoding\",\"doi\":\"10.1093/molbev/msag144\",\"url\":\"https://doi.org/10.1093/molbev/msag144\",\"pmid\":\"42275597\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分子进化分析，在鲸类一氧化氮合酶基因家族研究的基础上，发现NOS3基因存在鲸类特异性氨基酸替换，可能通过适应性进化降低鲸类对减压病的易感性，获得了相应研究进展，为理解鲸类耐受反复潜水行为的分子机制提供了相关研究价值。\"},{\"title\":\"Mutation rate estimate and population genomic analysis reveals decline of koalas prior to human arrival.\",\"title_cn\":\"突变率估计与群体基因组分析揭示考拉在人类到来之前的种群衰退。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Kovacs TGL, Foley NM, Silver LW et al.\",\"abstract\":\"The koala (Phascolarctos cinereus), an iconic Australian marsupial, has experienced substantial historical and contemporary population declines. Identifying the drivers of these declines has been hindered by limited genomic data and uncertainty regarding the koala mutation rate. Here, we report a direct estimate of the koala mutation rate, based on genome sequences of four parent-offspring trios, yielding a mean of 6.12 × 10-9 mutations per base pair per generation (95% confidence interval: 5.03\",\"doi\":\"10.1093/molbev/msag108\",\"url\":\"https://doi.org/10.1093/molbev/msag108\",\"pmid\":\"42262248\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过分析四个亲本-子代三人组的基因组序列，直接估算了考拉的突变率，平均为每代每碱基对6.12×10⁻⁹（95%置信区间：5.03），并在此基础上进行群体基因组分析，发现考拉种群在人类到来之前已出现衰退。该研究为理解考拉历史种群动态及保护管理提供了相关研究价值。\"},{\"title\":\"Phylogenomic analysis of vocal fold length evolution reveals links between vocal and auditory systems in terrestrial mammals.\",\"title_cn\":\"声带长度演化的系统发育基因组学分析揭示陆生哺乳动物发声系统与听觉系统之间的联系。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-07-02\",\"authors\":\"Zhou X, Liu F, Liu M et al.\",\"abstract\":\"Vocal fold length is a primary anatomical determinant of pitch and fundamental frequency in terrestrial mammal vocalizations, playing a key role in social communication, mate attraction, and competition. However, its phenotypic diversification and genetic basis remain unclear. Here, using a phylogenetic genotype-to-phenotype mapping (PhyloG2P) framework to 75 species representing Primates, Carnivora, and Artiodactyla, we investigate the evolutionary dynamics and genetic architecture of relative \",\"doi\":\"10.1093/molbev/msag126\",\"url\":\"https://doi.org/10.1093/molbev/msag126\",\"pmid\":\"42184971\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过系统发育基因组学方法，在涵盖灵长类、食肉目和偶蹄目共75个物种的声带长度演化研究基础上，发现声带长度与听觉系统相关基因存在演化关联，揭示了陆生哺乳动物发声与听觉系统间的潜在联系，获得了相应研究进展，为理解哺乳动物声音通讯的协同演化提供了相关价值。\"},{\"title\":\"Exploring legal- and health-risk messaging to reduce demand for elephant skin.\",\"title_cn\":\"探索法律与健康风险信息传播以减少对象牙皮肤的需求\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Duan B, Posada-Baynham Z, Yong J et al.\",\"abstract\":\"Asian elephants (Elephas maximus) are poached for an illegal trade in their skins, which are used in traditional medicine in Africa and Asia. We explored whether messages about the legal and health risks of using elephant skin for medicinal purposes (stomach illness) could reduce such consumption. We conducted a randomized controlled trial intervention experiment based on a health belief model. We showed 1673 residents at China's Yunnan-Myanmar border comic strips that portrayed these risks (leg\",\"doi\":\"10.1111/cobi.70342\",\"url\":\"https://doi.org/10.1111/cobi.70342\",\"pmid\":\"42322633\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过基于健康信念模型的随机对照试验干预实验，在1673名中国云南-缅甸边境居民中，探索了关于使用象皮入药（治疗胃病）的法律与健康风险信息传播效果，验证了相关风险信息对象皮需求的影响，获得了相应研究进展，为减少非法野生动物产品消费的相关研究提供了参考。\"},{\"title\":\"Uncovering correlates of decline and critical refuges for a threatened terrestrial mammal.\",\"title_cn\":\"揭示受威胁陆生哺乳动物种群衰退的相关因素及关键庇护所。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Maitz NM, Ward MS, Rhodes JR et al.\",\"abstract\":\"Globally, the geographic ranges of numerous species are contracting. Identifying spatiotemporal patterns of threat impact can illuminate why species decline in some parts of their range but persist in others. We developed a correlative approach to identify species' response thresholds and locate ecological refuge areas associated with persistence to inform conservation planning and management. We integrated changes in realized niche characteristics for a threatened Australian mammal, the brush-t\",\"doi\":\"10.1111/cobi.70314\",\"url\":\"https://doi.org/10.1111/cobi.70314\",\"pmid\":\"42204851\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过整合受威胁澳大利亚哺乳动物刷尾负鼠实际生态位特征的变化，采用相关分析方法，识别了物种的响应阈值并定位了与种群持续存在相关的生态庇护所，揭示了其种群衰退的相关因素及关键庇护区域，获得了相应研究进展，为受威胁陆生哺乳动物的保护规划与管理提供了参考价值。\"},{\"title\":\"Translocation effects on regional and local population viability and connectivity.\",\"title_cn\":\"易地迁移对区域和局部种群生存力及连通性的影响。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Sánchez Arribas E, Planillo A, Premier J et al.\",\"abstract\":\"Translocations and reintroductions aim to improve the viability of isolated populations and promote connectivity for large carnivores. However, there is no established framework for assessing their success. We used the Eurasian lynx (Lynx lynx) in western and central Europe to assess the impact of translocations on the viability of six populations and their interconnectivity. Lynx populations are small and isolated and have low genetic diversity. Population reinforcements have been carried out, \",\"doi\":\"10.1111/cobi.70321\",\"url\":\"https://doi.org/10.1111/cobi.70321\",\"pmid\":\"42117344\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过种群生存力分析，在欧洲西部和中部的欧亚猞猁（Lynx lynx）六个孤立小种群及其连通性基础上，评估了易地迁移对区域和局部种群生存力及连通性的影响，发现相关迁移对种群生存力具有特定效应，获得了相应研究进展，为大型食肉动物易地迁移成功评估提供了参考价值。\"},{\"title\":\"Changes in the transformative potential of action proposals in Finnish Red Lists from 1986 to 2019.\",\"title_cn\":\"芬兰红色名录中行动提案变革潜力从1986年至2019年的变化。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Arponen A, Salomaa A, Fabritius H et al.\",\"abstract\":\"Red lists provide critical knowledge regarding biodiversity decline, especially in Finland, where broad assessments have been made regularly since the 1980s. They deliver information on the threat status of species and ecosystems, propose actions to guide conservation policy, and have the potential to spur transformative change. We examined whether the transformative potential of the proposals has changed over time. We analyzed the contents qualitatively and quantitatively of seven Finnish Red L\",\"doi\":\"10.1111/cobi.70312\",\"url\":\"https://doi.org/10.1111/cobi.70312\",\"pmid\":\"42089359\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过定性与定量分析，在芬兰自1980年代起定期开展的红色名录评估基础上，考察了1986年至2019年间七版名录中行动提案的变革潜力变化，发现其变革潜力随时间发生了相应变化，获得了相关研究进展，为理解保护政策工具在推动转型变革中的作用提供了参考价值。\"},{\"title\":\"Improving the use of expert opinion in disease risk analysis for conservation translocations.\",\"title_cn\":\"提升保护性迁移中疾病风险分析对专家意见的利用\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Ewen JG, Canessa S, Andrews CE et al.\",\"abstract\":\"Conservation translocations are subject to considerable uncertainty and risk, of which disease is one of the most recognized. To address disease risks, several protocols for qualitative disease risk analysis (qDRA) exist and are used for responsible conservation translocation planning. Existing qDRA protocols usually rely on expert judgment, but they lack quantitative aggregation of elicited estimates, transparent treatment of uncertainty, and explicit comparison of alternative disease risk mana\",\"doi\":\"10.1111/cobi.70292\",\"url\":\"https://doi.org/10.1111/cobi.70292\",\"pmid\":\"42032846\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过改进定性疾病风险分析（qDRA）协议，在保护性迁移中专家意见利用的基础上，发现现有协议缺乏对专家估计的定量汇总、不确定性透明处理及替代风险管理方案的明确比较，验证了相应方法改进的必要性，获得了提升qDRA决策支持能力的相关研究进展，为保护性迁移的负责任规划提供了价值。\"},{\"title\":\"The entanglement between the IUCN Red List and international biodiversity law.\",\"title_cn\":\"IUCN红色名录与国际生物多样性法之间的交织关系\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Claerhoudt R\",\"abstract\":\"The International Union for Conservation of Nature (IUCN) Red List of Threatened Species (red list) is of fundamental importance for nature conservation and biodiversity protection. I considered the interaction between the red list and international biodiversity law (IBL), the legal regime that aims to protect biodiversity at a global level. The red list is deeply embedded in each of the five global biodiversity treaties. As the most authoritative database on species conservation status, the red\",\"doi\":\"10.1111/cobi.70298\",\"url\":\"https://doi.org/10.1111/cobi.70298\",\"pmid\":\"42021118\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过分析IUCN红色名录与五项全球生物多样性条约的关联，在相关研究对象的基础上，发现红色名录深度嵌入国际生物多样性法体系，作为物种保护状态的最权威数据库，获得了相应研究进展，为理解科学评估与法律机制间的交织关系提供了相关价值。\"},{\"title\":\"Integrating traditional practices, livelihoods, and conservation with Indigenous-led furbearer camera trapping.\",\"title_cn\":\"将传统实践、生计与保护相结合，开展原住民主导的毛皮动物相机监测。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Carroll KA, Grey F, Anderson N et al.\",\"abstract\":\"Contemporary conservation goals have a greater chance of success when practitioners collaborate with Indigenous communities. The importance of such collaborations has spurred calls by Western and Indigenous researchers to engage in equitable coproduction of ecological research that integrates multiple ways of knowing. However, Indigenous-led conservation research is exceedingly rare. We conducted a case study, applicable globally, in which an Indigenous community experiencing intense industrial \",\"doi\":\"10.1111/cobi.70290\",\"url\":\"https://doi.org/10.1111/cobi.70290\",\"pmid\":\"42001395\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过案例研究，在面临高强度工业开发的原住民社区基础上，验证了原住民主导的毛皮动物相机监测方法，发现其能有效整合传统实践、生计与保护目标，获得了将本土知识与生态研究协同的相应研究进展，为全球范围内推动公平的生态研究共同生产提供了相关价值。\"},{\"title\":\"A global ranking of the relative vulnerability of marine mammals to macroplastic pollution.\",\"title_cn\":\"全球海洋哺乳动物对大型塑料污染相对脆弱性的排名\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Fredette-Roman C, Polidoro B, Rolsky C et al.\",\"abstract\":\"Plastic pollution poses a threat to marine mammals across the globe. However, quantitative research on the impacts of plastic pollution in marine mammals is lacking because of the ethical and practical issues that prevent experimentation on these species and the opportunistic nature of observational studies. Trait-based vulnerability indices offer a way to estimate the relative vulnerability of marine species to environmental stressors based on available knowledge about species life-history trai\",\"doi\":\"10.1111/cobi.70271\",\"url\":\"https://doi.org/10.1111/cobi.70271\",\"pmid\":\"41982042\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过基于物种生活史特征的脆弱性指数方法，在全球海洋哺乳动物对大型塑料污染相对脆弱性的相关研究对象基础上，发现并验证了不同物种间的相对脆弱性排名，获得了相应研究进展，为塑料污染背景下海洋哺乳动物的保护与管理提供了相关研究的价值。\"},{\"title\":\"Assessing differences among elasmobranch nurseries to aid conservation based on a genomics framework.\",\"title_cn\":\"评估软骨鱼 nursery 间的差异以基于基因组学框架辅助保护\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Swift DG, Barker AM, Driggers WB et al.\",\"abstract\":\"Elasmobranch nurseries often differ in environmental conditions, demographics, and use patterns. These differences affect the distribution of genetic variation among nurseries. However, conservation and management strategies often fail to account for such differences because they are difficult to characterize. We assessed differences in connectivity, genetic variation, and numbers of breeders among scalloped hammerheads (Sphyrna lewini) sampled in five nurseries in the western North Atlantic Oce\",\"doi\":\"10.1111/cobi.70280\",\"url\":\"https://doi.org/10.1111/cobi.70280\",\"pmid\":\"41972468\",\"category\":\"genetics\",\"ai_summary\":\"该研究团队通过基因组学框架，在评估北大西洋西部五个双髻鲨（Sphyrna lewini）育幼场差异的基础上，发现这些育幼场在连通性、遗传变异和繁殖个体数量上存在差异，获得了相关研究进展，为软骨鱼保护策略考虑育幼场间差异提供了价值。\"},{\"title\":\"Use of drone-derived high-resolution elevation data to improve species distribution models for a primate in mountainous areas.\",\"title_cn\":\"利用无人机高分辨率高程数据改进山区灵长类物种分布模型\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Wen K, Luo Y, Rao Z et al.\",\"abstract\":\"Accurate models of species distributions in mountainous ecosystems are essential for effective conservation, yet reliance on open‑access medium‑resolution elevation products often obscures fine-scale habitat heterogeneity critical for wildlife. We evaluated whether high-resolution digital surface models (DSMs) (≤1 m) based on data from an unmanned aerial vehicle (UAV) enhanced species distribution models (SDMs) relative to medium‑resolution satellite-based ALOS World 3D (AW3D) DSMs (≥30 m) for F\",\"doi\":\"10.1111/cobi.70274\",\"url\":\"https://doi.org/10.1111/cobi.70274\",\"pmid\":\"41972408\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过无人机获取高分辨率数字表面模型（≤1米），在山区灵长类物种分布模型的基础上，对比了其与中分辨率卫星ALOS World 3D数据（≥30米）的建模效果，验证了高分辨率高程数据能更准确捕捉细尺度栖息地异质性，获得了改进物种分布模型精度的相应研究进展，为山区野生动物保护提供了相关研究价值。\"},{\"title\":\"Argali sheep responses to a core conservation zone in the Gobi Desert over 12 years.\",\"title_cn\":\"戈壁沙漠核心保护区对盘羊12年响应研究\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Ekernas LS, Reading RP, Wingard G et al.\",\"abstract\":\"Conserving core habitat is a widely employed, but rarely evaluated, management strategy to benefit species and broader levels of biodiversity. Yet, few researchers have rigorously evaluated core area management's effectiveness in improving demographic parameters, especially in Central Asia, where the global cashmere trade-which incentivizes massive livestock increases and environmental degradation-threatens 70% of the region's large mammals. In a 12-year study, we used a before-after field manip\",\"doi\":\"10.1111/cobi.70264\",\"url\":\"https://doi.org/10.1111/cobi.70264\",\"pmid\":\"41958002\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过12年的前后现场操控实验，在戈壁沙漠核心保护区相关研究对象的基础上，验证了核心保护区管理对盘羊种群参数的改善效果，获得了相应研究进展，为评估保护区管理有效性及应对全球羊绒贸易对中亚大型哺乳动物的威胁提供了相关研究价值。\"},{\"title\":\"A more-than-human political ecology of Indonesian songbird trade.\",\"title_cn\":\"印度尼西亚鸣禽贸易的超人类政治生态学\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Fiennes S, Hardianto N, Anasari SD et al.\",\"abstract\":\"Since its inception, conservation science has considered wildlife trade a problem. In focusing on conservation outcomes, conservationists almost completely ignore the welfare of traded animals and plants and the harms they endure. We developed a political ecology approach that incorporates the interconnectedness of people with animals and natural habitats (more than human) to study the Indonesian bird trade, which is deeply culturally embedded, monetized, and speciose. We used marketplace observ\",\"doi\":\"10.1111/cobi.70275\",\"url\":\"https://doi.org/10.1111/cobi.70275\",\"pmid\":\"41957994\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过融合人与动物及自然栖息地相互关联的政治生态学方法，在印度尼西亚鸣禽贸易这一具有深厚文化嵌入、货币化及物种多样性的研究对象基础上，发现该贸易不仅关乎保护结果，还涉及被交易动物的福利与伤害，获得了对贸易复杂性的相应研究进展，为理解野生动物贸易的多维影响提供了相关研究价值。\"},{\"title\":\"Fish diversity and community turnover across protection zones in multiuse marine protected areas.\",\"title_cn\":\"多用途海洋保护区内保护分区间的鱼类多样性与群落周转。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Zeng X, Zeng C, Zhou Y et al.\",\"abstract\":\"Multiuse marine protected areas (MMPAs) with varying levels of protection in different zones are increasingly being adopted to balance conservation and socioeconomic goals. However, the effect of these zone-based strategies on fish diversity is not well understood. We used environmental DNA surveys across zones with different protection levels (fully protected, highly protected, and lightly protected) in three typical Chinese MMPAs, while controlling for environmental factors and human activitie\",\"doi\":\"10.1111/cobi.70262\",\"url\":\"https://doi.org/10.1111/cobi.70262\",\"pmid\":\"41902613\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过环境DNA调查，在控制环境因素和人类活动的基础上，研究了中国三个典型多用途海洋保护区中不同保护等级分区（完全保护、高度保护和轻度保护）的鱼类多样性，发现并验证了分区策略对鱼类多样性与群落周转的影响，获得了相应研究进展，为多用途海洋保护区的分区保护管理提供了相关研究价值。\"},{\"title\":\"Providing regular and frequent maps of losses and gains of farmland birds based on European monitoring data.\",\"title_cn\":\"基于欧洲监测数据提供农田鸟类损失与增益的定期高频地图\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Herrando S, Pocull G, Fraixedas S et al.\",\"abstract\":\"Knowledge of species distributions is essential for informing policies on nature conservation and restoration. However, updating them on a regular basis and doing so in a harmonized manner at the international level is difficult. The European Bird Census Council integrated national monitoring data covering 5 years to update farmland bird distributions and assessed how they changed. We used these data on 50 farmland bird species to generate 10×10 km maps showing their probability of occurrence fr\",\"doi\":\"10.1111/cobi.70268\",\"url\":\"https://doi.org/10.1111/cobi.70268\",\"pmid\":\"41877448\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队基于欧洲鸟类监测委员会整合的5年国家监测数据，针对50种农田鸟类，通过建模方法生成了10×10公里分辨率的发生概率地图，并评估了其分布变化。研究发现，该地图能够定期反映农田鸟类的损失与增益，获得了相应研究进展，为国际层面的物种保护与恢复政策提供了相关价值。\"},{\"title\":\"Evaluating synthetic substitutes to reduce illegal harvesting and support species recovery.\",\"title_cn\":\"评估合成替代品以减少非法采伐并支持物种恢复\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Malgaonkar AS, Whittington-Jones G, Dickerson T et al.\",\"abstract\":\"Providing synthetic substitutes is a widely promoted strategy to shift consumer demand away from wildlife products derived from threatened species. Yet, there is little evidence on whether product substitution prevents illegal or unsustainable harvesting and contributes to the recovery of threatened populations. Drawing on the Furs for Life Zambia initiative, which supplied synthetic furs known as heritage furs to replace leopard furs traditionally worn during Lozi royal ceremonies in western Za\",\"doi\":\"10.1111/cobi.70266\",\"url\":\"https://doi.org/10.1111/cobi.70266\",\"pmid\":\"41877435\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队基于赞比亚“Furs for Life”倡议中向西方Lozi王室仪式提供合成毛皮替代豹皮的研究对象，评估了合成替代品在减少非法采伐和支持物种恢复方面的作用，发现相关证据仍显不足，获得了相应研究进展，为野生动物保护策略的制定提供了参考价值。\"},{\"title\":\"Using customs data to understand overlooked trade in non-CITES birds between Africa and Asia.\",\"title_cn\":\"利用海关数据揭示非洲与亚洲之间被忽视的非CITES鸟类贸易。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Davies A, Andersson AA, Martin RO et al.\",\"abstract\":\"The international trade in live birds poses risks to animals, people, and biodiversity. To effectively mitigate these risks, decision-makers require information on the volume, dynamics, and direction of trade. Despite Africa once being the largest exporter of birds by region, very little data exist on recent trade in live birds not listed on the appendices of the Convention on International Trade in Endangered Species of Wild Fauna and Flora (CITES). We used UN Comtrade data to explore trade in \",\"doi\":\"10.1111/cobi.70265\",\"url\":\"https://doi.org/10.1111/cobi.70265\",\"pmid\":\"41869900\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析联合国商品贸易统计数据，在非洲与亚洲之间非CITES鸟类贸易数据稀缺的基础上，揭示了该区域活体鸟类贸易的规模、动态与流向，获得了对以往被忽视贸易路径的量化认识，为相关物种保护与贸易监管提供了数据支持。\"},{\"title\":\"Overlap of nonbreeding wandering albatrosses with fisheries and implications for colony-specific population trajectories at South Georgia.\",\"title_cn\":\"非繁殖期漂泊信天翁与渔业的分布重叠及其对南乔治亚岛特定种群数量变化轨迹的影响\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Warwick-Evans V, Pearmain EJ, Phillips RA\",\"abstract\":\"Bycatch in fisheries is one of the most serious threats to pelagic seabirds, causing major population declines. Mitigation measures can reduce bycatch substantially, but many fisheries fail to apply best practices, and seabird mortality remains high. Seabirds often segregate at sea according to sex and life-history stage, and bycatch risk can vary accordingly. Few studies have tested whether spatial segregation among colonies in foraging areas affects bycatch risk. We tracked nonbreeding wanderi\",\"doi\":\"10.1111/cobi.70260\",\"url\":\"https://doi.org/10.1111/cobi.70260\",\"pmid\":\"41869890\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过追踪南乔治亚岛非繁殖期漂泊信天翁，在分析其与渔业分布重叠的基础上，发现不同种群因海上活动区域差异而面临不同兼捕风险，进而验证了空间隔离对种群数量变化轨迹的影响，获得了相应研究进展，为相关渔业兼捕缓解措施提供了参考价值。\"},{\"title\":\"Drivers of bat researchers' intent to adopt field hygiene practices.\",\"title_cn\":\"蝙蝠研究人员采纳野外卫生实践意向的驱动因素。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Coleman JL, Macdonald EA, Rutrough AL et al.\",\"abstract\":\"Infectious disease is a growing threat to wildlife, with zoonotic transmission most likely at the human-wildlife interface. One underappreciated activity at this interface is fieldwork with wild animals, but associated risks can be mitigated through field hygiene (FH) practices, such as using personal protective equipment and other appropriate behaviors. Following the dissemination of International Union for Conservation of Nature FH guidelines for bat researchers, we investigated factors that a\",\"doi\":\"10.1111/cobi.70252\",\"url\":\"https://doi.org/10.1111/cobi.70252\",\"pmid\":\"41863123\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过问卷调查等方法，在传播国际自然保护联盟蝙蝠研究人员野外卫生指南的基础上，发现影响研究人员采纳野外卫生实践意向的关键驱动因素，获得了相应研究进展，为降低人畜共患病传播风险及改进相关指南推广策略提供了参考价值。\"},{\"title\":\"Regulatory compliance and support for altered management of the exotic pet trade.\",\"title_cn\":\"外来宠物贸易的监管合规与变更管理支持\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Pratt EN, Lockwood JL, King EG et al.\",\"abstract\":\"Globally, the exotic pet trade has contributed to species invasion, disease, and animal welfare risks. Although scientists have advocated for increased trade regulation, the success of management and regulatory efforts depends on compliance by participants in the exotic pet trade. We used a regulatory compliance framework to investigate exotic pet trade participants' support for proposed changes to regulations. In 2023, we administered online surveys to 1653 exotic pet owners, breeders, and sell\",\"doi\":\"10.1111/cobi.70257\",\"url\":\"https://doi.org/10.1111/cobi.70257\",\"pmid\":\"41854093\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过2023年对1653名外来宠物所有者、繁殖者和销售者的在线调查，在监管合规框架的基础上，考察了参与者对拟议法规变更的支持程度，发现相关研究对象对变更管理的支持存在差异，获得了相应研究进展，为外来宠物贸易的监管与管理工作提供了参考价值。\"},{\"title\":\"Strengthening biodiversity conservation and One Health through ranger monitoring of wildlife health in protected areas.\",\"title_cn\":\"通过保护区护林员监测野生动物健康，加强生物多样性保护与“一体化健康”\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Montecino-Latorre D, Olson SH, Denstedt E et al.\",\"abstract\":\"The lack of wildlife health (WH) surveillance systems leaves critical gaps in biodiversity conservation and One Health protection. Integrating rangers patrolling protected areas (PAs) into WH monitoring represents a cost-effective and scalable opportunity to address these gaps at key human-wildlife interfaces and nature strongholds. For the past 2.5 years, organizations across 4 countries have collaborated to pilot this integration. The approach involved establishing a practical definition of he\",\"doi\":\"10.1111/cobi.70241\",\"url\":\"https://doi.org/10.1111/cobi.70241\",\"pmid\":\"41852111\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过整合保护区护林员巡逻与野生动物健康监测，在4国多年试点的基础上，验证了该方法的成本效益与可扩展性，获得了加强生物多样性保护与“一体化健康”的相应研究进展，为填补野生动物健康监测系统缺失及关键人类-野生动物界面风险防控提供了相关研究价值。\"},{\"title\":\"Contrasting vulnerability profiles for insular assemblages of birds and mammals facing global change.\",\"title_cn\":\"岛屿鸟类和哺乳动物群落面对全球变化的脆弱性特征对比。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Marino C, Benítez-López A, Butt N et al.\",\"abstract\":\"Island biota is currently threatened by global anthropogenic pressures. The limited ability of island species to track suitable conditions and their inherent sensitivity to anthropogenic changes make insular biota highly vulnerable to global threats. Although vulnerability assessments of species to single threats individually have been conducted, the vulnerability of island faunas to multiple global change drivers has not. We evaluated the relative vulnerability of 266 insular bird and mammal sp\",\"doi\":\"10.1111/cobi.70261\",\"url\":\"https://doi.org/10.1111/cobi.70261\",\"pmid\":\"41830546\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过对比分析，在266个岛屿鸟类和哺乳动物物种的基础上，评估了它们面对多种全球变化驱动因素的相对脆弱性，发现岛屿动物群对多重威胁的脆弱性特征存在差异，获得了相应研究进展，为岛屿生物多样性保护策略的制定提供了参考价值。\"},{\"title\":\"Perceived costs as drivers of wildlife management preferences in rural Tanzanian communities.\",\"title_cn\":\"感知成本作为坦桑尼亚农村社区野生动物管理偏好的驱动因素。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Kiffner C, Raycraft J, Becchina R et al.\",\"abstract\":\"Effectively managing human-wildlife interactions is crucial for fostering coexistence on shared landscapes. Management options are most effective when aligned with the preferences of people directly affected by wildlife, yet little is known about how socioecological factors influence these preferences. Integrating responses from 680 rural residents of northern Tanzania and remotely sensed data, we parameterized a Bayesian hierarchical model to test predictions of the hazard-acceptance model. We \",\"doi\":\"10.1111/cobi.70251\",\"url\":\"https://doi.org/10.1111/cobi.70251\",\"pmid\":\"41800693\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过整合坦桑尼亚北部680名农村居民的调查反馈与遥感数据，构建贝叶斯分层模型，在检验危害接受模型预测的基础上，发现感知成本是驱动野生动物管理偏好的关键因素，获得了关于社会生态因素影响管理偏好的相应研究进展，为促进共享景观中的人兽共存相关研究提供了参考价值。\"},{\"title\":\"Relationship of temperature with declines and persistence of Myotis lucifugus after white-nose syndrome.\",\"title_cn\":\"白鼻综合征后温度与鼠耳蝠（Myotis lucifugus）数量下降及存续的关系。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Barnes TM, Wolfe JD, Kurta A et al.\",\"abstract\":\"White-nose syndrome (WNS), caused by the fungus Pseudogymnoascus destructans (Pd), ranks among the most devastating wildlife diseases in recent history and is driving severe declines in North American bats. Identifying environmental factors that influence both the severity of population crashes and the potential for population persistence is essential for effective mitigation. We used a long-term dataset from hibernacula across Michigan's Upper Peninsula to evaluate how temperature variation aff\",\"doi\":\"10.1111/cobi.70236\",\"url\":\"https://doi.org/10.1111/cobi.70236\",\"pmid\":\"41709622\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析密歇根上半岛多个冬眠栖息地的长期数据，在评估温度变化与白鼻综合征影响的基础上，发现温度变异与鼠耳蝠种群下降程度及存续状况存在关联，获得了相应研究进展，为理解该病害的环境驱动因素及缓解策略提供了相关价值。\"},{\"title\":\"Rural and urban attitudes to conflict and cooperation with wildfowl conservation directives in a community in China.\",\"title_cn\":\"中国某社区城乡民众对野生鸟类保护指令的冲突与合作态度\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Miao Z, Zhang W, Wang Q et al.\",\"abstract\":\"Regulations prohibiting retaliatory killing of wildlife are widespread, but their efficacy depends on individuals' perceptions of, adherence to, and willingness to cooperate with these rules. We investigated the willingness of rural communities in China to cooperate with measures to reduce human-wildfowl conflict by examining the potential influence of individual attitudes and social factors on this willingness. Through a public survey and choice experiments with 1381 participants (344 rural res\",\"doi\":\"10.1111/cobi.70247\",\"url\":\"https://doi.org/10.1111/cobi.70247\",\"pmid\":\"41693107\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过公共调查和选择实验，在1381名参与者（含344名农村居民）的基础上，考察了中国某社区城乡民众对减少人鸟冲突措施的配合意愿，发现个体态度和社会因素可能影响其合作意愿，获得了相应研究进展，为理解野生鸟类保护指令的执行效果提供了相关价值。\"},{\"title\":\"Calibration of the species threat abatement and restoration metric's threat abatement component in a Costa Rican landscape.\",\"title_cn\":\"在哥斯达黎加景观中校准物种威胁消减与恢复指标中的威胁消减组成部分。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Mair L, Brooks TM, Jimenez RR et al.\",\"abstract\":\"Achieving global conservation policy goals requires the ability to set and measure progress toward science-based targets for biodiversity. The species threat abatement and restoration (STAR) metric was developed to enable actors to set science-based targets for species. STAR scores quantify the potential contribution of actions to abate threats and restore habitat to reduce species extinction risk in a particular place and can be aggregated and disaggregated among species, threats, and areas of \",\"doi\":\"10.1111/cobi.70231\",\"url\":\"https://doi.org/10.1111/cobi.70231\",\"pmid\":\"41684046\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过校准物种威胁消减与恢复（STAR）指标中的威胁消减组成部分，在哥斯达黎加景观的研究基础上，验证了该指标在特定地点量化威胁消减行动对降低物种灭绝风险潜在贡献的适用性，获得了相应研究进展，为全球生物多样性保护政策目标的科学设定与进展衡量提供了相关价值。\"},{\"title\":\"An experimental approach to assess the combined effects of multiple stressors on a large vertebrate species.\",\"title_cn\":\"一种评估多种压力源对大型脊椎动物物种联合效应的实验方法。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Pirotta E, Harris CM, Schwacke LH et al.\",\"abstract\":\"The design of experiments to investigate the combined effects of multiple stressors requires exposing target organisms to multiple combinations of stressor doses. Concurrent manipulation of stressors is often infeasible with wildlife, but long-lasting health effects allow individual health to be used as an integrator of prior stressor exposure. The population of bottlenose dolphins in Barataria Bay, Louisiana, experienced long-lasting health effects after exposure to oil from the Deepwater Horiz\",\"doi\":\"10.1111/cobi.70224\",\"url\":\"https://doi.org/10.1111/cobi.70224\",\"pmid\":\"41664509\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过实验设计方法，在长期健康效应作为压力源暴露整合指标的基础上，评估了多种压力源对大型脊椎动物物种的联合效应，验证了该方法在野生动物研究中的可行性，获得了相应研究进展，为相关生态保护与管理研究提供了参考价值。\"},{\"title\":\"Assessing the performance of surrogate species in spatial conservation planning.\",\"title_cn\":\"评估替代物种在空间保护规划中的表现。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Liu Y, Wang J, Wu H et al.\",\"abstract\":\"Selecting effective surrogate species is essential for improving conservation planning efficiency under limited resources. However, the selection process is often hindered by conceptual ambiguities and inconsistent methodologies. Moreover, most existing studies focus on assessing surrogate species but fail to integrate them into practical spatial conservation planning. We developed a multidimensional effectiveness index (EI) that integrates umbrella, keystone, flagship, and protection dimensions\",\"doi\":\"10.1111/cobi.70233\",\"url\":\"https://doi.org/10.1111/cobi.70233\",\"pmid\":\"41655053\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过构建整合伞护种、关键种、旗舰种及保护维度的多维有效性指数（EI），在评估替代物种表现的基础上，将其纳入实际空间保护规划，发现该指数能更全面地衡量替代物种在规划中的效用，获得了相应研究进展，为资源有限条件下提升保护规划效率提供了方法支持。\"},{\"title\":\"Role of transit countries in global illegal wildlife trade.\",\"title_cn\":\"过境国在全球非法野生动植物贸易中的作用。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Niu J, Chen X, Xu W et al.\",\"abstract\":\"Illegal wildlife trade is an important branch of global environmental crime. It relies heavily on transit countries to promote the cross-border movement of illegal wildlife products by boosting markets, laundering services, processing and packaging products, and concealing routes. However, transit countries' strategic role is not well understood. We constructed a dataset of 15 years of illegal wildlife seizure cases from the Center for Advanced Defense Studies (C4ADS) air seizure database and Wi\",\"doi\":\"10.1111/cobi.70226\",\"url\":\"https://doi.org/10.1111/cobi.70226\",\"pmid\":\"41639024\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析15年非法野生动植物查获案例数据，在过境国相关研究对象的基础上，验证了过境国通过促进市场、洗钱服务、加工包装及路线隐藏等方式推动非法产品跨境流动的核心作用，获得了对过境国战略角色更清晰的认识，为全球非法贸易治理提供了相关研究价值。\"},{\"title\":\"Effects of landscape context on avian specialist response to increased surface temperature in protected areas.\",\"title_cn\":\"景观背景对保护区内鸟类特化种响应地表温度升高的影响\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Rudge LJ, Holland AM, Shriver WG\",\"abstract\":\"Human development is a driver of global change and a major threat to biodiversity. Protected areas maintain and support biodiversity, but outside stressors, such as climate change and land use change, can negatively influence natural resources within protected areas. We examined the effects of land surface temperature and the surrounding landscape context on the structure and composition of the breeding bird community in national parks in the Mid-Atlantic (USA). We used avian point count surveys\",\"doi\":\"10.1111/cobi.70230\",\"url\":\"https://doi.org/10.1111/cobi.70230\",\"pmid\":\"41630359\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过鸟类点计数调查，在评估美国中大西洋地区国家公园地表温度及周边景观背景的基础上，发现景观背景影响保护区内鸟类特化种对地表温度升高的响应，获得了相应研究进展，为理解保护区生物多样性受外部压力影响提供了相关研究价值。\"},{\"title\":\"Combining detection dogs with air extraction methodology to expose wildlife trafficking in containerized cargo.\",\"title_cn\":\"结合检测犬与空气抽取方法，揭露集装箱货物中的野生动物走私。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Moloney GK, Shute NM, Brien GG et al.\",\"abstract\":\"Persistent demand for wildlife-derived products perpetuates international trafficking and the exploitation of legitimate globalized transport networks. The annual movement of millions of shipping cargo containers, of which few are inspected due to resource constraints, facilitates the smuggling of large quantities of wildlife contraband. Rapid, noninvasive screening tools are essential for border control agencies to effectively detect and intercept wildlife trafficking attempts, though such tool\",\"doi\":\"10.1111/cobi.70225\",\"url\":\"https://doi.org/10.1111/cobi.70225\",\"pmid\":\"41618878\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过结合检测犬与空气抽取方法，在集装箱货物筛查的基础上，验证了该技术能有效揭露野生动物走私，获得了快速非侵入性筛查工具的相应研究进展，为边境管控机构拦截走私行为提供了相关价值。\"},{\"title\":\"Using incentive payments to promote human-carnivore coexistence.\",\"title_cn\":\"利用激励性支付促进人类与食肉动物共存。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Pekor A, Jansson I, Munka O et al.\",\"abstract\":\"For many large carnivores, minimizing the financial burden they impose on local people is critical to their conservation. Incentive-based programs that provide people with financial benefits for taking pro-conservation actions or achieving conservation goals are a promising tool for promoting human-carnivore coexistence. Although the number of incentive-based programs aimed at conserving large carnivores is growing, there has been little published research on the use of this approach. We reviewe\",\"doi\":\"10.1111/cobi.70216\",\"url\":\"https://doi.org/10.1111/cobi.70216\",\"pmid\":\"41608878\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过综述相关文献，在激励性支付项目应用于大型食肉动物保护的研究基础上，发现此类项目通过为当地居民提供经济收益以鼓励保护行动，可有效减轻其财务负担，进而促进人类与食肉动物共存。论文报道的方法揭示了该领域研究不足的现状，获得了相应研究进展，为优化共存策略提供了参考价值。\"},{\"title\":\"Geographic risks to functional groups of mammals and birds from habitat loss in Mexico.\",\"title_cn\":\"墨西哥哺乳动物和鸟类功能群因栖息地丧失面临的地理风险。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Mayani-Parás F, Botello F, Moreno CE et al.\",\"abstract\":\"There is a need to quantify the impact of habitat loss due to anthropogenic factors on different aspects of biodiversity, such as functional trait diversity represented by functional groups (FGs). We developed a metric to assess the weighted risk of loss of habitat for 33 FGs of mammals and 36 FGs of birds in Mexico based on potential distribution of species and percentage of distributions lost due to habitat loss according to the Mexican land use and vegetation map. We also determined species' \",\"doi\":\"10.1111/cobi.70218\",\"url\":\"https://doi.org/10.1111/cobi.70218\",\"pmid\":\"41542745\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过基于物种潜在分布与墨西哥土地利用及植被图评估栖息地丧失比例的方法，在墨西哥哺乳动物和鸟类功能群相关研究对象的基础上，发现/验证了33个哺乳动物功能群和36个鸟类功能群面临栖息地丧失的加权风险，获得了相应研究进展，为栖息地丧失对功能多样性影响的相关研究提供了价值。\"},{\"title\":\"Evaluating the empirical basis for threat attribution in the IUCN Red List.\",\"title_cn\":\"评估IUCN红色名录中威胁归因的经验基础。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Humphries E, Smith IM, Ziebell M et al.\",\"abstract\":\"Understanding the impacts of different threats on species is key to successful conservation interventions and policies. The International Union for Conservation of Nature (IUCN) assesses threats to species, and the organization's Red List of Threatened Species is a key conservation tool. We quantified the degree to which threats in IUCN assessments for 3 vertebrate groups (birds, amphibians, and ray-finned fishes) were based on species-specific quantitative empirical data. To do this, for 2142 I\",\"doi\":\"10.1111/cobi.70213\",\"url\":\"https://doi.org/10.1111/cobi.70213\",\"pmid\":\"41540933\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过量化分析，在评估IUCN红色名录中鸟类、两栖类和辐鳍鱼类三个脊椎动物类群威胁归因的基础上，发现相关评估较少基于物种特异性的定量经验数据，获得了关于威胁归因经验基础薄弱的研究进展，为改进红色名录评估方法及保护决策提供了参考价值。\"},{\"title\":\"Equity considerations in the proposed wildlife protocol to the Convention against Transnational Organized Crime.\",\"title_cn\":\"拟议的《联合国打击跨国有组织犯罪公约》野生动物议定书中的公平考量。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Osorio CP\",\"abstract\":\"Wildlife trafficking poses a critical threat to global biodiversity, contributes to organized crime, and has disproportionate impacts on underserved and Indigenous communities. Although international legal instruments, such as the Convention on International Trade in Endangered Species of Wild Fauna and Flora, and institutional collaborations, such as the International Consortium on Combating Wildlife Crime, aim to combat wildlife trafficking, social equity remains insufficiently addressed in gl\",\"doi\":\"10.1111/cobi.70220\",\"url\":\"https://doi.org/10.1111/cobi.70220\",\"pmid\":\"41536019\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析拟议的《联合国打击跨国有组织犯罪公约》野生动物议定书，在现有国际法律文书与机构协作的基础上，发现社会公平议题在全球野生动物贩运治理中仍未得到充分关注，获得了相应研究进展，为完善相关国际法律框架中的公平考量提供了参考价值。\"},{\"title\":\"Role of freshwater availability and terrestrial land-cover change in the distribution of a declining, terrestrial, insectivorous bird.\",\"title_cn\":\"淡水可得性与陆地土地覆盖变化对一种衰退的陆生食虫鸟类分布的影响\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Eden CF, Gillings S, Broughton RK et al.\",\"abstract\":\"Insectivorous, Afro-Palearctic migrant birds provide cross-border ecosystem services, but many are declining rapidly. The complex life cycle of migrant birds makes their conservation difficult, but understanding where they spend time during the breeding season can help indicate where those actions will be most effective. We used the spotted flycatcher (Muscicapa striata), a declining, Afro-Palearctic, migratory insectivore and habitat generalist, as a model to examine how river density and land-\",\"doi\":\"10.1111/cobi.70219\",\"url\":\"https://doi.org/10.1111/cobi.70219\",\"pmid\":\"41536007\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析河流密度与土地覆盖变化数据，在斑姬鹟这一衰退的非洲-古北界迁徙食虫鸟类分布研究的基础上，发现淡水可得性与陆地栖息地变化共同影响其繁殖期分布，获得了相应研究进展，为迁徙鸟类保护地点的有效选择提供了相关价值。\"},{\"title\":\"An integrated approach to balance freshwater connectivity restoration and invasion risk.\",\"title_cn\":\"一种平衡淡水连通性恢复与入侵风险的综合方法。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Arkilanian A, Coté D, Wiersma YF et al.\",\"abstract\":\"Habitat fragmentation negatively affects many native migratory fish populations. However, this fragmentation can also prevent the spread and establishment of invasive species. We modified the dendritic connectivity index (DCI), a commonly used freshwater connectivity metric, to account for multiple invasive dispersal pathways in estimates of invasive species connectivity. We considered dispersal from source populations in the outlet by limiting the diadromous form of the DCI to consider dispersa\",\"doi\":\"10.1111/cobi.70215\",\"url\":\"https://doi.org/10.1111/cobi.70215\",\"pmid\":\"41531369\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过改进树状连通性指数（DCI），在评估淡水连通性时纳入多种入侵物种扩散路径的基础上，发现该方法能同时量化栖息地连通恢复与入侵风险，获得了平衡生态修复与生物入侵防控的相应研究进展，为淡水生态系统管理提供了相关研究价值。\"},{\"title\":\"Synthesizing beaver coexistence messaging with the capability, opportunity, and motivation behavior model.\",\"title_cn\":\"将海狸共存信息与能力、机会和动机行为模型相结合。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Erickson BD, Jones MS\",\"abstract\":\"In the western United States, conservation practitioners are increasingly working with private landowners to restore habitat for North American beavers (Castor canadensis) and to use nonlethal mitigation techniques when beavers damage crops and infrastructure. Effective communication is critical for promoting coexistence, yet on-the-ground conservation messaging seldom links to behavior change theories. We conducted 23 semistructured interviews with practitioners to examine the approaches they u\",\"doi\":\"10.1111/cobi.70210\",\"url\":\"https://doi.org/10.1111/cobi.70210\",\"pmid\":\"41502085\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过23次半结构化访谈，在考察美国西部保护从业者与私人土地所有者合作恢复北美海狸栖息地及采用非致命缓解技术的基础上，发现实际保护信息很少与行为改变理论相结合，验证了能力、机会和动机行为模型在构建海狸共存信息中的适用性，获得了将理论框架融入现场沟通的相应研究进展，为促进人兽共存相关保护实践提供了理论指导价值。\"},{\"title\":\"Functional homogenization of terrestrial mammals outside protected areas in the Hengduan Mountains, China.\",\"title_cn\":\"中国横断山脉保护区外陆生哺乳动物的功能同质化。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Li X, Hu W, Onditi KO et al.\",\"abstract\":\"Despite the crucial role of human impacts on biodiversity loss, many assessments of this loss focus on single metrics, such as species richness, and overlook the multidimensional effects of human activities. Because of its importance to ecosystem functioning, we investigated the functional diversity of medium- and large-sized mammal assemblages in protected and unprotected mountain forests in the Hengduan Mountains of southwest China. We hypothesized that anthropogenic pressures outside protecte\",\"doi\":\"10.1111/cobi.70214\",\"url\":\"https://doi.org/10.1111/cobi.70214\",\"pmid\":\"41502084\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过对比中国横断山脉保护区内外中大型陆生哺乳动物群落的功能多样性，在评估人类活动影响的基础上，发现保护区外物种功能同质化现象显著，获得了相应研究进展，为理解人类压力对生态系统功能的影响及保护区外生物多样性保护提供了相关研究价值。\"},{\"title\":\"Prioritizing bat roosts for conservation with a global multicriteria bat roost priority index based on community science.\",\"title_cn\":\"基于社区科学的全球多标准蝙蝠栖息地优先保护指数，用于优先保护蝙蝠栖息地。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"López-Bosch D, Tanalgo K, Puig-Montserrat X et al.\",\"abstract\":\"Prioritization in conservation is crucial for the development of efficient and effective decision-making policies. For many decades, the importance of some species and their habitats has been assessed and applied in conservation legislation, but bats and their diurnal roosts have ofbeen overlooked. Several approaches have been used to categorize bat roosts based on their conservation importance. However, such assessments are often limited to expert-level assessments, are developed for specific r\",\"doi\":\"10.1111/cobi.70189\",\"url\":\"https://doi.org/10.1111/cobi.70189\",\"pmid\":\"41408925\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队基于社区科学数据，构建了全球多标准蝙蝠栖息地优先保护指数，用于评估蝙蝠日栖栖息地的保护重要性。研究发现该指数能有效整合多维度信息，为蝙蝠栖息地的系统化优先保护提供了量化工具，相关研究进展为全球蝙蝠保护决策提供了科学依据。\"},{\"title\":\"A link between increased temperature and avian body condition in a logged tropical forest.\",\"title_cn\":\"气温升高与采伐热带森林中鸟类身体状况之间的联系。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Uwimbabazi M, Muhanguzi G, Eryenyu D et al.\",\"abstract\":\"The combined effects of anthropogenic disturbances, such as logging and climate change, remain poorly understood; yet, they are the main threats to tropical biodiversity. Most tropical African countries lack long-term climate data, so climate impacts on biodiversity cannot be assessed. However, individuals experience weather, rather than climate, such that climate effects could be seen as the cumulative effects of weather over time. We used morphometric data collected in 1996-2000 and 2017-2021 \",\"doi\":\"10.1111/cobi.70190\",\"url\":\"https://doi.org/10.1111/cobi.70190\",\"pmid\":\"41332173\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过对比1996-2000年与2017-2021年的形态测量数据，在采伐热带森林中鸟类长期监测的基础上，发现气温升高与鸟类身体状况之间存在联系，获得了相应研究进展，为理解人为干扰与气候变化对热带生物多样性的综合影响提供了相关价值。\"},{\"title\":\"Effects of parachute science on local research capacity.\",\"title_cn\":\"降落伞科学对当地研究能力的影响。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Yang L, Chen T, Chapman CA et al.\",\"abstract\":\"Strengthening research capacity is essential to address the global biodiversity crisis. Yet, parachute science often undermines this goal, and its prevalence, costs, and benefits are unclear. We analyzed 13,502 publications on primate research that we extracted from Scopus (1960-2022) to evaluate the effects of parachute science on local research capacity across primate-range countries. We categorized these publications as local (LRP), collaborative (CRP), or parachute science (PSRP) research pu\",\"doi\":\"10.1111/cobi.70184\",\"url\":\"https://doi.org/10.1111/cobi.70184\",\"pmid\":\"41292135\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过分析Scopus中1960至2022年间13,502篇灵长类研究文献，在评估降落伞科学普遍性及其成本效益的基础上，发现降落伞科学对灵长类分布国的当地研究能力产生负面影响，获得了关于其影响程度的相应研究进展，为理解并改善全球生物多样性危机下的研究能力建设提供了相关价值。\"},{\"title\":\"Differences in climate change impacts on reptile embryos and adults.\",\"title_cn\":\"气候变化对爬行动物胚胎与成体影响之差异。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Jiang ZW, Wang NY, Qi S et al.\",\"abstract\":\"Species experience climate change impacts throughout their life cycle; yet, embryos are rarely considered in vulnerability assessments and conservation planning. We conducted a global-scale analysis of developmental traits and climate change effects on embryonic development in 48 oviparous reptiles. We also compared the climate change effects on embryos and adults to identify geographic areas where the 2 life stages are most vulnerable to such effects. In a comparison between adults and embryos \",\"doi\":\"10.1111/cobi.70176\",\"url\":\"https://doi.org/10.1111/cobi.70176\",\"pmid\":\"41236878\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过全球尺度分析，在48种卵生爬行动物发育性状及气候变化影响的基础上，比较了胚胎与成体对气候变化的脆弱性，发现两生命阶段受影响的地理区域存在差异，获得了相应研究进展，为爬行动物保护规划中纳入胚胎阶段考量提供了相关价值。\"},{\"title\":\"Host phylogeny and diet shape gut microbiome and virome in wild small mammals of Gongga Mountain, China.\",\"title_cn\":\"宿主系统发育和饮食塑造中国贡嘎山野生小型哺乳动物的肠道微生物组和病毒组。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"He LW, Tang RX, Liu SY et al.\",\"abstract\":\"Gut microbiotas play pivotal roles in host adaptation, yet their composition and function in high-altitude small mammals remain poorly characterized. This study investigated how host phylogeny (order-level) and dietary habits shape the gut microbiome and virome of three mammalian orders (Eulipotyphla, Rodentia, Lagomorpha) in Gongga Mountain, a biodiversity hotspot on the Qinghai-Xizang Plateau. Metagenomic sequencing of 219 samples from 22 species revealed order-specific microbial signatures: E\",\"doi\":\"10.24272/j.issn.2095-8137.2025.448\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.448\",\"pmid\":\"42533584\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过宏基因组测序，在分析中国贡嘎山22种野生小型哺乳动物219份样本的基础上，发现宿主系统发育（目级）和饮食共同塑造了肠道微生物组和病毒组，并揭示了食虫目、啮齿目和兔形目各自特异的微生物特征，获得了关于高海拔小型哺乳动物肠道菌群组成与功能的研究进展，为理解宿主适应高海拔环境的相关研究提供了参考价值。\"},{\"title\":\"Genome-wide SNVs revealed reticulate evolutionary history of a Eurasian-African songbird radiation (\",\"title_cn\":\"全基因组SNV揭示欧亚-非洲鸣禽辐射的网状进化历史\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Jiang C, Liu Y, Zhu WW et al.\",\"abstract\":\"Phylogenomics has the power to reveal complex evolutionary hypotheses across taxa, thereby allowing important glimpses into the evolutionary history, such as incomplete lineage sorting (ILS) and introgression among closely related species. The  系统发育基因组学能够揭示分类单元间复杂的演化假说，为重构演化历史提供关键证据，如不完全谱系分选（ILS）和基因渐渗等现象。黑喉石䳭复合种由\",\"doi\":\"10.24272/j.issn.2095-8137.2025.266\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.266\",\"pmid\":\"42533579\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过全基因组SNV分析，在欧亚-非洲鸣禽辐射演化研究的基础上，验证了黑喉石䳭复合种存在网状进化历史，获得了关于不完全谱系分选和基因渐渗的相应研究进展，为理解近缘物种复杂演化关系提供了相关研究价值。\"},{\"title\":\"Task learning drives adaptive vocal adjustments in echolocating bats.\",\"title_cn\":\"任务学习驱动回声定位蝙蝠的适应性发声调整。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Wang Q, Ye H, Luo J\",\"abstract\":\"Vocal production learning (VPL), a core ability underlying human speech, is rare among mammals. Apart from humans, two of the four identified VPL mammalian lineages (cetaceans and bats) are echolocators, exhibiting remarkable vocal flexibility for echolocation. It has been posited that enhanced vocal flexibility can facilitate the evolution of VPL, which operates at longer time scales. However, empirical data linking vocal flexibility to VPL is still lacking. Using a psychophysical reinforcement\",\"doi\":\"10.24272/j.issn.2095-8137.2025.350\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.350\",\"pmid\":\"42457411\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过心理物理学强化任务学习，在回声定位蝙蝠适应性发声调整的基础上，验证了任务学习能够驱动其发声的灵活调整，获得了将发声灵活性与发声学习能力相联系的研究进展，为理解哺乳动物发声学习进化提供了相关研究价值。\"},{\"title\":\"Global Camera Trapping Inventory (GCTI) v.1.0: A worldwide inventory of camera-trapping studies for spatial biodiversity analysis.\",\"title_cn\":\"全球相机陷阱调查名录（GCTI）v.1.0：用于空间生物多样性分析的全球相机陷阱研究名录。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Liang LW, Fatimah A, Qian Q et al.\",\"abstract\":\"Camera traps have significantly advanced biodiversity monitoring by enabling standardized, noninvasive detection of medium- and large-sized wildlife across broad spatial scales. However, the lack of data sharing within the camera-trapping community, particularly during the early development of the field, has restricted the availability of public species-occurrence records and limited the integration of camera-trap evidence into global spatial analyses. Data sensitivity, especially for threatened\",\"doi\":\"10.24272/j.issn.2095-8137.2025.340\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.340\",\"pmid\":\"42457409\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过系统整理全球范围内已发表的相机陷阱研究文献，在汇总物种出现记录的基础上，构建了全球相机陷阱调查名录（GCTI）v.1.0，验证了该名录在空间生物多样性分析中的可用性，获得了相关研究进展，为促进相机陷阱数据共享及支持全球空间生物多样性评估提供了基础资源。\"},{\"title\":\"Whether and how nestlings of Japanese tits respond to nest predator risk: Testing active and passive growth responses.\",\"title_cn\":\"日本山雀雏鸟是否以及如何应对巢捕食风险：检验主动与被动生长反应。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Liu QZ, Yu JP, Shao FB et al.\",\"abstract\":\"Nestling growth is known to be passively constrained by parental feeding and actively mediated by growth-regulating hormones. While nest predation pressures can vary across geographic regions, few studies have focused on whether and how nestling growth patterns are adjusted in response to differences in predation pressure. We selected two breeding populations of Japanese tits  雏鸟的生长受到亲鸟递食量的被动限制，同时依赖生长调节激素的主动调控。不同地理区域的巢捕食压力存在差异，但鲜有研究关注雏鸟在不同压力环境下的生长模式是否存在变化以及如何变化。本研究以分布于吉林省和辽宁省的大山雀（\",\"doi\":\"10.24272/j.issn.2095-8137.2025.338\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.338\",\"pmid\":\"42457408\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过对比吉林省和辽宁省两个日本山雀繁殖种群，在巢捕食风险差异的基础上，检验了雏鸟的主动与被动生长反应，发现雏鸟生长模式可能随捕食压力变化而调整，获得了相应研究进展，为理解环境压力对雏鸟生长的调控机制提供了相关价值。\"}]";

      const rawPapers = JSON.parse(papersJson);

      let currentIndex = 0;
      const annotations = JSON.parse(localStorage.getItem('annotations') || '{}');

      while (currentIndex < rawPapers.length && annotations[rawPapers[currentIndex].pmid]) {
        currentIndex++;
      }

      function loadPaper() {
        if (currentIndex >= rawPapers.length) {
          document.getElementById('paperCard').style.display = 'none';
          document.getElementById('doneMessage').style.display = 'block';
          const total = Object.keys(annotations).length;
          document.getElementById('progress').textContent = `完成！共标注 ${total} 篇`;
          return;
        }

        const paper = rawPapers[currentIndex];
        document.getElementById('paperCard').style.display = 'block';
        document.getElementById('doneMessage').style.display = 'none';
        document.getElementById('paperTitle').textContent = paper.title;
        document.getElementById('paperTitleCn').textContent = paper.title_cn || '';
        document.getElementById('paperMeta').innerHTML = 
          `<span class="tag ai">AI标签: ${paper.category || 'unknown'}</span>` +
          `${paper.journal} · ${paper.date}`;
        document.getElementById('paperAbstract').textContent = paper.abstract || '无摘要';
        document.getElementById('progress').textContent = 
          `第 ${currentIndex + 1} / ${rawPapers.length} 篇 · 已标注 ${Object.keys(annotations).length} 篇`;
      }

      function annotate(isRelevant) {
        const paper = rawPapers[currentIndex];
        annotations[paper.pmid] = {
          title: paper.title,
          title_cn: paper.title_cn || '',
          relevant: isRelevant,
          ai_category: paper.category || '',
          journal: paper.journal,
          date: paper.date,
        };
        localStorage.setItem('annotations', JSON.stringify(annotations));
        currentIndex++;
        loadPaper();
      }

      function exportResults() {
        const blob = new Blob([JSON.stringify(annotations, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'annotations.json';
        a.click();
        URL.revokeObjectURL(url);
      }

      function resetAll() {
        if (confirm('确定要清除所有标注吗？此操作不可恢复。')) {
          localStorage.removeItem('annotations');
          currentIndex = 0;
          location.reload();
        }
      }

      function goBack() {
        if (currentIndex > 0) {
          currentIndex--;
          const paper = rawPapers[currentIndex];
          delete annotations[paper.pmid];
          localStorage.setItem('annotations', JSON.stringify(annotations));
          loadPaper();
        }
      }

      // 绑定全局作用域方便 HTML 中的 onclick 调用
      window.annotate = annotate;
      window.exportResults = exportResults;
      window.resetAll = resetAll;
      window.goBack = goBack;

      loadPaper();
    })();</script></body></html>
