</style></head><body data-astro-cid-5vqnc7pn><div class="container" data-astro-cid-5vqnc7pn><h1 data-astro-cid-5vqnc7pn>📋 论文标注审查</h1><p class="progress" id="progress" data-astro-cid-5vqnc7pn>加载中...</p><div id="paperCard" class="card" style="display:none;" data-astro-cid-5vqnc7pn><div class="title" id="paperTitle" data-astro-cid-5vqnc7pn></div><div class="title-cn" id="paperTitleCn" data-astro-cid-5vqnc7pn></div><div class="meta" id="paperMeta" data-astro-cid-5vqnc7pn></div><div class="abstract" id="paperAbstract" data-astro-cid-5vqnc7pn></div><div class="buttons" data-astro-cid-5vqnc7pn><button class="btn yes" onclick="annotate(true)" data-astro-cid-5vqnc7pn>✅ 相关</button><button class="btn no" onclick="annotate(false)" data-astro-cid-5vqnc7pn>❌ 不相关</button></div></div><div id="doneMessage" class="done" style="display:none;" data-astro-cid-5vqnc7pn><p data-astro-cid-5vqnc7pn>🎉 全部标注完成！</p><button class="btn export" onclick="exportResults()" data-astro-cid-5vqnc7pn>📥 导出标注结果</button><button class="btn reset" onclick="resetAll()" data-astro-cid-5vqnc7pn>🔄 重新开始</button><button class="btn back" onclick="goBack()" data-astro-cid-5vqnc7pn>↩️ 返回上一篇</button></div></div><script>(function(){const papersJson = "[{\"title\":\"浙江省爬行类新纪录——崇安斜鳞蛇\",\"title_cn\":\"浙江省爬行类新纪录——崇安斜鳞蛇\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2025年8月，在浙江省庆元县采集到1号游蛇科（Colubridae）雄性标本。经形态比对，该标本与崇安斜鳞蛇（Pseudoxenodon karlschmidti）原始描述基本一致；基于Cyt b的系统发育分析显示，该标本与GenBank数据库中登记的崇安斜鳞蛇序列聚为一支（支持率为100%），种内遗传距离为6.23%，而与同属其他物种种间遗传距离均超过10.00%。综合形态与分子证据，确认该标本为崇安斜鳞蛇，此为浙江省爬行动物分布新记录种。此次发现丰富了浙江省爬行动物多样性本底资料，并拓展了该物种在华东地区的分布范围。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=163156494\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-浙江省爬行类新纪录——崇安斜鳞蛇\",\"category\":\"zoology\"},{\"title\":\"重庆首次记录宁陕脊蛇并描述一新亚种\",\"title_cn\":\"重庆首次记录宁陕脊蛇并描述一新亚种\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2025年5—7月，在重庆阴条岭国家级自然保护区和巫山县当阳乡共采集到3号脊蛇属（Achalinus）标本，经形态比较和基于线粒体COI基因的分子系统发育分析，鉴定其为宁陕脊蛇（A.ningshanensis），是该物种在重庆市的新纪录。其中，2号标本（SWU 0015230、SWU 0015643）在形态上以颔片2对区别于指名亚种（A.n.ningshanensis），以雄性腹鳞169枚、雄性尾下鳞52枚和雌性尾下鳞48枚区别于华西亚种（A.n.occidentalis），并在系统发育树中独立成支，与指名亚种、华西亚种的遗传距离分别为2.37%和4.22%。综合上述证据，将这2号标本定为宁陕脊蛇重庆亚种（Achalinus ningshanensis chongqingensis ssp. nov.）。此外，另1号采自重庆阴条岭国家级自然保护区的标本（SWU 0016884）与指名亚种聚为一支，二者遗传距离仅为0.87%，鉴定该标本为宁陕脊蛇指名亚种。本研究为重庆市爬行动物多样性提供了新资料。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=162737699\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-重庆首次记录宁陕脊蛇并描述一新亚种\",\"category\":\"zoology\"},{\"title\":\"湖南通道发现岜沙掌突蟾\",\"title_cn\":\"湖南通道发现岜沙掌突蟾\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2024年9月，在湖南省怀化市通道侗族自治县万佛山镇上洞村采集到2号角蟾科（Megophryidae）掌突蟾属（Leptobrachella）标本。经形态学鉴定，其形态特征与岜沙掌突蟾（L. bashaensis）相符。基于线粒体16S rRNA基因序列构建的系统发育分析表明，该标本与来自模式产地（贵州从江）的岜沙掌突蟾聚为一支；二者基于Kimura双参数模型计算的遗传距离为1.9%，远低于掌突蟾属的种间遗传距离平均值（10.3%）。综合形态学特征与分子系统发育分析结果，确认该标本为岜沙掌突蟾，系湖南省两栖动物分布新记录种。此项发现不仅丰富了湖南省两栖动物区系数据，也将该物种的已知分布范围向东北扩展了约100 km。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=147938736\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-湖南通道发现岜沙掌突蟾\",\"category\":\"zoology\"},{\"title\":\"中蹄蝠和大足鼠耳蝠斑驳白化现象\",\"title_cn\":\"中蹄蝠和大足鼠耳蝠斑驳白化现象\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"斑驳白化是一种由黑色素细胞局部迁移或分化异常所致的遗传性色素减退疾病，在蝙蝠中较为罕见。本研究于2025年7月22日在云南省河口瑶族自治县坝洒农场发现2只雄性成体斑驳白化中蹄蝠（Hipposideros larvatus），一只（YNHK-2025-001）斑驳区域位于左侧翼膜下方，另一只（YNHK-2025-002）则累及大部分翼膜、尾膜、左右胫骨、左右后足及尾骨；于2025年8月24日在江西省广丰区排山镇发现1只雌性成体斑驳白化大足鼠耳蝠（Myotis pilosus），其斑驳区域位于背颈部一侧，面积较小。大足鼠耳蝠斑驳白化现象为国内首次记录。通过测量体质量、前臂长等体型参数及回声定位声波峰频等参数，并与同种正常个体进行比较，结果显示：除1只斑驳白化中蹄蝠的耳宽（YNHK-2025-001）和斑驳白化大足鼠耳蝠的体质量不在正常参考范围外，其余个体的体型和回声定位声波参数均在正常范围内，表明斑驳白化现象未对蝙蝠的发声能力产生显著影响，且未见明显体型发育异常。研究结果可为后续斑驳白化蝙蝠的生理生态机制探究提供量化实证依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=164655963\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-中蹄蝠和大足鼠耳蝠斑驳白化现象\",\"category\":\"zoology\"},{\"title\":\"吉林集安发现斑驳白化马铁菊头蝠\",\"title_cn\":\"吉林集安发现斑驳白化马铁菊头蝠\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"斑驳白化是一种遗传性色素失调表型，在翼手目（Chiroptera）动物中报道较为罕见。2022年8月4日，在吉林省通化市集安市榆林镇治安村发现1只成体雌性斑驳白化菊头蝠（Rhinolophus sp.），其斑驳白化区域主要分布于胸部和左腹部，综合形态与声学特征将其鉴定为马铁菊头蝠（R.nippon），此为国内蝙蝠斑驳白化现象的最北分布记录。形态与声学参数测量结果显示，该斑驳白化个体除耳长和回声定位声波脉冲持续时间略高于正常个体外，其余形态和声学参数均处于同种正常范围内，表明斑驳白化可能未对该蝙蝠的生长发育和回声定位能力产生显著负面影响。本次发现不仅丰富了存在斑驳白化现象的蝙蝠物种种类，拓展了蝙蝠白化表型的地理分布范围，更为后续深入开展蝙蝠斑驳白化的发生机理、遗传规律及生态适应后果等相关研究提供了重要的基础数据和科学依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=161683117\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-吉林集安发现斑驳白化马铁菊头蝠\",\"category\":\"zoology\"},{\"title\":\"海南热带雨林国家公园两片区社区保护态度与参与意识的比较研究\",\"title_cn\":\"海南热带雨林国家公园两片区社区保护态度与参与意识的比较研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探究海南长臂猿（Nomascus hainanus）分布区与非分布区社区居民在野生动物保护中的认知、态度与行动差异及其影响因素，以海南热带雨林国家公园霸王岭片区（分布区）与五指山片区（非分布区）为研究区域，采用非诱导式半结构化问卷调查法，共收集有效样本821份，从保护认知、保护态度及保护行动3个维度进行对比分析，并结合广义线性模型与卡方检验分析相关影响因素。结果显示：（1）调查对象以黎族居民为主，职业构成以务农/务工为主，整体教育程度和收入水平偏低；（2）分布区居民对海南长臂猿等重点保护野生动物及自然保护地的认知水平显著高于非分布区（P \\u0026lt; 0.05），学历、居住地及保护地认知水平是导致认知差异的主要影响因素；（3）两地居民均普遍认可野生动物的生态与社会价值，明确反对猎捕并积极支持国家公园建设，但分布区居民的保护态度更为积极，该差异与年龄、居住地及对保护政策的认知程度显著相关（P \\u0026lt; 0.05）；（4）大部分居民参与过野生动物保护宣传活动，且普遍认为宣传活动有效提升了自身保护意识，其中分布区的保护宣传效果显著优于非分布区（P \\u0026lt; 0.05）。研究表明，社区居民在野生\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160292230\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-海南热带雨林国家公园两片区社区保护态度与参与意识的比较研究\",\"category\":\"zoology\"},{\"title\":\"基于\\u003citalic\\u003eND2\\u003c/italic\\u003e基因的西北地区密点麻蜥系统发育分析\",\"title_cn\":\"基于\\u003citalic\\u003eND2\\u003c/italic\\u003e基因的西北地区密点麻蜥系统发育分析\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"密点麻蜥（Eremias multiocellata）是中亚干旱生态系统的代表性蜥蜴，在我国北方及西北地区分布广泛，对维持荒漠生态系统结构与功能稳定具有重要作用。本研究以中国西北4个地理区域（内蒙古、宁夏、甘肃和新疆）的112份样本为研究对象，基于线粒体ND2基因序列，分析其遗传多样性、系统发育关系及遗传分化格局。结果显示：ND2基因序列A + T平均含量达60.7%，具有AT偏倚性；共检测到58个单倍型，单倍型多样性（Hd）为0.759～0.941，核苷酸多样性（π）为0.041～0.070，总体遗传多样性水平较高（Hd = 0.969，π = 0.072）。系统发育分析显示，密点麻蜥分化为两大跨区域演化支系，单倍型分布混杂，未形成与地理区域严格对应的单系结构；共检测到6个跨群体共享单倍型。遗传分化分析表明，群体间总体FST达0.510 89，存在较高的遗传分化，其中新疆群体与宁夏、内蒙古群体间的分化程度相对较高。中性检验与错配分布分析表明，甘肃、内蒙古和宁夏群体在演化历史上种群规模相对稳定，未经历显著的群体扩张事件，新疆群体存在历史扩张的生物学信号，但未达到统计学显著水平。研究结果\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160171715\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于\\u003citalic\\u003eND2\\u003c/italic\\u003e基因的西北地区密\",\"category\":\"zoology\"},{\"title\":\"石臼湖越冬豆雁与小天鹅肠道菌群及潜在病原菌研究\",\"title_cn\":\"石臼湖越冬豆雁与小天鹅肠道菌群及潜在病原菌研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为掌握石臼湖越冬水鸟肠道菌群及潜在病原菌的基本特征，本研究利用16S rRNA扩增子测序技术，对该湖泊越冬豆雁（Anser fabalis）和小天鹅（Cygnus columbianus）肠道菌群结构和病原菌组成进行了分析。结果表明：两种水鸟肠道菌群的Alpha多样性无显著性差异（Chao 1，P = 0.63；Shannon-Wiener，P = 0.48），但Beta多样性存在显著宿主分异（PERMANOVA，P \\u0026lt; 0.001）；优势菌门均为变形菌门（Proteobacteria）、厚壁菌门（Firmicutes）和拟杆菌门（Bacteroidota）；Sørensen相似性指数为0.84，表明两种水鸟肠道菌群群落相似度较高，推测与其亲缘关系较近、栖息环境一致密切相关；共检出潜在肠道病原菌22种，其中共有病原菌14种；屎肠球菌（Enterococcus faecium）为豆雁肠道优势病原菌（占病原菌总相对丰度的92.06%），乳房链球菌（Streptococcus uberis）、莫雷梭菌（Solobacterium moorei）及鲁氏耶尔森氏菌（Yersinia ruc\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160037101\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-石臼湖越冬豆雁与小天鹅肠道菌群及潜在病原菌研究\",\"category\":\"zoology\"},{\"title\":\"笼养丹顶鹤孵卵期行为模式偏离及丰容建议\",\"title_cn\":\"笼养丹顶鹤孵卵期行为模式偏离及丰容建议\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探究笼养环境对丹顶鹤孵卵期行为模式的影响，并为其环境丰容提供科学依据，本研究于2024年3—5月，以黑龙江扎龙国家级自然保护区的笼养与野生丹顶鹤（Grus japonensis）为研究对象，采用红外相机技术对比分析其孵卵期行为时间分配与活动节律，揭示笼养环境对其行为模式的制约因素，并分析环境因子与行为表达的相关性。结果表明：（1）笼养个体在关键繁殖行为上显著弱化，其中孵化警戒和翻卵行为的时间占比极显著低于野生个体（P \\u0026lt; 0.01）。（2）笼养群体的行为节律呈现与人类活动同步化特征，觅食、游走高峰提前且延长，对鸣、整理等行为峰期数量减少或时段偏移，与野生种群的天然节律存在偏离。（3）在笼养环境的丰容条件中，遮蔽度与孵化警戒（P \\u0026lt; 0.001）、翻卵（P \\u0026lt; 0.05）行为呈显著正相关，与孵化静栖行为呈显著负相关（P \\u0026lt; 0.01）；巢材种类（P \\u0026lt; 0.001）、地表覆盖度（P \\u0026lt; 0.05）与游走行为显著负相关；巢材数量、人类干预与孵化警戒行为显著正相关（P \\u0026lt; 0.05）。研究表明，笼养丹顶鹤在孵卵期存在行为时间分配和活动节律的适应性偏\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160122733\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-笼养丹顶鹤孵卵期行为模式偏离及丰容建议\",\"category\":\"zoology\"},{\"title\":\"基于集合模型的中国白鹇栖息地适宜性研究\",\"title_cn\":\"基于集合模型的中国白鹇栖息地适宜性研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"白鹇（Lophura nycthemera）是国家二级重点保护野生动物，因目前缺乏区域尺度的栖息地适宜性评价，制约了其大尺度保护管理措施的制定，故本研究采用集合物种分布模型（整合GAM、GLM、GBM、MaxEnt和RF五种算法）建立白鹇分布与环境变量之间的函数关系，并预测中国白鹇栖息地适宜性及其空间分布范围。结果显示：集合模型的预测性能（AUC、TSS和BOYCE分别为0.90、0.63和0.99）显著优于单算法模型；影响白鹇栖息地适宜性的主要因子为年降水总量、坡度、海拔和人类足迹指数；集合模型预测中国白鹇适宜栖息地面积约4.11 × 105 km2，主要分布于云南、福建、江西、四川、广东、浙江、湖南和广西，江苏适宜栖息地面积最小且破碎化程度最高。研究结果可为白鹇在区域尺度上的保护规划、栖息地管理与生态修复提供科学依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=146576613\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于集合模型的中国白鹇栖息地适宜性研究\",\"category\":\"bioinformatics\"},{\"title\":\"藏东布加雪山四种雉类的时空生态位关系\",\"title_cn\":\"藏东布加雪山四种雉类的时空生态位关系\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探讨布加雪山区域雉类的时空分布特征，2024年8月—2025年4月布设173台红外相机（回收150台），获得雉科（Phasianidae）独立有效记录701条，包括血雉（Ithaginis cruentus，n = 35）、黄喉雉鹑（Tetraophasis szechenyii，n = 19）、高原山鹑（Perdix hodgsoniae，n = 54）、白马鸡（Crossoptilon crossoptilon，n = 301）和藏雪鸡（Tetraogallus tibetanus，n = 292）。针对独立事件较多的血雉、高原山鹑、白马鸡和藏雪鸡（黄喉雉鹑因事件数有限未进行后续计算），选取海拔、坡度、坡向、崎岖度、植被归一化指数、距河流距离和人类足迹指数7个变量，利用占域模型和日活动节律分析其时空生态位关系。结果显示：距河流距离是影响4种雉类占域率的共同关键因子，表明水源可得性是其栖息地选择的基础限制因素。各物种在生境需求上呈现显著种间差异，白马鸡对人为干扰尤为敏感，藏雪鸡依赖地形与植被复合条件，高原山鹑对水源依赖性最为突出，血雉受植被、坡度和水源综合影响。物种相互作用因子（S\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=161331540\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-藏东布加雪山四种雉类的时空生态位关系\",\"category\":\"zoology\"},{\"title\":\"麝鼠睾丸\\u003citalic\\u003eAcsl\\u003c/italic\\u003e家族基因的表达差异及功能预测\",\"title_cn\":\"麝鼠睾丸\\u003citalic\\u003eAcsl\\u003c/italic\\u003e家族基因的表达差异及功能预测\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"麝鼠（Ondatra zibethicus）具有典型的季节性繁殖特征，其睾丸脂质代谢与精子发生过程可能受Acsl家族基因调控，但目前相关研究尚不充分。为探究麝鼠不同时期睾丸组织中Acsl家族基因（Acsl1、Acsl3、Acsl4、Acsl5和Acsl6）的表达差异并预测其功能，本研究选取体况相近、约11月龄的健康雄性麝鼠，分别于繁殖期（4月）、繁殖末期（9月）和非繁殖期（11月）各采集3只个体，采用qPCR技术检测睾丸中Acsl家族基因的表达差异，并运用生物信息学方法分析其编码蛋白的理化性质、结构特征及互作网络。结果表明：Acsl1和Acsl5在繁殖期的表达水平显著高于非繁殖期（P \\u0026lt; 0.05），其余家族基因虽有相对表达量差异但均未达到显著水平，且与非繁殖期相比呈现不同变化趋势；生物信息学分析表明，该家族编码蛋白均为亲水性蛋白，除Acsl6外其余成员均为稳定蛋白；跨膜结构预测显示，仅Acsl6含有2个跨膜结构域，其余家族成员均含1个；所有Acsl家族蛋白均具有AMP-binding结构域；蛋白互作网络预测表明，该家族基因主要参与脂肪酸活化、脂质合成与分解代谢，在脂肪酸的合成、\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160179979\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-麝鼠睾丸\\u003citalic\\u003eAcsl\\u003c/italic\\u003e家族基因的\",\"category\":\"zoology\"},{\"title\":\"基于氨基酸成分的象牙及其仿制品对比分析\",\"title_cn\":\"基于氨基酸成分的象牙及其仿制品对比分析\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为建立一种基于氨基酸成分的象牙及其仿制品的快速鉴别方法，本研究对非洲象牙、猛犸象牙、鹿骨、牛骨和野猪牙共56份样本中18种氨基酸的组分及含量进行分析测定，并运用正交偏最小二乘-判别分析（OPLS-DA）、方差分析和系统聚类分析方法，研究不同基原样本间氨基酸成分差异特征。结果表明：不同基原样本的氨基酸组成存在明显差异。通过OPLS-DA模型筛选出异亮氨酸、苯丙氨酸、赖氨酸、组氨酸和胱氨酸5种具有鉴别意义的差异氨基酸；5种差异氨基酸的总含量均值从高到低依次为鹿骨、猛犸象牙、野猪牙、牛骨和非洲象牙；系统聚类分析在欧几里得距离为5时，将56份基原样本分为5类，结果与OPLS-DA模型一致。研究表明，基于氨基酸组分并结合化学模式识别模型，能够实现对象牙及其仿制品的有效鉴别，为相关物种鉴定、海关监管与保护执法提供了新的技术支撑。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=145885848\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于氨基酸成分的象牙及其仿制品对比分析\",\"category\":\"zoology\"},{\"title\":\"河南省劳亚食虫目物种多样性及分布\",\"title_cn\":\"河南省劳亚食虫目物种多样性及分布\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"劳亚食虫目（Eulipotyphla）为现生哺乳动物第三大类群，中国迄今已记录3科107种。为厘清河南省劳亚食虫目的物种多样性本底，于2022年4月—2024年9月在全省30个采样点共采集劳亚食虫目标本244号，基于形态、头骨特征及线粒体Cyt b基因分子生物学证据进行物种鉴定，并结合最新分类系统和文献记录进行梳理。结果表明：（1）河南劳亚食虫目动物计有16种，隶属于3科11属；（2）区系以东洋界物种为主（10种，占62.5%），兼具古北界物种（3种）和广布种（3种）；（3）删除中鼩鼱（Sorex caecutiens）和小缺齿鼹（Mogera wogura）在河南省的分布记录，修订大别山区缺齿鼹（M.latouchei）为海岛缺齿鼹（M.insularis）、大水鼩鼱（Chimarrogale platycephala）为利安德水鼩（C.leander）、短棘猬（Hemiechinus dauricus）为侯氏猬（Mesechinus hughi）。本研究提供了河南省食虫类动物多样性的第一手资料，更新了区域物种名录，可望为生物多样性保护与管理提供科学依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=145120970\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-河南省劳亚食虫目物种多样性及分布\",\"category\":\"zoology\"},{\"title\":\"中国东北地区大缺齿鼹指名亚种分子系统地理学研究\",\"title_cn\":\"中国东北地区大缺齿鼹指名亚种分子系统地理学研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为明确我国大缺齿鼹（Mogera robusta）的分子系统地理分化地位，探讨其进化历史事件及分子系统地理学分化与亚种分化的关联性，本研究在黑龙江省和辽宁省补充采集样本13号，结合GenBank数据库已公开的113条遗传数据，对126个大缺齿鼹样本的线粒体Cyt b基因全序列进行分析。结果显示：所有样本共鉴定出35个单倍型，核苷酸多态性（π）为0.002 17，表明该种群具有一定的遗传多样性水平。系统发育树和中介网络分析显示，所有单倍型构成一个单系群，缺乏与地理分布（中国东北、俄罗斯远东、朝鲜半岛）显著对应的谱系结构。种群历史动态分析表明，大缺齿鼹近期经历了种群扩张。大缺齿鼹指名亚种（M.r.robusta）和朝鲜亚种（M.r.coreana）在分子水平上未见明显分化。上述结果暗示，大缺齿鼹在第四纪冰期可能利用了一个冰期避难所。本研究结果为深入研究鼹科（Talpidae）动物的系统地理学和进化历史提供了新的数据积累。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=153325656\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-中国东北地区大缺齿鼹指名亚种分子系统地理学研究\",\"category\":\"zoology\"},{\"title\":\"北京市门头沟区七种兽类种群密度研究\",\"title_cn\":\"北京市门头沟区七种兽类种群密度研究\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"野生动物种群动态是种群生态学的核心研究内容，也是物种保护管理工作的重要基础。北京市门头沟区是北京西部重要的生态屏障，承载着区域生物多样性保育的关键功能。本研究基于2022—2023年红外相机监测数据，运用随机相遇模型（random encounter model，REM）对门头沟区7种野生兽类开展种群密度估算，并分析其年度变化趋势及潜在影响因素。结果显示：狍（Capreolus pygargus）、中华斑羚（Naemorhedus griseus）、野猪（Sus scrofa）和猪獾（Arctonyx collaris）种群密度均呈上升趋势，增幅依次为24.4%、7.4%、34.6%和23.1%，其中野猪增长最快（由2.83只/km²升至3.81只/km²），中华斑羚增长最为平缓（由2.17只/km²升至2.33只/km²）；豹猫（Prionailurus bengalensis）小幅下降（由3.41只/km2降至3.25只/km2）；亚洲狗獾（Meles leucurus）降幅最大，达35.4%（由19.31只/km2降至12.47只/km2）；赤狐（Vulpes vulpes）20\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=162454343\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-北京市门头沟区七种兽类种群密度研究\",\"category\":\"zoology\"},{\"title\":\"父本亲代投资缺失对圈养川金丝猴婴猴行为的影响\",\"title_cn\":\"父本亲代投资缺失对圈养川金丝猴婴猴行为的影响\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探究家庭结构完整性对圈养川金丝猴（Rhinopithecus roxellana）婴猴行为发育的影响，本研究于2025年5—6月，以圈养条件下完整家庭与父本亲代投资缺失家庭中的婴猴为研究对象，采用瞬时扫描取样法观察其昼间行为节律、亲子互动及依赖性行为特征。结果显示：（1）两组婴猴摄食高峰均受人工投喂影响，但完整家庭组婴猴活动意愿更强，玩耍（32.21%）、休息（37.23%）占比显著高于父本亲代投资缺失家庭组，后者的移动（25.92%）和拥坐（13.59%）行为占比显著升高；（2）在母婴互动中，完整家庭组理毛（57.14%）和保护（5.36%）行为占比显著高于父本亲代投资缺失家庭组（P \\u0026lt; 0.05），后者以母婴拥坐（52.23%）为主，互动类型单一；（3）完整家庭组父婴互动以跟随（53.33%）和玩耍（26.67%）为主，父母间理毛占比达78.11%，有助于营造稳定的家庭社交环境；（4）完整家庭组婴猴依赖对象多元，母婴理毛占比最高（46.50%），父婴相关依赖合计占27.24%；父本亲代投资缺失家庭组则高度集中于母婴拥坐（53.97%），保护性依赖仅占1.02%，社会支持结构\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160304275\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-父本亲代投资缺失对圈养川金丝猴婴猴行为的影响\",\"category\":\"zoology\"},{\"title\":\"Shifting drivers and predictable corridors of an illegal wildlife trade network.\",\"title_cn\":\"非法野生动物贸易网络的动态驱动因素与可预测通道。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-08\",\"authors\":\"Olah G, León-Pérez R, Berryman AJ et al.\",\"abstract\":\"Illegal wildlife trade is a major driver of biodiversity loss but the lack of understanding of mechanisms sustaining criminal networks hampers law enforcement. We integrated three decades of confiscation data, criminological modeling, and spatial network analysis to dissect the illegal parrot trade in Mexico, a global hotspot of parrot diversity and endemism. Our interdisciplinary approach revealed that the wildlife trade is the leading threat, elevating their extinction risk. Trade is shifting \",\"doi\":\"10.1073/pnas.2609240123\",\"url\":\"https://doi.org/10.1073/pnas.2609240123\",\"pmid\":\"42636352\",\"category\":\"zoology\"},{\"title\":\"Pelagic food web realignment supports resilient larvae of Southern Bluefin Tuna in a warming ocean.\",\"title_cn\":\"远洋食物网重组支持南太平洋蓝鳍金枪鱼幼鱼在变暖海洋中的适应性。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-01\",\"authors\":\"Landry MR, Laiz-Carrión R, Malca E et al.\",\"abstract\":\"Many of the oceans' top predatory fishes at low to mid latitudes face an uncertain future as their vulnerable larvae deal with higher environmental temperature and reduced productivity associated with climate change. However, ocean ecosystem models that predict a general decline of zooplankton prey with warming and stratification hardly ever account for complexities in pelagic food webs that might make them resilient in providing food resources for larvae. We illustrate such complexities in comp\",\"doi\":\"10.1073/pnas.2601583123\",\"url\":\"https://doi.org/10.1073/pnas.2601583123\",\"pmid\":\"42636360\",\"category\":\"ecology\"},{\"title\":\"野生动物友好型农业研究与实践进展\",\"title_cn\":\"野生动物友好型农业研究与实践进展\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"全球人口增长带来的粮食需求增加，导致农业用地不断扩张与农药化肥过量使用，这是造成野生动物生境丧失、破碎化及质量下降的主要原因之一。野生动物友好型农业（wildlife-friendly farming， WFF）作为一种新兴农业模式，为缓解农业发展与野生动物保护之间的矛盾提供了可行路径。本研究综述了国内外相关研究和实践经验，梳理了WFF的起源与概念，分析了其在实践中的进展，并详细阐述了通过改造农业景观为野生动物提供栖息地的多种策略，借助经济激励手段促进野生动物保护与控制农药化肥过度使用所形成的正反馈循环，以及野生动物智慧监测技术在WFF的应用前景，并总结了当前国内外WFF的经济和社会实践。尽管WFF在小范围内的成功案例已展现出明显优势，但在更广泛的实施过程中仍面临诸多挑战，包括农业景观中野生动物监测技术落后、欠缺对气候变化的考量，以及市场机制低效、政策支持和公众意识不足等。未来，WFF需充分利用人工智能监测设备、区块链等先进技术，增强其实际应用的可行性；应因地制宜，结合不同地理区域的生态与经济需求，在政策、经济和社会层面加强协调合作，以支持可持续农业和野生动物保护的协同目标，最终实现农\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=143585403\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-野生动物友好型农业研究与实践进展\",\"category\":\"zoology\",\"match_count\":1,\"is_hot\":false},{\"title\":\"China's solar expansion policy reduces bird diversity.\",\"title_cn\":\"\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-20\",\"authors\":\"Zhang H, Zhang A, Wu K et al.\",\"abstract\":\"Could the global transition to renewable energy create a green dilemma that pits carbon reduction against biodiversity conservation? This study examined the effect of policies promoting solar photovoltaics on local avian biodiversity using a panel dataset covering 2344 counties in China from 2014 to 2023. Policies that favored photovoltaic expansion led to reductions in bird diversity, disproportionately affecting wealthier and nondesert regions, as well as widespread species. The mechanism oper\",\"doi\":\"10.1126/science.aee0747\",\"url\":\"https://doi.org/10.1126/science.aee0747\",\"pmid\":\"42623453\",\"category\":\"zoology\",\"match_count\":3,\"is_hot\":true},{\"title\":\"A queen odour mediates reproductive suppression in a eusocial mammal.\",\"title_cn\":\"蜂后气味介导真社会性哺乳动物的生殖抑制。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-08-01\",\"authors\":\"Khallaf MA, Hart DW, Luo W et al.\",\"abstract\":\"Eusociality is exceptionally rare in mammals, and its proximate mechanisms remain poorly understood. Naked mole-rats provide a striking example, with reproduction restricted to a single queen, while all other females remain infertile\",\"doi\":\"10.1038/s41586-026-10772-5\",\"url\":\"https://doi.org/10.1038/s41586-026-10772-5\",\"pmid\":\"42457958\",\"category\":\"zoology\"},{\"title\":\"A 5.3-million-year-old deep-sea whale necropolis in the Diamantina Zone.\",\"title_cn\":\"五百三十万年前深海鲸类墓群：迪亚曼蒂纳区的发现\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-06-01\",\"authors\":\"Peng X, Zhou P, Song X et al.\",\"abstract\":\"Whale falls are biodiversity oases at seabeds\",\"doi\":\"10.1038/s41586-026-10546-z\",\"url\":\"https://doi.org/10.1038/s41586-026-10546-z\",\"pmid\":\"42271050\",\"category\":\"conservation\"},{\"title\":\"Darkness and body size shaped end-Cretaceous marine extinction patterns.\",\"title_cn\":\"黑暗与体型塑造了白垩纪末期海洋灭绝模式。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Ying R, Monteiro FM, Witts JD et al.\",\"abstract\":\"The Chicxulub asteroid impact at the Cretaceous-Paleogene (K-Pg) boundary (66 Ma) is thought to have caused the extinction of around 75% of species in the fossil record by triggering catastrophic environmental changes\",\"doi\":\"10.1038/s41586-026-10541-4\",\"url\":\"https://doi.org/10.1038/s41586-026-10541-4\",\"pmid\":\"42203866\",\"category\":\"paleontology\"},{\"title\":\"Adaptive cellular evolution in the intestine of hyperdiverse cichlid fishes.\",\"title_cn\":\"高多样性丽鱼科鱼类肠道中的适应性细胞进化。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Fages A, Luxey M, Ronco F et al.\",\"abstract\":\"The ability of animals to efficiently track down and digest food is crucial for their survival, and the specialization to different diets is a major driver of diversification in this group\",\"doi\":\"10.1038/s41586-026-10494-8\",\"url\":\"https://doi.org/10.1038/s41586-026-10494-8\",\"pmid\":\"42129563\",\"category\":\"zoology\"},{\"title\":\"Specific expansion of motor cortical projections in a singing mouse.\",\"title_cn\":\"鸣唱小鼠运动皮层投射的特异性扩展。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Isko EC, Harpole CE, Zheng XM et al.\",\"abstract\":\"Elucidating how modifications in neural circuit architecture drive behavioural innovation remains a key challenge in neuroscience and evolutionary biology. In mammals, the neocortex is posited to play a crucial part in facilitating rapid behavioural innovations\",\"doi\":\"10.1038/s41586-026-10458-y\",\"url\":\"https://doi.org/10.1038/s41586-026-10458-y\",\"pmid\":\"42092144\",\"category\":\"zoology\"},{\"title\":\"The scales of strain on sharks.\",\"title_cn\":\"鲨鱼承受压力的尺度。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-13\",\"authors\":\"Roopnarine PD\",\"abstract\":\"The fossil record attributes shark decline in the Caribbean to human activity.\",\"doi\":\"10.1126/science.aek0549\",\"url\":\"https://doi.org/10.1126/science.aek0549\",\"pmid\":\"42594218\",\"category\":\"paleontology\"},{\"title\":\"Fossil denticles reveal how ocean productivity shapes shark baselines and recovery potential.\",\"title_cn\":\"化石皮齿揭示海洋生产力如何塑造鲨鱼基线及恢复潜力。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-13\",\"authors\":\"Dillon EM, McCauley DJ, González M et al.\",\"abstract\":\"Shark populations on coral reefs have declined globally, but few baselines exist to quantify natural variability before human impact. Using fossil dermal denticles preserved in reef sediments, we reconstructed shark communities across the Isthmus of Panama before substantial exploitation [~7 to 3 thousand years ago (ka)] and recently (past century). We found differences in shark baselines and responses to fishing between the oceans on either side of the Isthmus. Reefs in the Pacific supported an\",\"doi\":\"10.1126/science.aec2144\",\"url\":\"https://doi.org/10.1126/science.aec2144\",\"pmid\":\"42594196\",\"category\":\"ecology\"},{\"title\":\"Fossil evidence favors a role for vision in the modular evolution of the primate neocortex.\",\"title_cn\":\"化石证据支持视觉在灵长类新皮层模块化进化中的作用。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-06\",\"authors\":\"Kay RF, Organ CL, Morse PE et al.\",\"abstract\":\"Neocortical expansion is a key innovation of crown primates, although fossil evidence for how the neocortex has evolved remains elusive. We studied neocortical evolution using virtual brain endocasts from extant and Eocene-Miocene fossil primates. We found that neocortex size increased in parallel across crown primate clades, with rapid increases in tarsiers and anthropoids. Although the frontal lobe is commonly described as having expanded disproportionately in primates, we show that it evolved\",\"doi\":\"10.1126/science.aee3541\",\"url\":\"https://doi.org/10.1126/science.aee3541\",\"pmid\":\"42561065\",\"category\":\"evolution\"},{\"title\":\"Genes of an icon.\",\"title_cn\":\"一个偶像的基因。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-06\",\"authors\":\"Price M\",\"abstract\":\"In the DNA of bison, scientists find clues to the animals' past-and keys to safeguarding their future.\",\"doi\":\"10.1126/science.ael2158\",\"url\":\"https://doi.org/10.1126/science.ael2158\",\"pmid\":\"42561059\",\"category\":\"zoology\"},{\"title\":\"When mammals crossed between continents.\",\"title_cn\":\"当哺乳动物跨越大陆之间。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"McGuire JL, Williams CM\",\"abstract\":\"The Great American Biotic Interchange informs the dynamics of modern species invasions.\",\"doi\":\"10.1126/science.aei5362\",\"url\":\"https://doi.org/10.1126/science.aei5362\",\"pmid\":\"42531416\",\"category\":\"zoology\"},{\"title\":\"A 10-million-year biogeographic holding pen primed the Great American Biotic Interchange.\",\"title_cn\":\"一千万年的生物地理学“暂存围栏”为美洲大生物交流做好了准备。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"Tseng ZJ, Kahn LX, Pacheco-Castro A et al.\",\"abstract\":\"The movement of taxa between North and South America across the Panamanian land bridge, known as the Great American Biotic Interchange (GABI), established modern-day mammal assemblages in the Americas, heralding the decisive end of what has been called the \\\"splendid isolation\\\" of the South American fauna. Lacking substantive low-latitude records, previous work on this pattern relied on South American and temperate North American fossils to conclude that pulsed interchanges began about 2.8 millio\",\"doi\":\"10.1126/science.aef2893\",\"url\":\"https://doi.org/10.1126/science.aef2893\",\"pmid\":\"42531382\",\"category\":\"zoology\"},{\"title\":\"Beyond the scales: Marine archaeogenomics for the conservation and restoration of fisheries.\",\"title_cn\":\"超越尺度：海洋古基因组学在渔业保护与恢复中的应用\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"Atmore LM, Star B\",\"abstract\":\"Protection and restoration of marine environments are essential for food security and climate change mitigation. Yet historical and archaeological research have shown that conservation and management often rely on arbitrary ecological baselines in ecosystems already shaped by long-term human impacts. Archaeogenomics, the combination of ancient DNA (aDNA) and whole-genome sequencing, provides invaluable insights into these impacts. Recent improvements in laboratory and computational techniques en\",\"doi\":\"10.1126/science.aeg0333\",\"url\":\"https://doi.org/10.1126/science.aeg0333\",\"pmid\":\"42531380\",\"category\":\"ecology\"},{\"title\":\"Birdsong diversity across the world.\",\"title_cn\":\"全球鸟类鸣声多样性。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-23\",\"authors\":\"Briefer EF\",\"abstract\":\"Birdsong motifs are shaped by evolutionary history, biological traits, and environmental constraints.\",\"doi\":\"10.1126/science.aej0087\",\"url\":\"https://doi.org/10.1126/science.aej0087\",\"pmid\":\"42490503\",\"category\":\"zoology\"},{\"title\":\"The global biogeography of passerine songs.\",\"title_cn\":\"雀形目鸟类鸣唱的全球生物地理格局。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-23\",\"authors\":\"Bacquelé Q, Barnagaud JY, Violle C et al.\",\"abstract\":\"Although bird songs are classic models for understanding the evolution of vocal communication, their global diversity has long made the development of a unifying framework challenging. By analyzing the acoustic architecture of songs from more than 3000 passerine species worldwide, we show that this acoustic space can be structured around eight elemental motifs. The differential use of these motifs is driven by a combination of species' biological traits (social organization, morphology, and mati\",\"doi\":\"10.1126/science.aee6239\",\"url\":\"https://doi.org/10.1126/science.aee6239\",\"pmid\":\"42490479\",\"category\":\"zoology\"},{\"title\":\"Performance trade-offs define a fundamental dental dichotomy in mammals.\",\"title_cn\":\"性能权衡定义了哺乳动物牙齿的一个基本二分法。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-16\",\"authors\":\"Chatar N, Vankelst M, Pérez-Ramos A et al.\",\"abstract\":\"Teeth define mammalian evolution, and one of many adaptive dental breakthroughs in crown mammals is the tribosphenic molar: a tooth with a dual shearing-crushing function, often considered a key adaptation in crown mammals. However, we do not know how potential trade-offs between these antagonistic functions may influence the macroevolutionary outcomes of mammalian lineages. Here, we show that predatory mammals evolved dichotomized performance in their tribosphenic carnassial teeth, with slicing\",\"doi\":\"10.1126/science.aee3453\",\"url\":\"https://doi.org/10.1126/science.aee3453\",\"pmid\":\"42462039\",\"category\":\"zoology\"},{\"title\":\"As bird flu threatens, New Zealand vaccinates endangered birds.\",\"title_cn\":\"禽流感威胁下，新西兰为濒危鸟类接种疫苗。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-09\",\"authors\":\"Larson C\",\"abstract\":\"Arrival of H5N1 virus on Australian mainland triggers ambitious vaccination program.\",\"doi\":\"10.1126/science.aek3889\",\"url\":\"https://doi.org/10.1126/science.aek3889\",\"pmid\":\"42424466\",\"category\":\"zoology\"},{\"title\":\"Innate factors and ontogeny determine nonbreeding areas of migrant songbirds.\",\"title_cn\":\"先天因素和个体发育决定迁徙鸣禽的非繁殖区域。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-25\",\"authors\":\"Lamers KP, Ouwehand J, Ubels R et al.\",\"abstract\":\"Migratory birds connect ecosystems worldwide and often show connectivity between breeding and nonbreeding areas, meaning that individuals have nonbreeding (\\\"wintering\\\") locations close to others from the same breeding population. Although much work has characterized migration routes, we know little about what determines nonbreeding areas. We tracked pied flycatchers (\",\"doi\":\"10.1126/science.ads0532\",\"url\":\"https://doi.org/10.1126/science.ads0532\",\"pmid\":\"42348687\",\"category\":\"zoology\"},{\"title\":\"Lamprey 3D single-cell transcriptomics reveals ancestral and specialized features of the vertebrate brain.\",\"title_cn\":\"七鳃鳗三维单细胞转录组学揭示脊椎动物大脑的祖先性和特化特征。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Wu H, Chen D, Li J et al.\",\"abstract\":\"The lamprey occupies a pivotal position for elucidating vertebrate brain evolution. Using spatial transcriptomics and single-nucleus RNA sequencing, we generated a three-dimensional molecular atlas of the lamprey brain, identifying 209 distinct cell clusters across 14 regions. Cross-species comparisons revealed broad conservation of regional spatial architecture, defining an ancestral organizational blueprint. Within this conserved framework, however, marked lineage-specific divergence emerged. \",\"doi\":\"10.1126/science.aea2535\",\"url\":\"https://doi.org/10.1126/science.aea2535\",\"pmid\":\"42313957\",\"category\":\"zoology\"},{\"title\":\"Tracking the roots of zoonoses.\",\"title_cn\":\"追踪人畜共患病的根源。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Key FM\",\"abstract\":\"Ancient pathogen DNA from animals elucidates the origin and evolution of infectious diseases.\",\"doi\":\"10.1126/science.aef0941\",\"url\":\"https://doi.org/10.1126/science.aef0941\",\"pmid\":\"42313956\",\"category\":\"zoology\"},{\"title\":\"Changes in wildlife activity patterns in response to war in Ukraine.\",\"title_cn\":\"乌克兰战争对野生动物活动模式变化的影响\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Kudrenko S, Bischof R, Zedrosser A et al.\",\"abstract\":\"Conflict zones are inherently hazardous and inaccessible for researchers, which results in a knowledge gap about the immediate effects of armed conflicts on the environment, particularly wildlife. We used camera-trap detections to investigate the impact of armed conflict on wildlife activity patterns before, during, and after the Russian occupation of the Chornobyl Exclusion Zone (Ukraine) in 2022 and compared it to the same period in 2021. Mammal species responded to armed conflict through imme\",\"doi\":\"10.1126/science.aed1493\",\"url\":\"https://doi.org/10.1126/science.aed1493\",\"pmid\":\"42313953\",\"category\":\"zoology\"},{\"title\":\"Threatened 'rolling stone reefs' are surprisingly diverse.\",\"title_cn\":\"受威胁的“滚动石礁”生物多样性惊人。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-04\",\"authors\":\"Moutinho S\",\"abstract\":\"DNA study reveals hidden biodiversity off Brazil-and raises alarm over oil exploration.\",\"doi\":\"10.1126/science.aej3866\",\"url\":\"https://doi.org/10.1126/science.aej3866\",\"pmid\":\"42241541\",\"category\":\"conservation\"},{\"title\":\"A kinematic convergence in ape and monkey vertical climbing informs debates on early hominin arborealism.\",\"title_cn\":\"猿猴垂直攀爬中的运动学趋同，为早期人类树栖生活的争论提供了启示。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-01\",\"authors\":\"Fannin LD, Pape C, McGraw WS\",\"abstract\":\"Recent debates on early hominin arborealism center around interpretations of fossilized foot bones as being either \\\"African ape\\\"- or \\\"monkey\\\"- like in their morphology. These dueling interpretations fuel competing locomotor reconstructions of the last common ancestor of chimpanzees and humans (LCA), including disagreements about the prevalence of vertical climbing behaviors. Yet it remains unclear if possessing an ape- or monkey-like foot impacts the safety and efficiency of climbing, in part be\",\"doi\":\"10.1073/pnas.2608183123\",\"url\":\"https://doi.org/10.1073/pnas.2608183123\",\"pmid\":\"42607191\",\"category\":\"behavior\"},{\"title\":\"Decision rules diverge between sympatric Featherfin cichlids despite shared preferences, ecology, and evolutionary history.\",\"title_cn\":\"尽管共享偏好、生态和进化历史，同域分布的羽鳍丽鱼科鱼类的决策规则仍存在分歧。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Tomasek M, Dunster B, Goverts Z et al.\",\"abstract\":\"It has been hypothesized that divergence in animal decision processes can be attributed to differences in information processing mechanisms. However, the required comparative tests of this idea are hindered by ecological, perceptual, or motivational divergence among species that confound a direct analysis of decision processes. To overcome these limitations, we study two closely related, sympatric cichlid fishes (\",\"doi\":\"10.1073/pnas.2620602123\",\"url\":\"https://doi.org/10.1073/pnas.2620602123\",\"pmid\":\"42584995\",\"category\":\"zoology\"},{\"title\":\"How illegal wildlife trade adheres to and defies conventional market behavior.\",\"title_cn\":\"非法野生动物贸易如何遵循并违背常规市场行为。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Midgette G, Gore ML\",\"abstract\":\"Illegal wildlife markets comprise a complex global economy generating criminal profits while harming biodiversity and livelihoods. The negative externalities from biodiversity loss, ecosystem destabilization, and zoonotic disease risk may be orders of magnitude larger than the multibillion dollar annual total market value. Despite decades of international policy attention, fundamental economic characteristics of these markets remain poorly understood. We suggest distinguishing three categories o\",\"doi\":\"10.1073/pnas.2525056123\",\"url\":\"https://doi.org/10.1073/pnas.2525056123\",\"pmid\":\"42574631\",\"category\":\"zoology\"},{\"title\":\"Many-eyes and sentinels in selfish and cooperative groups.\",\"title_cn\":\"自私与协作群体中的多眼与哨兵机制。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Pilgrim C, Bate AM, Sigalou A et al.\",\"abstract\":\"Collective vigilance describes how animals in groups benefit from the predator detection efforts of others. Empirical observations typically find either a many-eyes strategy with all (or many) group members maintaining a low level of individual vigilance, or a sentinel strategy with one (or a few) individuals maintaining a high level of individual vigilance while others do not. With an analytical treatment that makes minimal assumptions, we show that these two strategies are alternative solution\",\"doi\":\"10.1073/pnas.2536017123\",\"url\":\"https://doi.org/10.1073/pnas.2536017123\",\"pmid\":\"42574625\",\"category\":\"zoology\"},{\"title\":\"Pair living emerged early in placental mammals.\",\"title_cn\":\"胎盘哺乳动物早期便出现了成对生活。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Walmsley SF, Olivier CA, Jaeggi AV et al.\",\"abstract\":\"It is widely assumed that the first placental mammals were solitary. Here, we tested this assumption and which ecological and life history factors are related to mammalian social organization. We compiled a comprehensive database by reviewing over 14,000 primary peer-reviewed publications on the social organization of the 5,390 extant placental mammal species. We found empirical data for 726 species across 1,473 populations: 353 populations were primarily solitary, 250 populations pair living, a\",\"doi\":\"10.1073/pnas.2528458123\",\"url\":\"https://doi.org/10.1073/pnas.2528458123\",\"pmid\":\"42520129\",\"category\":\"zoology\"},{\"title\":\"Sprint-like cardiac dynamics support repeated acrobatic lunges in foraging rorqual whales.\",\"title_cn\":\"冲刺式心脏动力学支持须鲸觅食时重复的杂技式冲刺捕食。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Blawas AM, Fahlbusch J, Barkowski J et al.\",\"abstract\":\"The dive response decreases heart rate, regulates blood flow distribution, conserves oxygen, and extends dive duration. In diving animals, dive heart rate can be modulated to meet increased demands of exercise during foraging. However, lunge-feeding rorquals represent an extreme example of exercise under breath-hold conditions: Though most of their dive time is spent gliding and filtering, lunges require high-power, acrobatic sprints to engulf massive volumes of prey-laden water. Our biologging \",\"doi\":\"10.1073/pnas.2613082123\",\"url\":\"https://doi.org/10.1073/pnas.2613082123\",\"pmid\":\"42507932\",\"category\":\"zoology\"},{\"title\":\"Dominant functional group explains global bird diversity responses to farmland abandonment.\",\"title_cn\":\"优势功能群解释了全球鸟类多样性对农田弃耕的响应。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Kitazawa M, Yamaura Y, Kawamura K et al.\",\"abstract\":\"Reversing biodiversity declines will require redesigning agricultural landscapes and their management. Farmland abandonment and intensification are emerging as major drivers of biodiversity changes, and their consequences vary widely from negative to positive among continents. Despite decades of research on agricultural biodiversity, no generalizable framework has been established to predict these variations globally, hindering the development of effective conservation strategies. Here, we combi\",\"doi\":\"10.1073/pnas.2530120123\",\"url\":\"https://doi.org/10.1073/pnas.2530120123\",\"pmid\":\"42507928\",\"category\":\"zoology\"},{\"title\":\"Echolocating bats sacrifice binaural localization cues for target-focused hearing during high-speed foraging.\",\"title_cn\":\"回声定位蝙蝠在高速觅食时牺牲双耳定位线索以聚焦目标听觉。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-28\",\"authors\":\"Häfele FT, Wisniewska DM, Vesterholm KK et al.\",\"abstract\":\"Accurate sound localization is critical to navigation and foraging in echolocating animals. During both passive listening and active echolocation, bats are thought to rely solely on interaural level differences (ILDs) between the two ears, attaining very large ILDs by orienting their outer ears apart. However, detecting weak prey echoes during high-speed foraging should instead favor target-focused pinnae that maximize sonar range and reduce clutter interference. Therefore, we propose that flyin\",\"doi\":\"10.1073/pnas.2605701123\",\"url\":\"https://doi.org/10.1073/pnas.2605701123\",\"pmid\":\"42475565\",\"category\":\"zoology\"},{\"title\":\"Human and animal morbillivirus strains causing chronic neurological infections share key genotypic and phenotypic traits.\",\"title_cn\":\"引起慢性神经系统感染的人类和动物麻疹病毒属毒株共享关键基因型和表型特征。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-14\",\"authors\":\"Daniel Roji M, Geiselhardt F, Beythien G et al.\",\"abstract\":\"Long-term persistent measles virus (MeV) infection of the central nervous system (CNS) can result in subacute sclerosing panencephalitis (SSPE), an invariably fatal late neurological complication of measles. Analogous SSPE-like chronic diseases have also been reported in adult dogs, cetaceans, and more recently harbor seals following infection by canine distemper virus (CDV), dolphin morbillivirus (DMV), and phocine distemper virus (PDV), respectively. Here, we characterize different animal morb\",\"doi\":\"10.1073/pnas.2604205123\",\"url\":\"https://doi.org/10.1073/pnas.2604205123\",\"pmid\":\"42412932\",\"category\":\"zoology\"},{\"title\":\"A transcription factor modulates dermal architecture to generate structural and pigment color diversity in lizards.\",\"title_cn\":\"一种转录因子通过调节皮肤结构，在蜥蜴中产生结构和色素颜色的多样性。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Aguilar P, Andrade P, Brejcha J et al.\",\"abstract\":\"The way organisms perceive the world influences their evolution. Many animals detect ultraviolet (UV) light invisible to humans, creating sensory contexts that alter the selective landscape for coloration. Here, we dissected the molecular basis of a UV-reflecting color morph in common wall lizards, uncovering its association with a noncoding region upstream of the transcription factor\",\"doi\":\"10.1073/pnas.2604532123\",\"url\":\"https://doi.org/10.1073/pnas.2604532123\",\"pmid\":\"42384684\",\"category\":\"zoology\"},{\"title\":\"Monitoring major biodiversity stronghold in war zones: Model predicts Lake Chad remains Africa's most important wetland for waterbirds.\",\"title_cn\":\"战乱地区主要生物多样性堡垒监测：模型预测乍得湖仍是非洲最重要的水鸟湿地。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Defos du Rau P, Godeau U, Carenton N et al.\",\"abstract\":\"Lake Chad is both one of the largest transboundary wetlands in Africa and a major biodiversity hotspot. As such, Lake Chad would require sound and long-term biodiversity monitoring, but it is also a war zone. Using several mitigation measures, we succeeded in surveying a major part of it in 2022 to estimate the abundance of wildlife. This study marked the first comprehensive population estimates for some species. Compared to previous total count approaches, we introduced an aerial distance sampl\",\"doi\":\"10.1073/pnas.2603538123\",\"url\":\"https://doi.org/10.1073/pnas.2603538123\",\"pmid\":\"42378274\",\"category\":\"zoology\"},{\"title\":\"Natural history on canvas: Brueghel knew about bird-eating noctule bats.\",\"title_cn\":\"画布上的自然史：勃鲁盖尔了解食鸟夜蝠。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Romero-Vidal P, Sánchez-Navarro S, Tena E et al.\",\"abstract\":\"A recent study has provided the first direct evidence that the greater noctule bat (\",\"doi\":\"10.1073/pnas.2536525123\",\"url\":\"https://doi.org/10.1073/pnas.2536525123\",\"pmid\":\"42372166\",\"category\":\"zoology\"},{\"title\":\"Genomic and structural evidence of SARS-CoV-2 and MERS-CoV in migratory birds.\",\"title_cn\":\"迁徙鸟类中SARS-CoV-2和MERS-CoV的基因组及结构证据。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Cao J, Liu S, Su C et al.\",\"abstract\":\"Migratory birds are the natural reservoir of influenza A virus (IAV), but their role as a carrier of SARS-CoV-2 remains unclear. Here, we report the identification of three almost full-length viral genome sequences of SARS-CoV-2 variants of concern (VOCs) in Tundra swans. These sequences are named hCoV-19/Tundra swan/Jiangxi/IMCAS_M1/2021 (IMCAS_M1), hCoV-19/Tundra swan/Jiangxi /IMCAS_M2/2021 (IMCAS_M2), and hCoV-19/Tundra swan/Jiangxi/IMCAS_M3/2021 (IMCAS_M3). IMCAS_M1 and IMCAS_M3 have the sam\",\"doi\":\"10.1073/pnas.2400023123\",\"url\":\"https://doi.org/10.1073/pnas.2400023123\",\"pmid\":\"42372155\",\"category\":\"zoology\"},{\"title\":\"Neural tissues and chondrostean traits in a Carboniferous actinopterygian.\",\"title_cn\":\"石炭纪辐鳍鱼中的神经组织和软骨硬鳞鱼特征。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Caron AM, Tietjen K, Coates MI\",\"abstract\":\"Ray-finned fishes (Actinopterygii) represent over half of extant vertebrate species, but their early evolutionary history is largely unresolved. Current phylogenetic estimates, corroborated by discoveries of preserved neural tissues, place most Palaeozoic actinopterygians outside the crown group and leave the deep roots of major extant divisions depauperate. Moreover, apparent fossil brains in early fishes are minuscule relative to endocranial chamber space, implying that endocasts are poor indi\",\"doi\":\"10.1073/pnas.2610438123\",\"url\":\"https://doi.org/10.1073/pnas.2610438123\",\"pmid\":\"42372151\",\"category\":\"zoology\"},{\"title\":\"A general framework for predicting the ecological effects of range expansions in marine systems.\",\"title_cn\":\"预测海洋系统中范围扩张生态效应的通用框架。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Beshai RA, Sorte CJB\",\"abstract\":\"Warming global temperatures are driving species to shift beyond their historical geographic ranges into novel, expanded ranges, where they may have both positive and negative effects on recipient populations. Although no framework currently exists to anticipate these effects, invasion biology theory suggests expanders' effects may be predictable from expanders' historical roles and trophic positions. We conducted a global synthesis of over 1,200 population-level effects of marine range-expanding\",\"doi\":\"10.1073/pnas.2600491123\",\"url\":\"https://doi.org/10.1073/pnas.2600491123\",\"pmid\":\"42372141\",\"category\":\"ecology\"},{\"title\":\"Unique fingerprint of marine ectotherm body size change during hyperthermal crises.\",\"title_cn\":\"海洋变温动物体型在高热危机期间变化的独特指纹。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Nätscher PS, De Baets K, Kiessling W\",\"abstract\":\"The term \\\"Lilliput Effect\\\" describes a substantial decrease in the average body size of fossil assemblages during major environmental perturbations in Earth's history, which is reported in many paleontological studies. The limited regional, temporal and taxonomic focus of most studies, however, has sparked discussions concerning its generality. Additionally, even though a negative relationship between warming and body size has been established in recent marine ectotherms, the environmental and m\",\"doi\":\"10.1073/pnas.2505564123\",\"url\":\"https://doi.org/10.1073/pnas.2505564123\",\"pmid\":\"42335231\",\"category\":\"paleontology\"},{\"title\":\"Physiology is a hidden dimension of diversity in the radiation of woodland salamanders.\",\"title_cn\":\"生理学是林地蝾螈辐射分化中一个隐藏的多样性维度。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Alomar NM, Camarillo H, Burress ED et al.\",\"abstract\":\"Morphological evolution can be explosive, producing visually spectacular adaptive radiations like Caribbean anoles, Malagasy vangas, and African Rift Lake cichlids. Yet morphological stasis, the long-term retention of a conserved body plan, is often observed across evolutionary radiations. Woodland salamanders (\",\"doi\":\"10.1073/pnas.2523895123\",\"url\":\"https://doi.org/10.1073/pnas.2523895123\",\"pmid\":\"42330273\",\"category\":\"evolution\"},{\"title\":\"Horseshoe bats foraging in the wild adjust sensing to separate prey echoes from background clutter.\",\"title_cn\":\"野生菊头蝠在觅食时调整感知以将猎物回声与背景杂波分离。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Yovel Y, Stidsholt L, Mimran Y et al.\",\"abstract\":\"How animals handle immense incoming sensory information and regulate sensing is difficult to study under natural conditions. Using miniature GPS tags with microphones we monitored the sensing of freely foraging greater horseshoe bats. Bats stayed in acoustic contact with the environment and caught insects while commuting and in short flights from a perch. Bats adjusted their call frequency to maintain the highest-frequency echoes from background in a forward-directed, spatially limited sector at\",\"doi\":\"10.1073/pnas.2525520123\",\"url\":\"https://doi.org/10.1073/pnas.2525520123\",\"pmid\":\"42330269\",\"category\":\"zoology\"},{\"title\":\"Allopatric coevolution: Migratory predators may facilitate mimicry between geographically nonoverlapping species.\",\"title_cn\":\"异域共演化：迁徙捕食者可能促进地理上不重叠物种之间的拟态。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Topper A, Ben-Oren Y, Kolodny O\",\"abstract\":\"A natural assumption in evolutionary biology is that to coevolve, species must interact with each other and should therefore co-occur. However, many evolutionary dynamics may be mediated by migratory or vector-borne agents, raising the possibility of coevolutionary interactions between allopatric species. In mimicry theory, a recurring assumption is that all species participating in a mimicry system must be sympatric, because predators must encounter both model and mimic/co-mimic to confuse betw\",\"doi\":\"10.1073/pnas.2527304123\",\"url\":\"https://doi.org/10.1073/pnas.2527304123\",\"pmid\":\"42313983\",\"category\":\"zoology\"},{\"title\":\"Dark diversity framework reconciles Darwin's naturalization conundrum for freshwater fish invasions.\",\"title_cn\":\"暗多样性框架调和了达尔文归化难题在淡水鱼类入侵中的应用。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Zhang WG, Xu M, Fan SY et al.\",\"abstract\":\"The spread of invasive species poses a major threat to global biodiversity, yet predicting successful establishment of exotic species in novel environments remains challenging. Darwin's naturalization conundrum is a longstanding debate over whether exotic species closely or distantly related to native communities are more likely to succeed. Despite its long history, empirical studies continue to yield conflicting evidence. Here, we introduce the dark diversity concept, which refers to species th\",\"doi\":\"10.1073/pnas.2604929123\",\"url\":\"https://doi.org/10.1073/pnas.2604929123\",\"pmid\":\"42268899\",\"category\":\"conservation\"},{\"title\":\"Integrating trophic importance into conservation of terrestrial vertebrates.\",\"title_cn\":\"将营养重要性纳入陆生脊椎动物的保护中。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Hao X, Holyoak M, Zhang Z et al.\",\"abstract\":\"There is global consensus on the need to prioritize conservation efforts to prevent biodiversity loss and defaunation. Most current conservation initiatives focus on areas with high species diversity or many threatened species, treating species independently and neglecting trophic interactions. To address these oversights, we developed a framework to quantify species' roles along continuums of trophic importance (TI) and global endangerment (GE), estimated from a global terrestrial meta-food web\",\"doi\":\"10.1073/pnas.2605237123\",\"url\":\"https://doi.org/10.1073/pnas.2605237123\",\"pmid\":\"42263132\",\"category\":\"zoology\"},{\"title\":\"Memory, chaos, and noise in ecological forecasting.\",\"title_cn\":\"生态预测中的记忆、混沌与噪声。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-09\",\"authors\":\"Munch SB, Rogers TL\",\"abstract\":\"Ecological populations fluctuate for reasons that are often ascribed-separately-to historical legacies, intrinsic nonlinear dynamics, or stochastic noise. Yet these forces rarely act in isolation. We assembled a global database of 302 abundance time series spanning birds, mammals, fishes, insects, and plankton to ask how memory, nonlinearity, and dynamical stability interact to shape predictability. We used empirical dynamic modeling to estimate the memory length and classified time series stabi\",\"doi\":\"10.1073/pnas.2604256123\",\"url\":\"https://doi.org/10.1073/pnas.2604256123\",\"pmid\":\"42224580\",\"category\":\"zoology\"},{\"title\":\"Female dolphins use individual vocal labels to track coercive males.\",\"title_cn\":\"雌性海豚使用个体声音标签来追踪胁迫性雄性。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Bouchard A, Allen SJ, Sørensen PM et al.\",\"abstract\":\"Animals rely on identity signaling to navigate social relationships, assess potential mates, and avoid costly interactions. While species- and group-level recognition signals can provide fitness advantages by preventing inbreeding depression and hybridization, our understanding of the role that individual identity signals can play in mate choice is notably lacking. In species with coercive mating systems, females must carefully evaluate male behavior to minimize risks while also maximizing repro\",\"doi\":\"10.1073/pnas.2531602123\",\"url\":\"https://doi.org/10.1073/pnas.2531602123\",\"pmid\":\"42224502\",\"category\":\"zoology\"},{\"title\":\"Arctic ecosystems shaped mammalian dispersal and diversification before the Cretaceous-Paleogene mass extinction.\",\"title_cn\":\"北极生态系统在白垩纪-古近纪大灭绝前塑造了哺乳动物的扩散与多样化。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-02\",\"authors\":\"Shelley SL, Eberle JJ, Erickson GM et al.\",\"abstract\":\"High-latitude terrestrial ecosystems are commonly viewed as marginal environments to deep-time evolutionary innovation, yet their role in shaping biotic dispersal, diversification, and survivorship remains poorly understood. The Upper Cretaceous Prince Creek Formation of northern Alaska (paleolatitude ~80-85°N) yields the most northerly known Mesozoic mammals and provides a rare opportunity to examine the ecological and biogeographic roles of polar terrestrial ecosystems. Here, we describe three\",\"doi\":\"10.1073/pnas.2601794123\",\"url\":\"https://doi.org/10.1073/pnas.2601794123\",\"pmid\":\"42150091\",\"category\":\"zoology\"},{\"title\":\"Language-like statistical structure arises in learned signaling: evidence from birdsong.\",\"title_cn\":\"语言类统计结构在学习信号中出现：来自鸟类鸣叫的证据。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-08-07\",\"authors\":\"Kirby S, Okanoya K, Garland EC et al.\",\"abstract\":\"All languages have statistically coherent subsequences (e.g., words) whose frequency distribution follows a power law. These properties facilitate language learning in humans, making them good candidates for arising through cultural transmission as a way to help faithful transmission across generations. Recently, both properties were found in whale song, which is also culturally transmitted, leading to the strong prediction that they should be found wherever complex sequential signaling is cultu\",\"doi\":\"10.1126/sciadv.aea3015\",\"url\":\"https://doi.org/10.1126/sciadv.aea3015\",\"pmid\":\"42566530\",\"category\":\"zoology\"},{\"title\":\"Global patterns and drivers of extinction risk in island endemic terrestrial vertebrates.\",\"title_cn\":\"岛屿特有陆生脊椎动物灭绝风险的全球格局与驱动因素\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-08-07\",\"authors\":\"Zhang Y, Wang J, Li Y et al.\",\"abstract\":\"Island endemic terrestrial vertebrates, shaped by long-term isolation and ecological specialization, are particularly vulnerable to extinction pressure in the Anthropocene. However, cross-taxon extinction patterns and their drivers remain poorly understood. Here, we compiled a global dataset of 31,865 terrestrial vertebrates, including more than 7500 island endemic species, to evaluate the patterns and drivers of extinction risk in island endemics, in comparison with continent endemics and dual-\",\"doi\":\"10.1126/sciadv.aef9781\",\"url\":\"https://doi.org/10.1126/sciadv.aef9781\",\"pmid\":\"42555717\",\"category\":\"zoology\"},{\"title\":\"Highly aquatic marine stem archosaur with soft tissue preservation.\",\"title_cn\":\"保存有软组织的极度水生海洋干群主龙类\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-31\",\"authors\":\"Wang W, Fraser NC, Spiekman SNF et al.\",\"abstract\":\"Archosauromorpha is a dominant reptile clade that primarily occupied terrestrial ecosystems with limited secondarily aquatic invasions that are poorly known. Here we report on a well-preserved Triassic reptile representing the earliest stem-archosaur to evolve unequivocal aquatic specializations. This taxon exhibits a suite of aquatic adaptations previously unknown in stem-archosaurs, such as hyperphalangy, enhanced paddle-like forelimbs, and a loss of articulation between the sacrum and pelvis,\",\"doi\":\"10.1126/sciadv.aeb7528\",\"url\":\"https://doi.org/10.1126/sciadv.aeb7528\",\"pmid\":\"42525755\",\"category\":\"ecology\"},{\"title\":\"Immunoglobulin heavy chain locus duplication in bats.\",\"title_cn\":\"蝙蝠免疫球蛋白重链基因座的重复。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-31\",\"authors\":\"Pursell T, Reers A, Mikelov A et al.\",\"abstract\":\"Bats are major reservoirs of viruses that can be transmitted to humans in zoonotic outbreaks. Antibody-mediated immunity plays an important role in shaping viral evolution and immune evasion but remains understudied in bats. All known mammals have a single immunoglobulin heavy chain (IgH) gene locus and up to two light chain loci. We have identified dual IgH loci on separate chromosomes in 26 bat species, highlighting extreme variation of immunogenetic architecture in order Chiroptera. In a mode\",\"doi\":\"10.1126/sciadv.aeb6714\",\"url\":\"https://doi.org/10.1126/sciadv.aeb6714\",\"pmid\":\"42525754\",\"category\":\"zoology\"},{\"title\":\"Genomic structural variation rescues a classic biological invader from a population bottleneck.\",\"title_cn\":\"基因组结构变异使典型生物入侵者摆脱种群瓶颈。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Osborne CA, Foote BM, Fleck SJ et al.\",\"abstract\":\"Invasion genetics presents a classic paradox: How do species successfully spread despite severe population bottlenecks? The brown treesnake (\",\"doi\":\"10.1126/sciadv.aed3656\",\"url\":\"https://doi.org/10.1126/sciadv.aed3656\",\"pmid\":\"42497265\",\"category\":\"ecology\"},{\"title\":\"Emergent patterns of island biodiversity in the Anthropocene.\",\"title_cn\":\"人类世岛屿生物多样性的涌现模式。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Matthews TJ, Sayol F, Soares FC et al.\",\"abstract\":\"Islands have long been foundational to the development of ecological and evolutionary theory, serving as model systems for studying patterns of biodiversity. However, pervasive anthropogenic impacts-particularly species extinctions and introductions-have substantially altered island ecosystems, complicating inferences drawn from contemporary data. Here, we review how these human-driven changes have reshaped key biodiversity patterns on islands, including patterns of species richness, community c\",\"doi\":\"10.1126/sciadv.aee1788\",\"url\":\"https://doi.org/10.1126/sciadv.aee1788\",\"pmid\":\"42490450\",\"category\":\"ecology\"},{\"title\":\"The legacy of privilege: Social inheritance reverses sex differences in reproductive inequality in the spotted hyena.\",\"title_cn\":\"特权的遗产：社会继承逆转了斑鬣狗繁殖不平等中的性别差异。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Mosna M, Courtiol A, Naman P et al.\",\"abstract\":\"Inequalities in reproductive success among females and males shape natural and sexual selection. For sexually reproducing species, the Darwin-Bateman paradigm predicts greater reproductive inequality in males than females. A mechanism driving reproductive inequality in humans and other animals is social inheritance of privilege. Here, we show that this mechanism can reverse the male bias in reproductive inequality. Using a 29-year dataset spanning eight generations of spotted hyenas (\",\"doi\":\"10.1126/sciadv.aee7880\",\"url\":\"https://doi.org/10.1126/sciadv.aee7880\",\"pmid\":\"42490420\",\"category\":\"zoology\"},{\"title\":\"Predictors of extinction risk in large tropical forest mammals: From global to local.\",\"title_cn\":\"大型热带森林哺乳动物灭绝风险的预测因子：从全球到局部\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-17\",\"authors\":\"Schowanek SD, Sheil D, Beaudrot L et al.\",\"abstract\":\"Studies can only guide conservation if their findings are informative at the scales at which practitioners and policy-makers operate. Yet, it is rarely tested whether large-scale studies reach similar conclusions to the smaller-scale studies on which conservation traditionally relies. We examine whether predictors of extinction risk are consistent across global, regional, and local scales, for 210 tropical forest mammal species (≥1 kg) that existed during the last 130,000 years, in 64 tropical f\",\"doi\":\"10.1126/sciadv.aeb7543\",\"url\":\"https://doi.org/10.1126/sciadv.aeb7543\",\"pmid\":\"42455935\",\"category\":\"zoology\"},{\"title\":\"Dexterous single sniffs for ethological active olfaction.\",\"title_cn\":\"灵巧单嗅探用于行为学主动嗅觉。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Gao M, Barrett JM, Fischer R et al.\",\"abstract\":\"Rhythmic sniffing is considered intrinsic to active olfaction among terrestrial mammals. However, mice are known to briefly hold food under their nares while feeding, suggesting coordination of oromanual dexterity, breathing, and olfaction for nonrhythmic single sniffs. Here, we recorded kinematics and breathing as mice foraged and fed, finding that mice indeed, with clockwork-like dexterity and millisecond timing, synchronize a single inspiration with rapid head and hand movements. These solita\",\"doi\":\"10.1126/sciadv.aed3610\",\"url\":\"https://doi.org/10.1126/sciadv.aed3610\",\"pmid\":\"42397911\",\"category\":\"zoology\"},{\"title\":\"Hemisphere-wide evidence of Early Paleoindian megaherbivore specialization.\",\"title_cn\":\"半球范围内早期古印第安人对巨型食草动物专食化的证据。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Potter BA, Chatters JC, Prates L et al.\",\"abstract\":\"The adaptive strategies of Early Paleoindians associated with the rapid and continent-wide expansions of Clovis and related Fishtail Projectile Point (FPP) complexes in the Americas have been subject to differing interpretations. Were Early Paleoindians megafauna specialists or dietary generalists? These alternative models offer profoundly different implications for Early Paleoindian prey choice, mobility, and technology. We synthesize and evaluate the zooarchaeological records of the earliest w\",\"doi\":\"10.1126/sciadv.aef9628\",\"url\":\"https://doi.org/10.1126/sciadv.aef9628\",\"pmid\":\"42384804\",\"category\":\"zoology\"},{\"title\":\"Jurassic avialan reveals stepwise evolution of bony tail in birds.\",\"title_cn\":\"侏罗纪鸟类揭示了鸟类骨尾的逐步演化。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Wang M, Tang J, Deng K et al.\",\"abstract\":\"The evolutionary assembly of the flight-adapted bird body plan encompasses some of the most profound morphological changes in terrestrial vertebrate history. Beyond feathered wings, the short pygostyle-bearing tail has been pivotal to the clade's ecological success. However, transition from the long bony tail to the short pygostyle-bearing tail remains a mystery, hindered by the scarcity of early branching avialans with transitional morphologies. Here, we report on a new avialan,\",\"doi\":\"10.1126/sciadv.aeb5202\",\"url\":\"https://doi.org/10.1126/sciadv.aeb5202\",\"pmid\":\"42384792\",\"category\":\"zoology\"},{\"title\":\"Records of compass heading for long-distance ocean migrators show mid-ocean reorientation.\",\"title_cn\":\"远洋长距离迁徙者罗盘航向记录显示洋中重新定向。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-26\",\"authors\":\"Hays GC, Stokes KL, Cerritelli G et al.\",\"abstract\":\"The mechanisms by which animals navigate during long ocean migrations to specific targets remain equivocal despite over a century of investigation. To address this question, we developed and deployed a new tag that allowed the compass heading of migrators to be remotely relayed via satellite. On transocean migrations (\\u003e1000 kilometers and mean duration 27.5 days) between nesting and foraging sites, green turtles (\",\"doi\":\"10.1126/sciadv.aed8113\",\"url\":\"https://doi.org/10.1126/sciadv.aed8113\",\"pmid\":\"42341127\",\"category\":\"zoology\"},{\"title\":\"The wisdom of crowds emerges in flocks of thousands of migrating songbirds.\",\"title_cn\":\"群体智慧涌现于数千只迁徙鸣禽的鸟群之中。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-26\",\"authors\":\"Morford J, Lewin PJ, Wynn J et al.\",\"abstract\":\"While enhanced decision-making in larger groups, known as the wisdom of crowds, has been demonstrated in controlled experimental conditions, the intractability of observing large-scale wild groups has limited the availability of evidence from natural systems. Addressing this challenge, we analyze migratory trajectories of flocks of thousands of wild songbirds extracted from 23 years of weather radar data across the Great Lakes of North America. We show that the wisdom of crowds emerged: Larger f\",\"doi\":\"10.1126/sciadv.aef3512\",\"url\":\"https://doi.org/10.1126/sciadv.aef3512\",\"pmid\":\"42341115\",\"category\":\"zoology\"},{\"title\":\"Extreme weather effects on marine predator breeding outcomes in a global climate change hotspot.\",\"title_cn\":\"极端天气对全球气候变化热点地区海洋捕食者繁殖结果的影响。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-19\",\"authors\":\"Sojitra M, Corney S, Hemer M et al.\",\"abstract\":\"Extreme weather events (EWEs) are increasing in both intensity and frequency globally. For long-lived, slow-reproducing marine predators, repeated or sequential EWE-driven breeding failures can have population-level consequences. We quantified effects of EWEs on reproductive output and identified temporal windows of vulnerability during breeding in three sentinel species across 14 colonies with varying population trajectories in Tasmania, Australia. Using long-term breeding datasets and daily we\",\"doi\":\"10.1126/sciadv.aea3220\",\"url\":\"https://doi.org/10.1126/sciadv.aea3220\",\"pmid\":\"42319917\",\"category\":\"zoology\"},{\"title\":\"Global impacts of drifting fish aggregating devices on marine protected areas.\",\"title_cn\":\"漂流式集鱼装置对海洋保护区的全球影响。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-19\",\"authors\":\"Schiller L, Villaseñor-Derbez JC, Lynham J et al.\",\"abstract\":\"Protected areas are a critical component of efforts to reverse biodiversity loss by 2050. In the ocean, free-drifting fish aggregating devices (dFADs) are released in large numbers by industrial purse seine fishing companies to help catch tuna. These devices can enter marine protected areas (MPAs) undetected, potentially leading to wildlife entanglement, plastic pollution, and habitat degradation. Here we investigate processes by which dFADs may compromise MPA objectives and assess the burden th\",\"doi\":\"10.1126/sciadv.aee6998\",\"url\":\"https://doi.org/10.1126/sciadv.aee6998\",\"pmid\":\"42308291\",\"category\":\"zoology\"},{\"title\":\"Evolution of a ZW sex determination system in sticklebacks.\",\"title_cn\":\"刺鱼中ZW性别决定系统的演化。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"Cheng X, Zou M, Wang Y et al.\",\"abstract\":\"The stickleback system offers a powerful model for investigating the evolutionary dynamics of sex chromosome differentiation. Although a ZW sex determination mechanism has previously been reported in sticklebacks, its origin and evolutionary history remain poorly resolved. Here, integrated multiomics analyses were applied to elucidate the evolutionary trajectory of the ZW system in\",\"doi\":\"10.1126/sciadv.aeb1484\",\"url\":\"https://doi.org/10.1126/sciadv.aeb1484\",\"pmid\":\"42247502\",\"category\":\"evolution\"},{\"title\":\"Rise of modern marine fishes captured in an early Paleocene Lagerstätte.\",\"title_cn\":\"现代海洋鱼类的崛起记录于古新世早期的化石库中。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"El-Sayed S, Friedman M, Salem BS et al.\",\"abstract\":\"The Cretaceous-Paleogene (K-Pg) extinction reshaped Earth's biodiversity, yet its impact on marine fishes remains debated due to gaps in the Paleocene record. Here, we report a paleotropical assemblage from the early Paleocene (Danian) of Egypt that provides a window into this transition. The Qreiya 3 Lagerstätte [62.2 million years ago (Ma)] reveals an offshore marine ecosystem with at least 21 actinopterygian taxa across nine orders, exceeding the diversity of all other Danian skeletal assembl\",\"doi\":\"10.1126/sciadv.aec8978\",\"url\":\"https://doi.org/10.1126/sciadv.aec8978\",\"pmid\":\"42234753\",\"category\":\"ecology\"},{\"title\":\"Transposons drove the evolution of a male sex-determining gene from a female gene with deep introgression across cichlids.\",\"title_cn\":\"转座子驱动了丽鱼科鱼类中一个雄性性别决定基因从雌性基因的演化，并伴随深度的种间渐渗。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-06-05\",\"authors\":\"Wang L, Sun F, Yang Z et al.\",\"abstract\":\"Sex-determination mechanisms and their master regulators are diverse among vertebrates. Components of downstream regulatory pathways can sometimes be co-opted as new upstream triggers. Here, we report a notable finding of cross-pathway recruitment: A gene from the female differentiation cascade was repurposed as a male master sex-determining (MSD) gene. We identify\",\"doi\":\"10.1126/sciadv.aed6242\",\"url\":\"https://doi.org/10.1126/sciadv.aed6242\",\"pmid\":\"42234737\",\"category\":\"zoology\"},{\"title\":\"SARS-CoV-2 Delta variant re-emerges in US farmed mink and free-ranging white-tailed deer in 2022-2023.\",\"title_cn\":\"2022-2023年SARS-CoV-2德尔塔变异株在美国养殖水貂和自由放养白尾鹿中重新出现。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-07-09\",\"authors\":\"Crespo-Bellido A, Owsiany MC, Chillson NN et al.\",\"abstract\":\"American mink (Neogale vison) are susceptible to SARS-CoV-2, but little is known about virus circulation in mink since 2021. Here, in the first active surveillance study of SARS-CoV-2 in apparently healthy farmed mink in the United States, we find a ~0.9% (760/85,656) RT-PCR positivity rate among nasal swabs collected in 18 farms across six states during 2022-2023. Phylogenetic analysis of 293 viral genome sequences shows that human-adapted SARS-CoV-2 variants (e.g., Omicron) repeatedly spill ov\",\"doi\":\"10.1038/s41467-026-75363-4\",\"url\":\"https://doi.org/10.1038/s41467-026-75363-4\",\"pmid\":\"42425991\",\"category\":\"genetics\"},{\"title\":\"Global inequality in roadkill burden concentrates collision risk on threatened species in low- and middle-income countries.\",\"title_cn\":\"全球道路致死负担的不平等性使碰撞风险集中于中低收入国家的受威胁物种。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-07-01\",\"authors\":\"Li Y, Zhao Z, Chen X et al.\",\"abstract\":\"Global development relies on vast and expanding road networks, yet the global distribution of the wildlife mortality they cause remains poorly quantified. Here we show, using researcher-led surveys, global citizen-science records and a high-resolution national dataset for China, that wildlife-vehicle collisions disproportionately burden biodiversity in low- and middle-income countries. After standardising for species pools and sampling effort, low- and middle-income countries bear a heavier road\",\"doi\":\"10.1038/s41467-026-74963-4\",\"url\":\"https://doi.org/10.1038/s41467-026-74963-4\",\"pmid\":\"42386729\",\"category\":\"zoology\"},{\"title\":\"FRAME: Fine-Resolution Asymmetric Migration Estimation.\",\"title_cn\":\"FRAME：精细分辨率非对称迁移估计\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Shen H, Novembre J\",\"abstract\":\"The genetic structure of populations is often shaped by processes and events that introduce asymmetries to gene flow between geographic locations. Here, we first develop an algorithm that allows efficient computation of pairwise coalescent times in time-homogeneous models of population structure at migration-drift equilibrium. We then use the algorithm as the foundation for a new method-Fine-Resolution Asymmetric Migration Estimation (FRAME)-to infer asymmetric migration rates in spatial models \",\"doi\":\"10.1038/s41467-026-74129-2\",\"url\":\"https://doi.org/10.1038/s41467-026-74129-2\",\"pmid\":\"42337232\",\"category\":\"zoology\"},{\"title\":\"Linking species local trends from assemblage monitoring to global extinction risk.\",\"title_cn\":\"将物种集合监测中的局部趋势与全球灭绝风险联系起来。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Antão LH, Moyes F, Dornelas M et al.\",\"abstract\":\"While biodiversity is being reshaped across the globe, extinction risk assessments are lacking for most species, and a major challenge remains in understanding whether global threat status aligns with local population trends. Here, we assess whether population temporal prevalence trends are consistent with a species' global extinction risk, using over 60,000 populations of 2362 species across 978 marine and terrestrial assemblages (sampled for at least 20 years, mostly from temperate regions). W\",\"doi\":\"10.1038/s41467-026-74132-7\",\"url\":\"https://doi.org/10.1038/s41467-026-74132-7\",\"pmid\":\"42337229\",\"category\":\"ecology\"},{\"title\":\"Migratory jackpot individuals fuel rapid ecotype shifts in Galaxias fishes.\",\"title_cn\":\"洄游“大奖”个体推动加拉西亚鱼快速生态型转变。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-23\",\"authors\":\"Iwikau A, Augspurger J, Bailie MA et al.\",\"abstract\":\"Adaptation is considered essential for species facing environmental change, but our understanding of the evolution of complex ecotypes remains limited. We show that a substantial genomic cluster of co-adapted alleles has repeatedly fuelled complex life-history shifts in fishes. Specifically, the majority of strong outlier loci underpinning repeated landlocking of formerly marine-migratory Galaxias lineages are co-located on a single chromosome. Phenotypic, behavioural and genomic comparisons rev\",\"doi\":\"10.1038/s41467-026-74946-5\",\"url\":\"https://doi.org/10.1038/s41467-026-74946-5\",\"pmid\":\"42336867\",\"category\":\"zoology\"},{\"title\":\"Ground squirrel coprolites preserve complex archives of ancient environmental DNA over 700,000 years.\",\"title_cn\":\"地松鼠粪化石保存了超过70万年的复杂古环境DNA档案。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-09\",\"authors\":\"Murchie TJ, Cocker SL, Baleka S et al.\",\"abstract\":\"Permafrost-preserved ground squirrel (Urocitellus) burrows in Yukon, Canada contain coprolites (palaeofaeces) that span from the Holocene to at least the Middle Pleistocene (~700 kya). Using shotgun metagenomics and targeted enrichment, we recover a rich, multi-taxon spectrum of ancient environmental DNA from these pellets, including: plants, insects, microbes, and megafauna consistent with eastern Beringian ecosystems. These coprolites consistently preserve an abundance of eukaryotic DNA, enabl\",\"doi\":\"10.1038/s41467-026-72977-6\",\"url\":\"https://doi.org/10.1038/s41467-026-72977-6\",\"pmid\":\"42265123\",\"category\":\"zoology\"},{\"title\":\"A pegivirus associated with encephalitis in red-legged partridges shows neurotropism across avian species.\",\"title_cn\":\"一种与红腿鹧鸪脑炎相关的佩吉病毒在禽类物种间表现出嗜神经性。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-05\",\"authors\":\"Matos M, Bilic I, Viloux N et al.\",\"abstract\":\"Pegiviruses are generally regarded as non-pathogenic viruses with controversial clinical significance. Here, we describe an avian pegivirus (partridge pegivirus, ParPgV) associated with field outbreaks of encephalitis in red-legged partridges (Alectoris rufa). Next-generation sequencing identified ParPgV in brain tissues, revealing two distinct avian-origin pegiviruses. Histopathology and electron microscopy revealed encephalitic lesions, neuronal degeneration, and viral particles within neurons\",\"doi\":\"10.1038/s41467-026-73858-8\",\"url\":\"https://doi.org/10.1038/s41467-026-73858-8\",\"pmid\":\"42248885\",\"category\":\"zoology\"},{\"title\":\"Quantification of molar sub-regions suggests increasing herbivory during primate origins.\",\"title_cn\":\"臼齿亚区域量化表明灵长类起源期间食草性增强。\",\"title_cn_summary\":\"\",\"journal\":\"Nat Commun\",\"date\":\"2026-06-05\",\"authors\":\"Bradley-Cronkwright M, Anaya A, Fulwood EL et al.\",\"abstract\":\"We investigated patterns of evolutionary changes to primate molar morphology, focused on the front-most (mesial) region. Methodological constraints have prevented objectively quantifying anatomical sub-regions to conduct tests of the evolutionary processes that shaped them. Previously, sub-regions across a dental surface were qualitatively scored or subjectively described. We overcame this methodological constraint with Hecate, an algorithm incorporating computer vision and machine learning. Hec\",\"doi\":\"10.1038/s41467-026-73688-8\",\"url\":\"https://doi.org/10.1038/s41467-026-73688-8\",\"pmid\":\"42248848\",\"category\":\"evolution\"},{\"title\":\"Multiple modes of selection underlie repeated and human-mediated adaptation in a formerly migratory fish.\",\"title_cn\":\"多种选择模式共同驱动一种曾迁徙鱼类的重复性及人为介导的适应性进化。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Corcoran RM, Schultz ET, Velotta JP\",\"abstract\":\"The extent to which we can predict evolution is crucial in our era of rapid anthropogenic change. Alewives (Alosa pseudoharengus) in the Atlantic coastal USA are a unique model to test for evolutionary predictability in an anthropogenic context, as multiple, formerly anadromous (migratory from ocean to freshwater) populations have been independently restricted to freshwater (landlocked) by dams built in the last 350 years. Landlocked alewives show parallel changes in life history, feeding morpho\",\"doi\":\"10.1093/molbev/msag149\",\"url\":\"https://doi.org/10.1093/molbev/msag149\",\"pmid\":\"42295111\",\"category\":\"zoology\"},{\"title\":\"Adaptive evolution of endothelial nitric oxide synthase (NOS3) may reduce cetacean susceptibility to decompression sickness.\",\"title_cn\":\"内皮型一氧化氮合酶（NOS3）的适应性进化可能降低鲸类对减压病的易感性。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Tian R, Zhao L, Li T et al.\",\"abstract\":\"Cetaceans tolerate repeated diving bouts. While the extent to which cetaceans experience decompression sickness remains debated, this group of fully aquatic mammals must have evolved a tolerance to damaging nitrogen (N2) gas bubbles that can form during overly rapid ascents or after prolonged dives. Here, we present the first in-depth molecular evolutionary analysis of the nitric oxide synthase gene family across cetaceans and identify cetacean-specific amino acid substituti
