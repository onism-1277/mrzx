</style></head><body data-astro-cid-5vqnc7pn><div class="container" data-astro-cid-5vqnc7pn><h1 data-astro-cid-5vqnc7pn>📋 论文标注审查</h1><p class="progress" id="progress" data-astro-cid-5vqnc7pn>加载中...</p><div id="paperCard" class="card" style="display:none;" data-astro-cid-5vqnc7pn><div class="title" id="paperTitle" data-astro-cid-5vqnc7pn></div><div class="title-cn" id="paperTitleCn" data-astro-cid-5vqnc7pn></div><div class="meta" id="paperMeta" data-astro-cid-5vqnc7pn></div><div class="abstract" id="paperAbstract" data-astro-cid-5vqnc7pn></div><div class="buttons" data-astro-cid-5vqnc7pn><button class="btn yes" onclick="annotate(true)" data-astro-cid-5vqnc7pn>✅ 相关</button><button class="btn no" onclick="annotate(false)" data-astro-cid-5vqnc7pn>❌ 不相关</button></div></div><div id="doneMessage" class="done" style="display:none;" data-astro-cid-5vqnc7pn><p data-astro-cid-5vqnc7pn>🎉 全部标注完成！</p><button class="btn export" onclick="exportResults()" data-astro-cid-5vqnc7pn>📥 导出标注结果</button><button class="btn reset" onclick="resetAll()" data-astro-cid-5vqnc7pn>🔄 重新开始</button><button class="btn back" onclick="goBack()" data-astro-cid-5vqnc7pn>↩️ 返回上一篇</button></div></div><script>(function(){const papersJson = "[{\"title\":\"浙江省爬行类新纪录——崇安斜鳞蛇\",\"title_cn\":\"浙江省爬行类新纪录——崇安斜鳞蛇\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过形态比对与基于Cyt b的系统发育分析，在2025年8月于浙江省庆元县采集的1号游蛇科雄性标本基础上，确认该标本为崇安斜鳞蛇，获得浙江省爬行动物分布新记录种的相应研究进展，为丰富浙江省爬行动物多样性本底资料及拓展该物种在华东地区的分布范围提供了相关价值。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2025年8月，在浙江省庆元县采集到1号游蛇科（Colubridae）雄性标本。经形态比对，该标本与崇安斜鳞蛇（Pseudoxenodon karlschmidti）原始描述基本一致；基于Cyt b的系统发育分析显示，该标本与GenBank数据库中登记的崇安斜鳞蛇序列聚为一支（支持率为100%），种内遗传距离为6.23%，而与同属其他物种种间遗传距离均超过10.00%。综合形态与分子证据，确认该标本为崇安斜鳞蛇，此为浙江省爬行动物分布新记录种。此次发现丰富了浙江省爬行动物多样性本底资料，并拓展了该物种在华东地区的分布范围。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=163156494\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-浙江省爬行类新纪录——崇安斜鳞蛇\",\"category\":\"zoology\"},{\"title\":\"重庆首次记录宁陕脊蛇并描述一新亚种\",\"title_cn\":\"重庆首次记录宁陕脊蛇并描述一新亚种\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过形态比较和基于线粒体COI基因的分子系统发育分析，在重庆阴条岭国家级自然保护区和巫山县当阳乡采集的3号脊蛇属标本基础上，首次记录宁陕脊蛇，并鉴定其中2号标本为新亚种宁陕脊蛇重庆亚种，另1号标本为指名亚种，为重庆市爬行动物多样性提供了新资料。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2025年5—7月，在重庆阴条岭国家级自然保护区和巫山县当阳乡共采集到3号脊蛇属（Achalinus）标本，经形态比较和基于线粒体COI基因的分子系统发育分析，鉴定其为宁陕脊蛇（A.ningshanensis），是该物种在重庆市的新纪录。其中，2号标本（SWU 0015230、SWU 0015643）在形态上以颔片2对区别于指名亚种（A.n.ningshanensis），以雄性腹鳞169枚、雄性尾下鳞52枚和雌性尾下鳞48枚区别于华西亚种（A.n.occidentalis），并在系统发育树中独立成支，与指名亚种、华西亚种的遗传距离分别为2.37%和4.22%。综合上述证据，将这2号标本定为宁陕脊蛇重庆亚种（Achalinus ningshanensis chongqingensis ssp. nov.）。此外，另1号采自重庆阴条岭国家级自然保护区的标本（SWU 0016884）与指名亚种聚为一支，二者遗传距离仅为0.87%，鉴定该标本为宁陕脊蛇指名亚种。本研究为重庆市爬行动物多样性提供了新资料。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=162737699\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-重庆首次记录宁陕脊蛇并描述一新亚种\",\"category\":\"zoology\"},{\"title\":\"湖南通道发现岜沙掌突蟾\",\"title_cn\":\"湖南通道发现岜沙掌突蟾\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过形态学鉴定与基于线粒体16S rRNA基因序列的系统发育分析，在2024年9月于湖南通道采集的2号角蟾科标本基础上，确认其为岜沙掌突蟾，系湖南省两栖动物分布新记录种，获得了将物种已知分布范围向东北扩展约100 km的相应研究进展，为湖南省两栖动物区系数据提供了补充价值。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"2024年9月，在湖南省怀化市通道侗族自治县万佛山镇上洞村采集到2号角蟾科（Megophryidae）掌突蟾属（Leptobrachella）标本。经形态学鉴定，其形态特征与岜沙掌突蟾（L. bashaensis）相符。基于线粒体16S rRNA基因序列构建的系统发育分析表明，该标本与来自模式产地（贵州从江）的岜沙掌突蟾聚为一支；二者基于Kimura双参数模型计算的遗传距离为1.9%，远低于掌突蟾属的种间遗传距离平均值（10.3%）。综合形态学特征与分子系统发育分析结果，确认该标本为岜沙掌突蟾，系湖南省两栖动物分布新记录种。此项发现不仅丰富了湖南省两栖动物区系数据，也将该物种的已知分布范围向东北扩展了约100 km。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=147938736\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-湖南通道发现岜沙掌突蟾\",\"category\":\"zoology\"},{\"title\":\"中蹄蝠和大足鼠耳蝠斑驳白化现象\",\"title_cn\":\"中蹄蝠和大足鼠耳蝠斑驳白化现象\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过野外调查与形态声学测量，在2025年于云南和江西发现中蹄蝠及大足鼠耳蝠的斑驳白化个体，其中大足鼠耳蝠斑驳白化为国内首次记录。在测量体型与回声定位参数并与正常个体比较的基础上，发现除个别指标外均属正常范围，验证了斑驳白化未显著影响发声能力及体型发育，为斑驳白化蝙蝠生理生态机制研究提供了量化实证依据。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"斑驳白化是一种由黑色素细胞局部迁移或分化异常所致的遗传性色素减退疾病，在蝙蝠中较为罕见。本研究于2025年7月22日在云南省河口瑶族自治县坝洒农场发现2只雄性成体斑驳白化中蹄蝠（Hipposideros larvatus），一只（YNHK-2025-001）斑驳区域位于左侧翼膜下方，另一只（YNHK-2025-002）则累及大部分翼膜、尾膜、左右胫骨、左右后足及尾骨；于2025年8月24日在江西省广丰区排山镇发现1只雌性成体斑驳白化大足鼠耳蝠（Myotis pilosus），其斑驳区域位于背颈部一侧，面积较小。大足鼠耳蝠斑驳白化现象为国内首次记录。通过测量体质量、前臂长等体型参数及回声定位声波峰频等参数，并与同种正常个体进行比较，结果显示：除1只斑驳白化中蹄蝠的耳宽（YNHK-2025-001）和斑驳白化大足鼠耳蝠的体质量不在正常参考范围外，其余个体的体型和回声定位声波参数均在正常范围内，表明斑驳白化现象未对蝙蝠的发声能力产生显著影响，且未见明显体型发育异常。研究结果可为后续斑驳白化蝙蝠的生理生态机制探究提供量化实证依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=164655963\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-中蹄蝠和大足鼠耳蝠斑驳白化现象\",\"category\":\"zoology\"},{\"title\":\"吉林集安发现斑驳白化马铁菊头蝠\",\"title_cn\":\"吉林集安发现斑驳白化马铁菊头蝠\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队于2022年8月在吉林省集安市发现1只成体雌性斑驳白化马铁菊头蝠，综合形态与声学特征将其鉴定为马铁菊头蝠，此为国内蝙蝠斑驳白化现象的最北分布记录。测量结果显示，该个体除耳长和回声定位脉冲持续时间略高于正常个体外，其余参数均处于正常范围，表明斑驳白化可能未对其生长发育和回声定位能力产生显著负面影响，为后续研究蝙蝠斑驳白化的发生机理及遗传规律提供了基础数据和科学依据。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"斑驳白化是一种遗传性色素失调表型，在翼手目（Chiroptera）动物中报道较为罕见。2022年8月4日，在吉林省通化市集安市榆林镇治安村发现1只成体雌性斑驳白化菊头蝠（Rhinolophus sp.），其斑驳白化区域主要分布于胸部和左腹部，综合形态与声学特征将其鉴定为马铁菊头蝠（R.nippon），此为国内蝙蝠斑驳白化现象的最北分布记录。形态与声学参数测量结果显示，该斑驳白化个体除耳长和回声定位声波脉冲持续时间略高于正常个体外，其余形态和声学参数均处于同种正常范围内，表明斑驳白化可能未对该蝙蝠的生长发育和回声定位能力产生显著负面影响。本次发现不仅丰富了存在斑驳白化现象的蝙蝠物种种类，拓展了蝙蝠白化表型的地理分布范围，更为后续深入开展蝙蝠斑驳白化的发生机理、遗传规律及生态适应后果等相关研究提供了重要的基础数据和科学依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=161683117\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-吉林集安发现斑驳白化马铁菊头蝠\",\"category\":\"zoology\"},{\"title\":\"海南热带雨林国家公园两片区社区保护态度与参与意识的比较研究\",\"title_cn\":\"海南热带雨林国家公园两片区社区保护态度与参与意识的比较研究\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过非诱导式半结构化问卷调查，在海南热带雨林国家公园霸王岭与五指山两片区821份样本的基础上，比较了海南长臂猿分布区与非分布区居民的保护认知、态度及行动，发现分布区居民认知与态度更积极，学历、居住地等为主要影响因素，为优化社区保护宣传提供了参考。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探究海南长臂猿（Nomascus hainanus）分布区与非分布区社区居民在野生动物保护中的认知、态度与行动差异及其影响因素，以海南热带雨林国家公园霸王岭片区（分布区）与五指山片区（非分布区）为研究区域，采用非诱导式半结构化问卷调查法，共收集有效样本821份，从保护认知、保护态度及保护行动3个维度进行对比分析，并结合广义线性模型与卡方检验分析相关影响因素。结果显示：（1）调查对象以黎族居民为主，职业构成以务农/务工为主，整体教育程度和收入水平偏低；（2）分布区居民对海南长臂猿等重点保护野生动物及自然保护地的认知水平显著高于非分布区（P \\u0026lt; 0.05），学历、居住地及保护地认知水平是导致认知差异的主要影响因素；（3）两地居民均普遍认可野生动物的生态与社会价值，明确反对猎捕并积极支持国家公园建设，但分布区居民的保护态度更为积极，该差异与年龄、居住地及对保护政策的认知程度显著相关（P \\u0026lt; 0.05）；（4）大部分居民参与过野生动物保护宣传活动，且普遍认为宣传活动有效提升了自身保护意识，其中分布区的保护宣传效果显著优于非分布区（P \\u0026lt; 0.05）。研究表明，社区居民在野生\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160292230\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-海南热带雨林国家公园两片区社区保护态度与参与意识的比较研究\",\"category\":\"zoology\"},{\"title\":\"基于\\u003citalic\\u003eND2\\u003c/italic\\u003e基因的西北地区密点麻蜥系统发育分析\",\"title_cn\":\"基于\\u003citalic\\u003eND2\\u003c/italic\\u003e基因的西北地区密点麻蜥系统发育分析\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队基于线粒体ND2基因序列，对中国西北内蒙古、宁夏、甘肃和新疆4个地理区域的112份密点麻蜥样本进行分析，在遗传多样性与系统发育关系的基础上，发现其总体遗传多样性较高（Hd=0.969，π=0.072），分化为两大跨区域演化支系且单倍型分布混杂，群体间存在较高遗传分化（FST=0.510 89），并检测到新疆群体存在历史扩张信号但未达显著水平，获得了相应研究进展，为理解该物种的遗传分化格局及演化历史提供了参考。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"密点麻蜥（Eremias multiocellata）是中亚干旱生态系统的代表性蜥蜴，在我国北方及西北地区分布广泛，对维持荒漠生态系统结构与功能稳定具有重要作用。本研究以中国西北4个地理区域（内蒙古、宁夏、甘肃和新疆）的112份样本为研究对象，基于线粒体ND2基因序列，分析其遗传多样性、系统发育关系及遗传分化格局。结果显示：ND2基因序列A + T平均含量达60.7%，具有AT偏倚性；共检测到58个单倍型，单倍型多样性（Hd）为0.759～0.941，核苷酸多样性（π）为0.041～0.070，总体遗传多样性水平较高（Hd = 0.969，π = 0.072）。系统发育分析显示，密点麻蜥分化为两大跨区域演化支系，单倍型分布混杂，未形成与地理区域严格对应的单系结构；共检测到6个跨群体共享单倍型。遗传分化分析表明，群体间总体FST达0.510 89，存在较高的遗传分化，其中新疆群体与宁夏、内蒙古群体间的分化程度相对较高。中性检验与错配分布分析表明，甘肃、内蒙古和宁夏群体在演化历史上种群规模相对稳定，未经历显著的群体扩张事件，新疆群体存在历史扩张的生物学信号，但未达到统计学显著水平。研究结果\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160171715\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于\\u003citalic\\u003eND2\\u003c/italic\\u003e基因的西北地区密\",\"category\":\"zoology\"},{\"title\":\"石臼湖越冬豆雁与小天鹅肠道菌群及潜在病原菌研究\",\"title_cn\":\"石臼湖越冬豆雁与小天鹅肠道菌群及潜在病原菌研究\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过16S rRNA扩增子测序技术，在石臼湖越冬豆雁与小天鹅肠道菌群研究的基础上，发现两种水鸟肠道菌群Alpha多样性无显著差异，但Beta多样性存在显著宿主分异，且群落相似度较高，共检出22种潜在病原菌，其中豆雁以屎肠球菌为优势病原菌，获得了相应研究进展，为越冬水鸟肠道健康监测与病原菌传播风险防控提供了相关研究价值。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为掌握石臼湖越冬水鸟肠道菌群及潜在病原菌的基本特征，本研究利用16S rRNA扩增子测序技术，对该湖泊越冬豆雁（Anser fabalis）和小天鹅（Cygnus columbianus）肠道菌群结构和病原菌组成进行了分析。结果表明：两种水鸟肠道菌群的Alpha多样性无显著性差异（Chao 1，P = 0.63；Shannon-Wiener，P = 0.48），但Beta多样性存在显著宿主分异（PERMANOVA，P \\u0026lt; 0.001）；优势菌门均为变形菌门（Proteobacteria）、厚壁菌门（Firmicutes）和拟杆菌门（Bacteroidota）；Sørensen相似性指数为0.84，表明两种水鸟肠道菌群群落相似度较高，推测与其亲缘关系较近、栖息环境一致密切相关；共检出潜在肠道病原菌22种，其中共有病原菌14种；屎肠球菌（Enterococcus faecium）为豆雁肠道优势病原菌（占病原菌总相对丰度的92.06%），乳房链球菌（Streptococcus uberis）、莫雷梭菌（Solobacterium moorei）及鲁氏耶尔森氏菌（Yersinia ruc\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160037101\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-石臼湖越冬豆雁与小天鹅肠道菌群及潜在病原菌研究\",\"category\":\"zoology\"},{\"title\":\"笼养丹顶鹤孵卵期行为模式偏离及丰容建议\",\"title_cn\":\"笼养丹顶鹤孵卵期行为模式偏离及丰容建议\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过红外相机技术对比分析黑龙江扎龙国家级自然保护区笼养与野生丹顶鹤孵卵期行为，发现笼养个体孵化警戒和翻卵行为时间占比极显著低于野生个体，行为节律与人类活动同步化，偏离天然节律；遮蔽度、巢材种类等丰容条件与相关行为显著相关，为笼养丹顶鹤环境丰容提供了科学依据。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探究笼养环境对丹顶鹤孵卵期行为模式的影响，并为其环境丰容提供科学依据，本研究于2024年3—5月，以黑龙江扎龙国家级自然保护区的笼养与野生丹顶鹤（Grus japonensis）为研究对象，采用红外相机技术对比分析其孵卵期行为时间分配与活动节律，揭示笼养环境对其行为模式的制约因素，并分析环境因子与行为表达的相关性。结果表明：（1）笼养个体在关键繁殖行为上显著弱化，其中孵化警戒和翻卵行为的时间占比极显著低于野生个体（P \\u0026lt; 0.01）。（2）笼养群体的行为节律呈现与人类活动同步化特征，觅食、游走高峰提前且延长，对鸣、整理等行为峰期数量减少或时段偏移，与野生种群的天然节律存在偏离。（3）在笼养环境的丰容条件中，遮蔽度与孵化警戒（P \\u0026lt; 0.001）、翻卵（P \\u0026lt; 0.05）行为呈显著正相关，与孵化静栖行为呈显著负相关（P \\u0026lt; 0.01）；巢材种类（P \\u0026lt; 0.001）、地表覆盖度（P \\u0026lt; 0.05）与游走行为显著负相关；巢材数量、人类干预与孵化警戒行为显著正相关（P \\u0026lt; 0.05）。研究表明，笼养丹顶鹤在孵卵期存在行为时间分配和活动节律的适应性偏\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160122733\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-笼养丹顶鹤孵卵期行为模式偏离及丰容建议\",\"category\":\"zoology\"},{\"title\":\"基于集合模型的中国白鹇栖息地适宜性研究\",\"title_cn\":\"基于集合模型的中国白鹇栖息地适宜性研究\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过集合物种分布模型（整合GAM、GLM、GBM、MaxEnt和RF五种算法），在建立白鹇分布与环境变量函数关系的基础上，发现集合模型预测性能显著优于单算法模型，并识别出年降水总量、坡度、海拔和人类足迹指数为主要影响因子，预测中国白鹇适宜栖息地面积约4.11×10⁵ km²，主要分布于云南、福建等省份，为白鹇区域尺度保护规划、栖息地管理与生态修复提供了科学依据。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"白鹇（Lophura nycthemera）是国家二级重点保护野生动物，因目前缺乏区域尺度的栖息地适宜性评价，制约了其大尺度保护管理措施的制定，故本研究采用集合物种分布模型（整合GAM、GLM、GBM、MaxEnt和RF五种算法）建立白鹇分布与环境变量之间的函数关系，并预测中国白鹇栖息地适宜性及其空间分布范围。结果显示：集合模型的预测性能（AUC、TSS和BOYCE分别为0.90、0.63和0.99）显著优于单算法模型；影响白鹇栖息地适宜性的主要因子为年降水总量、坡度、海拔和人类足迹指数；集合模型预测中国白鹇适宜栖息地面积约4.11 × 105 km2，主要分布于云南、福建、江西、四川、广东、浙江、湖南和广西，江苏适宜栖息地面积最小且破碎化程度最高。研究结果可为白鹇在区域尺度上的保护规划、栖息地管理与生态修复提供科学依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=146576613\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于集合模型的中国白鹇栖息地适宜性研究\",\"category\":\"bioinformatics\"},{\"title\":\"藏东布加雪山四种雉类的时空生态位关系\",\"title_cn\":\"藏东布加雪山四种雉类的时空生态位关系\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过布设红外相机并利用占域模型和日活动节律分析，在藏东布加雪山四种雉类（血雉、高原山鹑、白马鸡、藏雪鸡）时空分布数据的基础上，发现距河流距离是影响其占域率的共同关键因子，且各物种生境需求存在显著种间差异，获得了相应研究进展，为区域雉类栖息地保护与管理提供了相关研究价值。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探讨布加雪山区域雉类的时空分布特征，2024年8月—2025年4月布设173台红外相机（回收150台），获得雉科（Phasianidae）独立有效记录701条，包括血雉（Ithaginis cruentus，n = 35）、黄喉雉鹑（Tetraophasis szechenyii，n = 19）、高原山鹑（Perdix hodgsoniae，n = 54）、白马鸡（Crossoptilon crossoptilon，n = 301）和藏雪鸡（Tetraogallus tibetanus，n = 292）。针对独立事件较多的血雉、高原山鹑、白马鸡和藏雪鸡（黄喉雉鹑因事件数有限未进行后续计算），选取海拔、坡度、坡向、崎岖度、植被归一化指数、距河流距离和人类足迹指数7个变量，利用占域模型和日活动节律分析其时空生态位关系。结果显示：距河流距离是影响4种雉类占域率的共同关键因子，表明水源可得性是其栖息地选择的基础限制因素。各物种在生境需求上呈现显著种间差异，白马鸡对人为干扰尤为敏感，藏雪鸡依赖地形与植被复合条件，高原山鹑对水源依赖性最为突出，血雉受植被、坡度和水源综合影响。物种相互作用因子（S\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=161331540\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-藏东布加雪山四种雉类的时空生态位关系\",\"category\":\"zoology\"},{\"title\":\"麝鼠睾丸\\u003citalic\\u003eAcsl\\u003c/italic\\u003e家族基因的表达差异及功能预测\",\"title_cn\":\"麝鼠睾丸\\u003citalic\\u003eAcsl\\u003c/italic\\u003e家族基因的表达差异及功能预测\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过qPCR和生物信息学分析，在麝鼠繁殖期、繁殖末期和非繁殖期睾丸组织样本的基础上，发现Acsl1和Acsl5在繁殖期表达显著高于非繁殖期，其余家族基因表达差异不显著；编码蛋白均为亲水性，除Acsl6外均为稳定蛋白，且均含AMP-binding结构域，主要参与脂肪酸活化与脂质代谢，为探究Acsl家族在麝鼠季节性繁殖中调控精子发生的机制提供了基础参考。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"麝鼠（Ondatra zibethicus）具有典型的季节性繁殖特征，其睾丸脂质代谢与精子发生过程可能受Acsl家族基因调控，但目前相关研究尚不充分。为探究麝鼠不同时期睾丸组织中Acsl家族基因（Acsl1、Acsl3、Acsl4、Acsl5和Acsl6）的表达差异并预测其功能，本研究选取体况相近、约11月龄的健康雄性麝鼠，分别于繁殖期（4月）、繁殖末期（9月）和非繁殖期（11月）各采集3只个体，采用qPCR技术检测睾丸中Acsl家族基因的表达差异，并运用生物信息学方法分析其编码蛋白的理化性质、结构特征及互作网络。结果表明：Acsl1和Acsl5在繁殖期的表达水平显著高于非繁殖期（P \\u0026lt; 0.05），其余家族基因虽有相对表达量差异但均未达到显著水平，且与非繁殖期相比呈现不同变化趋势；生物信息学分析表明，该家族编码蛋白均为亲水性蛋白，除Acsl6外其余成员均为稳定蛋白；跨膜结构预测显示，仅Acsl6含有2个跨膜结构域，其余家族成员均含1个；所有Acsl家族蛋白均具有AMP-binding结构域；蛋白互作网络预测表明，该家族基因主要参与脂肪酸活化、脂质合成与分解代谢，在脂肪酸的合成、\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160179979\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-麝鼠睾丸\\u003citalic\\u003eAcsl\\u003c/italic\\u003e家族基因的\",\"category\":\"zoology\"},{\"title\":\"基于氨基酸成分的象牙及其仿制品对比分析\",\"title_cn\":\"基于氨基酸成分的象牙及其仿制品对比分析\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过分析非洲象牙、猛犸象牙、鹿骨、牛骨和野猪牙共56份样本中18种氨基酸的组分及含量，运用正交偏最小二乘-判别分析、方差分析和系统聚类分析，在氨基酸成分差异特征的基础上，发现异亮氨酸等5种差异氨基酸可有效区分不同基原，验证了基于氨基酸组分结合化学模式识别模型能实现象牙及其仿制品的有效鉴别，获得了相应研究进展，为物种鉴定、海关监管与保护执法提供了新的技术支撑。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为建立一种基于氨基酸成分的象牙及其仿制品的快速鉴别方法，本研究对非洲象牙、猛犸象牙、鹿骨、牛骨和野猪牙共56份样本中18种氨基酸的组分及含量进行分析测定，并运用正交偏最小二乘-判别分析（OPLS-DA）、方差分析和系统聚类分析方法，研究不同基原样本间氨基酸成分差异特征。结果表明：不同基原样本的氨基酸组成存在明显差异。通过OPLS-DA模型筛选出异亮氨酸、苯丙氨酸、赖氨酸、组氨酸和胱氨酸5种具有鉴别意义的差异氨基酸；5种差异氨基酸的总含量均值从高到低依次为鹿骨、猛犸象牙、野猪牙、牛骨和非洲象牙；系统聚类分析在欧几里得距离为5时，将56份基原样本分为5类，结果与OPLS-DA模型一致。研究表明，基于氨基酸组分并结合化学模式识别模型，能够实现对象牙及其仿制品的有效鉴别，为相关物种鉴定、海关监管与保护执法提供了新的技术支撑。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=145885848\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-基于氨基酸成分的象牙及其仿制品对比分析\",\"category\":\"zoology\"},{\"title\":\"河南省劳亚食虫目物种多样性及分布\",\"title_cn\":\"河南省劳亚食虫目物种多样性及分布\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过形态、头骨特征及线粒体Cyt b基因分子鉴定，在2022—2024年全省30个采样点244号标本的基础上，发现河南省劳亚食虫目有16种（隶属3科11属），以东洋界物种为主，并修订了部分物种的分布记录，获得了区域物种名录更新，为生物多样性保护与管理提供了科学依据。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"劳亚食虫目（Eulipotyphla）为现生哺乳动物第三大类群，中国迄今已记录3科107种。为厘清河南省劳亚食虫目的物种多样性本底，于2022年4月—2024年9月在全省30个采样点共采集劳亚食虫目标本244号，基于形态、头骨特征及线粒体Cyt b基因分子生物学证据进行物种鉴定，并结合最新分类系统和文献记录进行梳理。结果表明：（1）河南劳亚食虫目动物计有16种，隶属于3科11属；（2）区系以东洋界物种为主（10种，占62.5%），兼具古北界物种（3种）和广布种（3种）；（3）删除中鼩鼱（Sorex caecutiens）和小缺齿鼹（Mogera wogura）在河南省的分布记录，修订大别山区缺齿鼹（M.latouchei）为海岛缺齿鼹（M.insularis）、大水鼩鼱（Chimarrogale platycephala）为利安德水鼩（C.leander）、短棘猬（Hemiechinus dauricus）为侯氏猬（Mesechinus hughi）。本研究提供了河南省食虫类动物多样性的第一手资料，更新了区域物种名录，可望为生物多样性保护与管理提供科学依据。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=145120970\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-河南省劳亚食虫目物种多样性及分布\",\"category\":\"zoology\"},{\"title\":\"中国东北地区大缺齿鼹指名亚种分子系统地理学研究\",\"title_cn\":\"中国东北地区大缺齿鼹指名亚种分子系统地理学研究\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过分析126个大缺齿鼹样本的线粒体Cyt b基因全序列，在补充采集中国东北样本并结合GenBank数据的基础上，发现35个单倍型且种群具一定遗传多样性，但缺乏与地理分布对应的谱系结构，近期经历种群扩张，且指名亚种与朝鲜亚种无明显分子分化，为鼹科系统地理学与进化历史研究提供了新的数据积累。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为明确我国大缺齿鼹（Mogera robusta）的分子系统地理分化地位，探讨其进化历史事件及分子系统地理学分化与亚种分化的关联性，本研究在黑龙江省和辽宁省补充采集样本13号，结合GenBank数据库已公开的113条遗传数据，对126个大缺齿鼹样本的线粒体Cyt b基因全序列进行分析。结果显示：所有样本共鉴定出35个单倍型，核苷酸多态性（π）为0.002 17，表明该种群具有一定的遗传多样性水平。系统发育树和中介网络分析显示，所有单倍型构成一个单系群，缺乏与地理分布（中国东北、俄罗斯远东、朝鲜半岛）显著对应的谱系结构。种群历史动态分析表明，大缺齿鼹近期经历了种群扩张。大缺齿鼹指名亚种（M.r.robusta）和朝鲜亚种（M.r.coreana）在分子水平上未见明显分化。上述结果暗示，大缺齿鼹在第四纪冰期可能利用了一个冰期避难所。本研究结果为深入研究鼹科（Talpidae）动物的系统地理学和进化历史提供了新的数据积累。\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=153325656\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-中国东北地区大缺齿鼹指名亚种分子系统地理学研究\",\"category\":\"zoology\"},{\"title\":\"北京市门头沟区七种兽类种群密度研究\",\"title_cn\":\"北京市门头沟区七种兽类种群密度研究\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队基于2022—2023年红外相机监测数据，运用随机相遇模型，对北京市门头沟区7种野生兽类开展种群密度估算，并分析其年度变化趋势及潜在影响因素。结果显示，狍、中华斑羚、野猪和猪獾种群密度均呈上升趋势，其中野猪增长最快，中华斑羚增长最平缓；豹猫小幅下降，亚洲狗獾降幅最大，赤狐相关结果未明确。该研究为区域物种保护管理提供了基础数据与参考价值。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"野生动物种群动态是种群生态学的核心研究内容，也是物种保护管理工作的重要基础。北京市门头沟区是北京西部重要的生态屏障，承载着区域生物多样性保育的关键功能。本研究基于2022—2023年红外相机监测数据，运用随机相遇模型（random encounter model，REM）对门头沟区7种野生兽类开展种群密度估算，并分析其年度变化趋势及潜在影响因素。结果显示：狍（Capreolus pygargus）、中华斑羚（Naemorhedus griseus）、野猪（Sus scrofa）和猪獾（Arctonyx collaris）种群密度均呈上升趋势，增幅依次为24.4%、7.4%、34.6%和23.1%，其中野猪增长最快（由2.83只/km²升至3.81只/km²），中华斑羚增长最为平缓（由2.17只/km²升至2.33只/km²）；豹猫（Prionailurus bengalensis）小幅下降（由3.41只/km2降至3.25只/km2）；亚洲狗獾（Meles leucurus）降幅最大，达35.4%（由19.31只/km2降至12.47只/km2）；赤狐（Vulpes vulpes）20\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=162454343\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-北京市门头沟区七种兽类种群密度研究\",\"category\":\"zoology\"},{\"title\":\"父本亲代投资缺失对圈养川金丝猴婴猴行为的影响\",\"title_cn\":\"父本亲代投资缺失对圈养川金丝猴婴猴行为的影响\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过瞬时扫描取样法，在圈养川金丝猴完整家庭与父本亲代投资缺失家庭婴猴昼间行为观察的基础上，发现父本缺失导致婴猴移动和拥坐行为占比升高，玩耍和休息行为减少，母婴互动类型单一，依赖对象集中于母体，社会支持结构简化，获得了父本亲代投资影响婴猴行为发育的相应研究进展，为圈养川金丝猴家庭结构管理及福利优化提供了相关研究价值。\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"为探究家庭结构完整性对圈养川金丝猴（Rhinopithecus roxellana）婴猴行为发育的影响，本研究于2025年5—6月，以圈养条件下完整家庭与父本亲代投资缺失家庭中的婴猴为研究对象，采用瞬时扫描取样法观察其昼间行为节律、亲子互动及依赖性行为特征。结果显示：（1）两组婴猴摄食高峰均受人工投喂影响，但完整家庭组婴猴活动意愿更强，玩耍（32.21%）、休息（37.23%）占比显著高于父本亲代投资缺失家庭组，后者的移动（25.92%）和拥坐（13.59%）行为占比显著升高；（2）在母婴互动中，完整家庭组理毛（57.14%）和保护（5.36%）行为占比显著高于父本亲代投资缺失家庭组（P \\u0026lt; 0.05），后者以母婴拥坐（52.23%）为主，互动类型单一；（3）完整家庭组父婴互动以跟随（53.33%）和玩耍（26.67%）为主，父母间理毛占比达78.11%，有助于营造稳定的家庭社交环境；（4）完整家庭组婴猴依赖对象多元，母婴理毛占比最高（46.50%），父婴相关依赖合计占27.24%；父本亲代投资缺失家庭组则高度集中于母婴拥坐（53.97%），保护性依赖仅占1.02%，社会支持结构\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=160304275\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-父本亲代投资缺失对圈养川金丝猴婴猴行为的影响\",\"category\":\"zoology\"},{\"title\":\"Large fisheries declines linked to compound and extreme climate events.\",\"title_cn\":\"大型渔业衰退与复合及极端气候事件相关。\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过分析覆盖254个区域、1246个物种的6659个时间序列的三十年全球数据，采用基于风险的分析方法，在评估鱼类种群所面临的极端高温与低海洋生产力单独及复合影响的基础上，发现大型渔业衰退与复合及极端气候事件相关，获得了关于极端气候对渔业风险作用的相应研究进展，为理解气候变化下渔业管理提供了相关研究价值。\",\"journal\":\"Nat Commun\",\"date\":\"2026-09-01\",\"authors\":\"Cheung WWL, Frölicher TL, Morgante I et al.\",\"abstract\":\"Climate extremes are increasingly disrupting marine ecosystems and fisheries. However, evidence on extreme ocean temperature effects on fish stocks and fisheries is mixed, and the combined impacts of heat and productivity extremes remain unclear. Using three decades of global data encompassing 6659 time-series for 1246 species across 254 regions, we conduct a risk-based analysis to quantify how local extreme high temperatures and low ocean productivity that these species are exposed to, alone an\",\"doi\":\"10.1038/s41467-026-77077-z\",\"url\":\"https://doi.org/10.1038/s41467-026-77077-z\",\"pmid\":\"42680769\",\"category\":\"ecology\"},{\"title\":\"Complex effects of sex reversal on reproductive success in wild frogs.\",\"title_cn\":\"性别逆转对野生蛙类繁殖成功的复杂影响。\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过对比野生蛙类中性别逆转个体与性别一致雄性的生育力、对雌性的吸引力、同性竞争能力及后代存活情况，在自然种群数据的基础上，发现性别逆转对繁殖成功具有复杂影响，获得了相应研究进展，为理解环境性别决定对气候驱动灭绝的加速或延缓作用提供了相关价值。\",\"journal\":\"Sci Adv\",\"date\":\"2026-09-04\",\"authors\":\"Bókony V, Balogh E, Ujhegyi N et al.\",\"abstract\":\"Sex reversal, when the environment overrides genotypic sex determination, may hasten or delay climate-driven extinction in ectothermic animals, depending on sex-reversed individuals' reproductive ability and offspring viability. Empirically, next to nothing is known about these traits in natural populations. Here, we present a comprehensive dataset of wild frogs to compare sex-reversed and sex-concordant males for fertility, attractiveness to females, intrasexual competitiveness, and offspring s\",\"doi\":\"10.1126/sciadv.aeg3488\",\"url\":\"https://doi.org/10.1126/sciadv.aeg3488\",\"pmid\":\"42685202\",\"category\":\"zoology\"},{\"title\":\"Abrupt declines in fish productivity often precede stock collapses in marine fisheries.\",\"title_cn\":\"海洋渔业中鱼类生产力的骤降往往先于种群崩溃。\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过系统分类全球机构评估的渔业种群生产力时间动态，在鱼类种群崩溃研究基础上，发现生产力骤降往往先于种群崩溃，获得了关于骤降发生及其驱动因素的全球评估进展，为渔业可持续管理提供了预警价值。\",\"journal\":\"Sci Adv\",\"date\":\"2026-09-04\",\"authors\":\"Pélissié M, Devictor V, Jensen OP et al.\",\"abstract\":\"Marine life is under multiple pressures, including climate change and overfishing, which can threaten fishery sustainability especially when it results in large, abrupt, and persistent shifts in fish productivity. Reports of abrupt shifts in marine systems are not uncommon, but a global assessment of their occurrence and drivers is seriously lacking. Here, we systematically classified the temporal dynamics of fish stock productivity from agency-assessed fisheries worldwide. We detected productiv\",\"doi\":\"10.1126/sciadv.aed7911\",\"url\":\"https://doi.org/10.1126/sciadv.aed7911\",\"pmid\":\"42685203\",\"category\":\"zoology\"},{\"title\":\"Association between precentral gyrus morphology and modality-specific intentional communication in chimpanzees (\",\"title_cn\":\"中央前回形态与黑猩猩特定模态意向性沟通之间的关联\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过磁共振图像后处理分析，在278只黑猩猩样本的基础上，刻画了中央前回中央沟与中央前沟的形态特征，并描述了六种最显著的形态模式，发现中央前回形态与特定模态的意向性沟通存在关联，获得了相应研究进展，为理解灵长类运动皮层形态与沟通行为演化提供了相关价值。\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-01\",\"authors\":\"Foubet O, Sun ZY, Mangin JF et al.\",\"abstract\":\"The precentral gyrus (preCG) is morphologically defined posteriorly by the central sulcus (CS) and anteriorly by the superior and inferior precentral sulci (preCS). Stimulation of the preCG along the dorsal-ventral plane elicits motor activation across the body in a topographic manner. In this study, we used postimage analyses to characterize the shape of the CS and preCS in a sample of 278 magnetic resonance image scans of chimpanzees. Using these data, we initially described the six most promi\",\"doi\":\"10.1073/pnas.2419514123\",\"url\":\"https://doi.org/10.1073/pnas.2419514123\",\"pmid\":\"42607188\",\"category\":\"zoology\"},{\"title\":\"Three millennia of lizard and snake consumption by Natufian foragers.\",\"title_cn\":\"纳图夫人狩猎采集者三千年来对蜥蜴与蛇的食用。\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过分析以色列el-Wad Terrace遗址跨越三千余年的蜥蜴与蛇类遗存，在纳图夫人狩猎采集者饮食研究的基础上，发现大型蛇类和蜥蜴构成了其生计中稳定且重要的组成部分，且蛇椎骨上的屠宰痕迹表明各居住阶段均有规律性食用，获得了关于更新世末期人类饮食灵活性的相应研究进展，为理解纳图夫人资源利用策略提供了相关价值。\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-01\",\"authors\":\"Lev M, Weinstein-Evron M, Yeshurun R\",\"abstract\":\"Squamate (lizard and snake) exploitation provides a rarely documented window into human dietary flexibility at the end of the Pleistocene. This study analyzes over three millennia of squamate remains from el-Wad Terrace (Israel), revealing that large-bodied snakes and lizards formed a substantial and consistent part of Natufian subsistence. Repeated evidence of butchery on snake vertebrae indicates regular consumption across all occupation phases. Shifts in squamate abundance and bone modificati\",\"doi\":\"10.1073/pnas.2609354123\",\"url\":\"https://doi.org/10.1073/pnas.2609354123\",\"pmid\":\"42607190\",\"category\":\"zoology\"},{\"title\":\"Pelagic food web realignment supports resilient larvae of Southern Bluefin Tuna in a warming ocean.\",\"title_cn\":\"远洋食物网重构支持变暖海洋中南方蓝鳍金枪鱼幼虫的适应性。\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过分析远洋食物网结构，在变暖海洋中南方蓝鳍金枪鱼幼虫适应性研究的基础上，发现食物网重构能够维持幼虫的食物资源供应，验证了其应对气候变化导致的升温与生产力下降的韧性，获得了相应研究进展，为理解高营养级鱼类幼虫在气候变化下的生存机制提供了相关研究价值。\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-01\",\"authors\":\"Landry MR, Laiz-Carrión R, Malca E et al.\",\"abstract\":\"Many of the oceans' top predatory fishes at low to mid latitudes face an uncertain future as their vulnerable larvae deal with higher environmental temperature and reduced productivity associated with climate change. However, ocean ecosystem models that predict a general decline of zooplankton prey with warming and stratification hardly ever account for complexities in pelagic food webs that might make them resilient in providing food resources for larvae. We illustrate such complexities in comp\",\"doi\":\"10.1073/pnas.2601583123\",\"url\":\"https://doi.org/10.1073/pnas.2601583123\",\"pmid\":\"42636360\",\"category\":\"ecology\"},{\"title\":\"Fish navigate a hydrodynamic maze via yaw-mediated lateral migration.\",\"title_cn\":\"鱼类通过偏航介导的侧向迁移在流体动力迷宫中导航。\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过设计带有空间流速梯度的流体动力迷宫，在鱼类感知与响应水流线索的基础上，发现鱼类利用偏航介导的侧向迁移实现导航，验证了其依据局部流体动力信息选择节能路径的机制，获得了对鱼类在复杂流场中定向行为的新认识，为理解水生动物能量高效导航策略提供了参考价值。\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-08\",\"authors\":\"Calicchia MA, Ni R\",\"abstract\":\"In aquatic environments, gradients in flow velocity and turbulence define a constantly shifting landscape that sets the physical constraints on propulsion and energy expenditure in fish. Successfully navigating these complex flows depends on the ability to sense and respond to subtle hydrodynamic cues in an energy-efficient manner. Revealing these mechanisms is central to understanding how fish identify and exploit favorable flow conditions. To this end, we designed a hydrodynamic maze with spat\",\"doi\":\"10.1073/pnas.2613565123\",\"url\":\"https://doi.org/10.1073/pnas.2613565123\",\"pmid\":\"42691085\",\"category\":\"zoology\"},{\"title\":\"Exceptional brain and ecological diversity in the earliest snakes.\",\"title_cn\":\"最早蛇类中非凡的脑部与生态多样性。\",\"title_cn_summary\":\"\",\"ai_summary\":\"该研究团队通过分析早期蛇类化石的脑部形态，在最早蛇类多样性的基础上，验证了其脑部与生态特征的非凡多样性，获得了关于蛇类生态起源的相应研究进展，为理解蛇类演化早期适应辐射提供了相关价值。\",\"journal\":\"Nature\",\"date\":\"2026-09-01\",\"authors\":\"Simões TR, Sobral G, Macrì S et al.\",\"abstract\":\"Understanding the ecological origin of snakes has remained a century-old challenge\",\"doi\":\"10.1038/s41586-026-10809-9\",\"url\":\"https://doi.org/10.1038/s41586-026-10809-9\",\"pmid\":\"42486987\",\"category\":\"ecology\"},{\"title\":\"野生动物友好型农业研究与实践进展\",\"title_cn\":\"野生动物友好型农业研究与实践进展\",\"title_cn_summary\":\"\",\"journal\":\"野生动物学报\",\"date\":\"\",\"authors\":\"\",\"abstract\":\"全球人口增长带来的粮食需求增加，导致农业用地不断扩张与农药化肥过量使用，这是造成野生动物生境丧失、破碎化及质量下降的主要原因之一。野生动物友好型农业（wildlife-friendly farming， WFF）作为一种新兴农业模式，为缓解农业发展与野生动物保护之间的矛盾提供了可行路径。本研究综述了国内外相关研究和实践经验，梳理了WFF的起源与概念，分析了其在实践中的进展，并详细阐述了通过改造农业景观为野生动物提供栖息地的多种策略，借助经济激励手段促进野生动物保护与控制农药化肥过度使用所形成的正反馈循环，以及野生动物智慧监测技术在WFF的应用前景，并总结了当前国内外WFF的经济和社会实践。尽管WFF在小范围内的成功案例已展现出明显优势，但在更广泛的实施过程中仍面临诸多挑战，包括农业景观中野生动物监测技术落后、欠缺对气候变化的考量，以及市场机制低效、政策支持和公众意识不足等。未来，WFF需充分利用人工智能监测设备、区块链等先进技术，增强其实际应用的可行性；应因地制宜，结合不同地理区域的生态与经济需求，在政策、经济和社会层面加强协调合作，以支持可持续农业和野生动物保护的协同目标，最终实现农\",\"doi\":\"\",\"url\":\"http://ysdw.nefu.edu.cn/thesisDetails?columnId=143585403\\u0026Fpath=\\u0026index=0\\u0026l=zh\",\"pmid\":\"ysdw-野生动物友好型农业研究与实践进展\",\"category\":\"zoology\",\"match_count\":1,\"is_hot\":false,\"ai_summary\":\"该研究团队通过综述国内外相关研究和实践经验，在梳理野生动物友好型农业（WFF）起源与概念的基础上，分析了其在实践中的进展，阐述了改造农业景观、经济激励及智慧监测等策略，并总结了经济和社会实践。研究发现，WFF在小范围成功案例中展现优势，但面临监测技术落后、气候变化考量欠缺及市场机制低效等挑战，为可持续农业与野生动物保护协同发展提供了相关研究价值。\"},{\"title\":\"China's solar expansion policy reduces bird diversity.\",\"title_cn\":\"\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-20\",\"authors\":\"Zhang H, Zhang A, Wu K et al.\",\"abstract\":\"Could the global transition to renewable energy create a green dilemma that pits carbon reduction against biodiversity conservation? This study examined the effect of policies promoting solar photovoltaics on local avian biodiversity using a panel dataset covering 2344 counties in China from 2014 to 2023. Policies that favored photovoltaic expansion led to reductions in bird diversity, disproportionately affecting wealthier and nondesert regions, as well as widespread species. The mechanism oper\",\"doi\":\"10.1126/science.aee0747\",\"url\":\"https://doi.org/10.1126/science.aee0747\",\"pmid\":\"42623453\",\"category\":\"zoology\",\"match_count\":3,\"is_hot\":true,\"ai_summary\":\"该研究团队通过分析2014至2023年中国2344个县的面板数据，在评估太阳能光伏扩张政策对当地鸟类多样性影响的基础上，发现促进光伏扩张的政策导致鸟类多样性下降，且对较富裕、非沙漠地区及广布种影响尤为显著，获得了相应研究进展，为平衡可再生能源发展与生物多样性保护的相关研究提供了价值。\"},{\"title\":\"A queen odour mediates reproductive suppression in a eusocial mammal.\",\"title_cn\":\"蜂后气味介导真社会性哺乳动物的生殖抑制。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-08-01\",\"authors\":\"Khallaf MA, Hart DW, Luo W et al.\",\"abstract\":\"Eusociality is exceptionally rare in mammals, and its proximate mechanisms remain poorly understood. Naked mole-rats provide a striking example, with reproduction restricted to a single queen, while all other females remain infertile\",\"doi\":\"10.1038/s41586-026-10772-5\",\"url\":\"https://doi.org/10.1038/s41586-026-10772-5\",\"pmid\":\"42457958\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过行为与化学分析，在真社会性哺乳动物裸鼹鼠的研究基础上，验证了蜂后气味介导的生殖抑制机制，发现特定气味信号可维持非繁殖雌性的不育状态，获得了关于社会性生殖调控的相应研究进展，为理解哺乳动物真社会性的近因机制提供了相关价值。\"},{\"title\":\"A 5.3-million-year-old deep-sea whale necropolis in the Diamantina Zone.\",\"title_cn\":\"五百三十万年前深海鲸类墓群：迪亚曼蒂纳区的发现\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-06-01\",\"authors\":\"Peng X, Zhou P, Song X et al.\",\"abstract\":\"Whale falls are biodiversity oases at seabeds\",\"doi\":\"10.1038/s41586-026-10546-z\",\"url\":\"https://doi.org/10.1038/s41586-026-10546-z\",\"pmid\":\"42271050\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过深海探测与沉积分析，在迪亚曼蒂纳区发现了一处距今约530万年的深海鲸类墓群，验证了鲸落作为海底生物多样性绿洲的长期生态作用，获得了关于深海生态系统演化的重要进展，为理解鲸类死亡对深海生物群落的影响提供了相关研究价值。\"},{\"title\":\"Darkness and body size shaped end-Cretaceous marine extinction patterns.\",\"title_cn\":\"黑暗与体型塑造了白垩纪末期海洋灭绝模式。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Ying R, Monteiro FM, Witts JD et al.\",\"abstract\":\"The Chicxulub asteroid impact at the Cretaceous-Paleogene (K-Pg) boundary (66 Ma) is thought to have caused the extinction of around 75% of species in the fossil record by triggering catastrophic environmental changes\",\"doi\":\"10.1038/s41586-026-10541-4\",\"url\":\"https://doi.org/10.1038/s41586-026-10541-4\",\"pmid\":\"42203866\",\"category\":\"paleontology\",\"ai_summary\":\"该研究团队通过分析白垩纪-古近纪（K-Pg）边界化石记录，在探讨希克苏鲁伯小行星撞击引发环境剧变的基础上，验证了黑暗与体型对海洋物种灭绝模式的塑造作用，获得了相应研究进展，为理解撞击事件导致的生物选择性灭绝机制提供了相关研究价值。\"},{\"title\":\"Adaptive cellular evolution in the intestine of hyperdiverse cichlid fishes.\",\"title_cn\":\"高多样性丽鱼科鱼类肠道中的适应性细胞进化。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Fages A, Luxey M, Ronco F et al.\",\"abstract\":\"The ability of animals to efficiently track down and digest food is crucial for their survival, and the specialization to different diets is a major driver of diversification in this group\",\"doi\":\"10.1038/s41586-026-10494-8\",\"url\":\"https://doi.org/10.1038/s41586-026-10494-8\",\"pmid\":\"42129563\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过比较分析，在高多样性丽鱼科鱼类肠道适应性细胞进化的基础上，发现细胞类型特化与饮食多样化相关，获得了相应研究进展，为理解动物食性适应与物种分化的细胞机制提供了相关价值。\"},{\"title\":\"Specific expansion of motor cortical projections in a singing mouse.\",\"title_cn\":\"鸣唱小鼠运动皮层投射的特异性扩展。\",\"title_cn_summary\":\"\",\"journal\":\"Nature\",\"date\":\"2026-07-01\",\"authors\":\"Isko EC, Harpole CE, Zheng XM et al.\",\"abstract\":\"Elucidating how modifications in neural circuit architecture drive behavioural innovation remains a key challenge in neuroscience and evolutionary biology. In mammals, the neocortex is posited to play a crucial part in facilitating rapid behavioural innovations\",\"doi\":\"10.1038/s41586-026-10458-y\",\"url\":\"https://doi.org/10.1038/s41586-026-10458-y\",\"pmid\":\"42092144\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过神经解剖学与比较分析方法，在鸣唱小鼠与普通小鼠运动皮层投射差异的基础上，发现鸣唱小鼠运动皮层投射出现特异性扩展，获得了关于神经回路结构修饰驱动行为创新的研究进展，为理解哺乳动物新皮层促进快速行为创新的机制提供了相关价值。\"},{\"title\":\"The scales of strain on sharks.\",\"title_cn\":\"鲨鱼承受压力的尺度。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-13\",\"authors\":\"Roopnarine PD\",\"abstract\":\"The fossil record attributes shark decline in the Caribbean to human activity.\",\"doi\":\"10.1126/science.aek0549\",\"url\":\"https://doi.org/10.1126/science.aek0549\",\"pmid\":\"42594218\",\"category\":\"paleontology\",\"ai_summary\":\"该研究团队基于加勒比地区鲨鱼化石记录，验证了其种群衰退与人类活动的关联，发现人类压力在时空尺度上对鲨鱼衰落具有显著影响，获得了相应研究进展，为理解人类活动对海洋生态系统的长期影响提供了相关研究价值。\"},{\"title\":\"Fossil denticles reveal how ocean productivity shapes shark baselines and recovery potential.\",\"title_cn\":\"化石皮齿揭示海洋生产力如何塑造鲨鱼基线及恢复潜力。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-13\",\"authors\":\"Dillon EM, McCauley DJ, González M et al.\",\"abstract\":\"Shark populations on coral reefs have declined globally, but few baselines exist to quantify natural variability before human impact. Using fossil dermal denticles preserved in reef sediments, we reconstructed shark communities across the Isthmus of Panama before substantial exploitation [~7 to 3 thousand years ago (ka)] and recently (past century). We found differences in shark baselines and responses to fishing between the oceans on either side of the Isthmus. Reefs in the Pacific supported an\",\"doi\":\"10.1126/science.aec2144\",\"url\":\"https://doi.org/10.1126/science.aec2144\",\"pmid\":\"42594196\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过分析珊瑚礁沉积物中保存的化石皮齿，在巴拿马地峡两侧约7至3千年前及近一个世纪的鲨鱼群落重建基础上，发现太平洋与加勒比海礁鲨基线及对捕捞的响应存在差异，获得了关于海洋生产力影响鲨鱼基线及恢复潜力的相应研究进展，为理解人类干扰前自然变异及相关保护研究提供了价值。\"},{\"title\":\"Fossil evidence favors a role for vision in the modular evolution of the primate neocortex.\",\"title_cn\":\"化石证据支持视觉在灵长类新皮层模块化进化中的作用。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-06\",\"authors\":\"Kay RF, Organ CL, Morse PE et al.\",\"abstract\":\"Neocortical expansion is a key innovation of crown primates, although fossil evidence for how the neocortex has evolved remains elusive. We studied neocortical evolution using virtual brain endocasts from extant and Eocene-Miocene fossil primates. We found that neocortex size increased in parallel across crown primate clades, with rapid increases in tarsiers and anthropoids. Although the frontal lobe is commonly described as having expanded disproportionately in primates, we show that it evolved\",\"doi\":\"10.1126/science.aee3541\",\"url\":\"https://doi.org/10.1126/science.aee3541\",\"pmid\":\"42561065\",\"category\":\"evolution\",\"ai_summary\":\"该研究团队通过虚拟脑内模方法，在现生及始新世—中新世灵长类化石的基础上，发现新皮层尺寸在冠灵长类支系中平行增大，跗猴和类人猿中增长迅速，并验证了额叶并非不成比例扩张，而是视觉相关模块在灵长类新皮层模块化进化中发挥关键作用，获得了相应研究进展，为理解灵长类大脑进化机制提供了化石证据价值。\"},{\"title\":\"Genes of an icon.\",\"title_cn\":\"一个偶像的基因。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-08-06\",\"authors\":\"Price M\",\"abstract\":\"In the DNA of bison, scientists find clues to the animals' past-and keys to safeguarding their future.\",\"doi\":\"10.1126/science.ael2158\",\"url\":\"https://doi.org/10.1126/science.ael2158\",\"pmid\":\"42561059\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析野牛DNA，在相关研究对象的基础上，发现其中蕴含其历史线索及保障未来生存的关键信息，获得了相应研究进展，为野牛保护相关研究提供了价值。\"},{\"title\":\"When mammals crossed between continents.\",\"title_cn\":\"当哺乳动物跨越大陆之间。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"McGuire JL, Williams CM\",\"abstract\":\"The Great American Biotic Interchange informs the dynamics of modern species invasions.\",\"doi\":\"10.1126/science.aei5362\",\"url\":\"https://doi.org/10.1126/science.aei5362\",\"pmid\":\"42531416\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析南北美洲哺乳动物迁徙记录，在生物多样性交换研究基础上，验证了大陆间物种迁移的时空模式，获得了关于物种入侵动态的相应研究进展，为理解现代物种入侵机制提供了相关价值。\"},{\"title\":\"A 10-million-year biogeographic holding pen primed the Great American Biotic Interchange.\",\"title_cn\":\"一千万年的生物地理学“暂存围栏”为美洲大生物交流做好了准备。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"Tseng ZJ, Kahn LX, Pacheco-Castro A et al.\",\"abstract\":\"The movement of taxa between North and South America across the Panamanian land bridge, known as the Great American Biotic Interchange (GABI), established modern-day mammal assemblages in the Americas, heralding the decisive end of what has been called the \\\"splendid isolation\\\" of the South American fauna. Lacking substantive low-latitude records, previous work on this pattern relied on South American and temperate North American fossils to conclude that pulsed interchanges began about 2.8 millio\",\"doi\":\"10.1126/science.aef2893\",\"url\":\"https://doi.org/10.1126/science.aef2893\",\"pmid\":\"42531382\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析低纬度化石记录，在探讨巴拿马陆桥形成前南北美洲哺乳动物交流的基础上，发现约一千万年前存在一个生物地理学“暂存围栏”，为美洲大生物交流做好了准备。该研究获得了对交流启动时间与过程的新认识，为理解南美动物区系“辉煌隔离”的终结及现代哺乳动物组合的建立提供了相关研究价值。\"},{\"title\":\"Beyond the scales: Marine archaeogenomics for the conservation and restoration of fisheries.\",\"title_cn\":\"超越尺度：海洋古基因组学在渔业保护与恢复中的应用\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-30\",\"authors\":\"Atmore LM, Star B\",\"abstract\":\"Protection and restoration of marine environments are essential for food security and climate change mitigation. Yet historical and archaeological research have shown that conservation and management often rely on arbitrary ecological baselines in ecosystems already shaped by long-term human impacts. Archaeogenomics, the combination of ancient DNA (aDNA) and whole-genome sequencing, provides invaluable insights into these impacts. Recent improvements in laboratory and computational techniques en\",\"doi\":\"10.1126/science.aeg0333\",\"url\":\"https://doi.org/10.1126/science.aeg0333\",\"pmid\":\"42531380\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过综述海洋古基因组学方法，在历史渔业生态受长期人类影响的基础上，验证了古代DNA与全基因组测序结合可揭示物种对捕捞的响应及种群动态，获得了超越现代生态基线的历史变迁认知，为渔业保护与恢复策略的制定提供了科学参考价值。\"},{\"title\":\"Birdsong diversity across the world.\",\"title_cn\":\"全球鸟类鸣声多样性。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-23\",\"authors\":\"Briefer EF\",\"abstract\":\"Birdsong motifs are shaped by evolutionary history, biological traits, and environmental constraints.\",\"doi\":\"10.1126/science.aej0087\",\"url\":\"https://doi.org/10.1126/science.aej0087\",\"pmid\":\"42490503\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过整合进化历史、生物学特征与环境约束的多维度分析，在全球鸟类鸣声多样性的基础上，验证了鸣声主题模式受上述因素共同塑造的结论，获得了关于鸣声多样性形成机制的相应研究进展，为理解鸟类声学信号演化及相关研究提供了参考价值。\"},{\"title\":\"The global biogeography of passerine songs.\",\"title_cn\":\"雀形目鸟类鸣唱的全球生物地理格局。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-23\",\"authors\":\"Bacquelé Q, Barnagaud JY, Violle C et al.\",\"abstract\":\"Although bird songs are classic models for understanding the evolution of vocal communication, their global diversity has long made the development of a unifying framework challenging. By analyzing the acoustic architecture of songs from more than 3000 passerine species worldwide, we show that this acoustic space can be structured around eight elemental motifs. The differential use of these motifs is driven by a combination of species' biological traits (social organization, morphology, and mati\",\"doi\":\"10.1126/science.aee6239\",\"url\":\"https://doi.org/10.1126/science.aee6239\",\"pmid\":\"42490479\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析全球3000余种雀形目鸟类的鸣唱声学结构，在相关研究对象的基础上，发现其声学空间可围绕八种基本母题构建，且这些母题的使用差异受物种生物学特征（如社会组织、形态和交配系统）组合驱动，获得了相应研究进展，为理解鸣唱演化的统一框架提供了相关研究价值。\"},{\"title\":\"Performance trade-offs define a fundamental dental dichotomy in mammals.\",\"title_cn\":\"性能权衡定义了哺乳动物牙齿的一个基本二分法。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-16\",\"authors\":\"Chatar N, Vankelst M, Pérez-Ramos A et al.\",\"abstract\":\"Teeth define mammalian evolution, and one of many adaptive dental breakthroughs in crown mammals is the tribosphenic molar: a tooth with a dual shearing-crushing function, often considered a key adaptation in crown mammals. However, we do not know how potential trade-offs between these antagonistic functions may influence the macroevolutionary outcomes of mammalian lineages. Here, we show that predatory mammals evolved dichotomized performance in their tribosphenic carnassial teeth, with slicing\",\"doi\":\"10.1126/science.aee3453\",\"url\":\"https://doi.org/10.1126/science.aee3453\",\"pmid\":\"42462039\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析哺乳动物裂齿的形态与功能关系，在三角座磨牙双剪切-压碎功能的基础上，发现捕食性哺乳动物在裂齿上演化出分离的性能表现，其中切割功能占据主导，验证了性能权衡构成哺乳动物牙齿基本二分法的假说，获得了关于牙齿功能演化限制的相应研究进展，为理解哺乳动物适应性辐射提供了相关价值。\"},{\"title\":\"As bird flu threatens, New Zealand vaccinates endangered birds.\",\"title_cn\":\"禽流感威胁下，新西兰为濒危鸟类接种疫苗。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-07-09\",\"authors\":\"Larson C\",\"abstract\":\"Arrival of H5N1 virus on Australian mainland triggers ambitious vaccination program.\",\"doi\":\"10.1126/science.aek3889\",\"url\":\"https://doi.org/10.1126/science.aek3889\",\"pmid\":\"42424466\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队基于H5N1病毒抵达澳大利亚大陆的威胁，报道了新西兰为濒危鸟类启动疫苗接种计划的相关进展，验证了针对禽流感的预防性保护措施，为降低濒危鸟类感染风险提供了相应研究价值。\"},{\"title\":\"Innate factors and ontogeny determine nonbreeding areas of migrant songbirds.\",\"title_cn\":\"先天因素和个体发育决定迁徙鸣禽的非繁殖区域。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-25\",\"authors\":\"Lamers KP, Ouwehand J, Ubels R et al.\",\"abstract\":\"Migratory birds connect ecosystems worldwide and often show connectivity between breeding and nonbreeding areas, meaning that individuals have nonbreeding (\\\"wintering\\\") locations close to others from the same breeding population. Although much work has characterized migration routes, we know little about what determines nonbreeding areas. We tracked pied flycatchers (\",\"doi\":\"10.1126/science.ads0532\",\"url\":\"https://doi.org/10.1126/science.ads0532\",\"pmid\":\"42348687\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过追踪斑姬鹟的迁徙行为，在先天因素与个体发育影响的基础上，发现非繁殖区域由内在因素及成长经历共同决定，而非随机选择，获得了关于迁徙鸣禽空间分布成因的进展，为理解候鸟种群连接机制提供了相关研究价值。\"},{\"title\":\"Lamprey 3D single-cell transcriptomics reveals ancestral and specialized features of the vertebrate brain.\",\"title_cn\":\"七鳃鳗三维单细胞转录组学揭示脊椎动物大脑的祖先性和特化特征。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Wu H, Chen D, Li J et al.\",\"abstract\":\"The lamprey occupies a pivotal position for elucidating vertebrate brain evolution. Using spatial transcriptomics and single-nucleus RNA sequencing, we generated a three-dimensional molecular atlas of the lamprey brain, identifying 209 distinct cell clusters across 14 regions. Cross-species comparisons revealed broad conservation of regional spatial architecture, defining an ancestral organizational blueprint. Within this conserved framework, however, marked lineage-specific divergence emerged. \",\"doi\":\"10.1126/science.aea2535\",\"url\":\"https://doi.org/10.1126/science.aea2535\",\"pmid\":\"42313957\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过空间转录组学与单核RNA测序技术，在七鳃鳗大脑三维分子图谱的基础上，鉴定出14个脑区的209个细胞簇，验证了脊椎动物脑区空间结构的广泛保守性，并揭示了谱系特异性分化特征，获得了脊椎动物大脑祖先蓝图的相关研究进展，为理解大脑进化机制提供了参考价值。\"},{\"title\":\"Tracking the roots of zoonoses.\",\"title_cn\":\"追踪人畜共患病的根源。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Key FM\",\"abstract\":\"Ancient pathogen DNA from animals elucidates the origin and evolution of infectious diseases.\",\"doi\":\"10.1126/science.aef0941\",\"url\":\"https://doi.org/10.1126/science.aef0941\",\"pmid\":\"42313956\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析古代动物病原体DNA，在追踪人畜共患病起源与演化的基础上，验证了相关病原体的历史传播路径，获得了相应研究进展，为理解传染病根源及防控策略提供了参考价值。\"},{\"title\":\"Changes in wildlife activity patterns in response to war in Ukraine.\",\"title_cn\":\"乌克兰战争对野生动物活动模式变化的影响\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-18\",\"authors\":\"Kudrenko S, Bischof R, Zedrosser A et al.\",\"abstract\":\"Conflict zones are inherently hazardous and inaccessible for researchers, which results in a knowledge gap about the immediate effects of armed conflicts on the environment, particularly wildlife. We used camera-trap detections to investigate the impact of armed conflict on wildlife activity patterns before, during, and after the Russian occupation of the Chornobyl Exclusion Zone (Ukraine) in 2022 and compared it to the same period in 2021. Mammal species responded to armed conflict through imme\",\"doi\":\"10.1126/science.aed1493\",\"url\":\"https://doi.org/10.1126/science.aed1493\",\"pmid\":\"42313953\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过相机陷阱监测数据，在2021年与2022年俄罗斯占领乌克兰切尔诺贝利禁区期间及前后的对比基础上，发现哺乳动物物种对武装冲突产生了即时响应，其活动模式在冲突期间发生改变，获得了关于冲突对野生动物直接影响的研究进展，为理解武装冲突环境下野生动物行为响应提供了相关价值。\"},{\"title\":\"Threatened 'rolling stone reefs' are surprisingly diverse.\",\"title_cn\":\"受威胁的“滚动石礁”生物多样性惊人。\",\"title_cn_summary\":\"\",\"journal\":\"Science\",\"date\":\"2026-06-04\",\"authors\":\"Moutinho S\",\"abstract\":\"DNA study reveals hidden biodiversity off Brazil-and raises alarm over oil exploration.\",\"doi\":\"10.1126/science.aej3866\",\"url\":\"https://doi.org/10.1126/science.aej3866\",\"pmid\":\"42241541\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过DNA研究，在巴西近海“滚动石礁”相关研究对象的基础上，发现其隐藏生物多样性惊人，并警示石油勘探带来的威胁，获得了相应研究进展，为相关海洋生态保护提供了参考价值。\"},{\"title\":\"A kinematic convergence in ape and monkey vertical climbing informs debates on early hominin arborealism.\",\"title_cn\":\"猿猴垂直攀爬中的运动学趋同，为早期人类树栖生活的争论提供了启示。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-09-01\",\"authors\":\"Fannin LD, Pape C, McGraw WS\",\"abstract\":\"Recent debates on early hominin arborealism center around interpretations of fossilized foot bones as being either \\\"African ape\\\"- or \\\"monkey\\\"- like in their morphology. These dueling interpretations fuel competing locomotor reconstructions of the last common ancestor of chimpanzees and humans (LCA), including disagreements about the prevalence of vertical climbing behaviors. Yet it remains unclear if possessing an ape- or monkey-like foot impacts the safety and efficiency of climbing, in part be\",\"doi\":\"10.1073/pnas.2608183123\",\"url\":\"https://doi.org/10.1073/pnas.2608183123\",\"pmid\":\"42607191\",\"category\":\"behavior\",\"ai_summary\":\"该研究团队通过运动学分析，在猿猴垂直攀爬行为的基础上，发现猿与猴在攀爬运动模式上存在趋同现象，获得了关于早期人类树栖生活争论的相应研究进展，为理解黑猩猩与人类共同祖先的攀爬行为及相关化石足骨形态解读提供了参考价值。\"},{\"title\":\"Decision rules diverge between sympatric Featherfin cichlids despite shared preferences, ecology, and evolutionary history.\",\"title_cn\":\"尽管共享偏好、生态和进化历史，同域分布的羽鳍丽鱼科鱼类的决策规则仍存在分歧。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Tomasek M, Dunster B, Goverts Z et al.\",\"abstract\":\"It has been hypothesized that divergence in animal decision processes can be attributed to differences in information processing mechanisms. However, the required comparative tests of this idea are hindered by ecological, perceptual, or motivational divergence among species that confound a direct analysis of decision processes. To overcome these limitations, we study two closely related, sympatric cichlid fishes (\",\"doi\":\"10.1073/pnas.2620602123\",\"url\":\"https://doi.org/10.1073/pnas.2620602123\",\"pmid\":\"42584995\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过比较两种同域分布、亲缘关系密切且共享偏好、生态与进化历史的羽鳍丽鱼科鱼类，在控制生态、感知和动机差异的基础上，验证了动物决策过程的分歧可归因于信息处理机制的差异，发现尽管偏好一致，其决策规则仍存在分歧，获得了相应研究进展，为理解决策过程演化机制提供了相关价值。\"},{\"title\":\"How illegal wildlife trade adheres to and defies conventional market behavior.\",\"title_cn\":\"非法野生动物贸易如何遵循并违背常规市场行为。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Midgette G, Gore ML\",\"abstract\":\"Illegal wildlife markets comprise a complex global economy generating criminal profits while harming biodiversity and livelihoods. The negative externalities from biodiversity loss, ecosystem destabilization, and zoonotic disease risk may be orders of magnitude larger than the multibillion dollar annual total market value. Despite decades of international policy attention, fundamental economic characteristics of these markets remain poorly understood. We suggest distinguishing three categories o\",\"doi\":\"10.1073/pnas.2525056123\",\"url\":\"https://doi.org/10.1073/pnas.2525056123\",\"pmid\":\"42574631\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析非法野生动物市场的经济特征，在常规市场行为理论的基础上，发现该贸易既遵循又违背传统市场规律，并建议区分三类市场范畴。研究获得相应进展，为理解此类市场的复杂经济运作及制定针对性政策提供了相关价值。\"},{\"title\":\"Many-eyes and sentinels in selfish and cooperative groups.\",\"title_cn\":\"自私与协作群体中的多眼与哨兵机制。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-18\",\"authors\":\"Pilgrim C, Bate AM, Sigalou A et al.\",\"abstract\":\"Collective vigilance describes how animals in groups benefit from the predator detection efforts of others. Empirical observations typically find either a many-eyes strategy with all (or many) group members maintaining a low level of individual vigilance, or a sentinel strategy with one (or a few) individuals maintaining a high level of individual vigilance while others do not. With an analytical treatment that makes minimal assumptions, we show that these two strategies are alternative solution\",\"doi\":\"10.1073/pnas.2536017123\",\"url\":\"https://doi.org/10.1073/pnas.2536017123\",\"pmid\":\"42574625\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过解析建模方法，在群体捕食者探测的集体警觉研究基础上，发现多眼策略与哨兵策略是自私与协作群体中的替代性解决方案，获得了相应研究进展，为理解群体警觉策略的演化条件提供了理论价值。\"},{\"title\":\"Pair living emerged early in placental mammals.\",\"title_cn\":\"胎盘哺乳动物早期便出现了成对生活。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Walmsley SF, Olivier CA, Jaeggi AV et al.\",\"abstract\":\"It is widely assumed that the first placental mammals were solitary. Here, we tested this assumption and which ecological and life history factors are related to mammalian social organization. We compiled a comprehensive database by reviewing over 14,000 primary peer-reviewed publications on the social organization of the 5,390 extant placental mammal species. We found empirical data for 726 species across 1,473 populations: 353 populations were primarily solitary, 250 populations pair living, a\",\"doi\":\"10.1073/pnas.2528458123\",\"url\":\"https://doi.org/10.1073/pnas.2528458123\",\"pmid\":\"42520129\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过系统梳理超过14,000篇同行评审文献，在涵盖5,390种现存胎盘哺乳动物中获取726种、1,473个种群的实证数据的基础上，发现成对生活的种群数量远超预期，验证了胎盘哺乳动物早期便已出现成对生活，而非如传统假设般最初为独居生活，获得了关于哺乳动物社会组织演化的重要进展，为理解相关生态与生活史因素的关联提供了参考价值。\"},{\"title\":\"Sprint-like cardiac dynamics support repeated acrobatic lunges in foraging rorqual whales.\",\"title_cn\":\"冲刺式心脏动力学支持须鲸觅食时重复的杂技式冲刺捕食。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Blawas AM, Fahlbusch J, Barkowski J et al.\",\"abstract\":\"The dive response decreases heart rate, regulates blood flow distribution, conserves oxygen, and extends dive duration. In diving animals, dive heart rate can be modulated to meet increased demands of exercise during foraging. However, lunge-feeding rorquals represent an extreme example of exercise under breath-hold conditions: Though most of their dive time is spent gliding and filtering, lunges require high-power, acrobatic sprints to engulf massive volumes of prey-laden water. Our biologging \",\"doi\":\"10.1073/pnas.2613082123\",\"url\":\"https://doi.org/10.1073/pnas.2613082123\",\"pmid\":\"42507932\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过生物记录方法，在须鲸觅食时重复冲刺式捕食行为的基础上，发现其心脏动力学呈现类似冲刺的调节模式，以支持高耗能的杂技式冲刺动作，获得了相应研究进展，为理解潜水动物运动与氧气保存的平衡机制提供了相关价值。\"},{\"title\":\"Dominant functional group explains global bird diversity responses to farmland abandonment.\",\"title_cn\":\"优势功能群解释了全球鸟类多样性对农田弃耕的响应。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-08-04\",\"authors\":\"Kitazawa M, Yamaura Y, Kawamura K et al.\",\"abstract\":\"Reversing biodiversity declines will require redesigning agricultural landscapes and their management. Farmland abandonment and intensification are emerging as major drivers of biodiversity changes, and their consequences vary widely from negative to positive among continents. Despite decades of research on agricultural biodiversity, no generalizable framework has been established to predict these variations globally, hindering the development of effective conservation strategies. Here, we combi\",\"doi\":\"10.1073/pnas.2530120123\",\"url\":\"https://doi.org/10.1073/pnas.2530120123\",\"pmid\":\"42507928\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过综合分析全球数据，在农田弃耕对鸟类多样性影响的研究基础上，发现优势功能群是解释全球鸟类多样性响应差异的关键因素，获得了相应研究进展，为制定有效的农业景观生物多样性保护策略提供了科学价值。\"},{\"title\":\"Echolocating bats sacrifice binaural localization cues for target-focused hearing during high-speed foraging.\",\"title_cn\":\"回声定位蝙蝠在高速觅食时牺牲双耳定位线索以聚焦目标听觉。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-28\",\"authors\":\"Häfele FT, Wisniewska DM, Vesterholm KK et al.\",\"abstract\":\"Accurate sound localization is critical to navigation and foraging in echolocating animals. During both passive listening and active echolocation, bats are thought to rely solely on interaural level differences (ILDs) between the two ears, attaining very large ILDs by orienting their outer ears apart. However, detecting weak prey echoes during high-speed foraging should instead favor target-focused pinnae that maximize sonar range and reduce clutter interference. Therefore, we propose that flyin\",\"doi\":\"10.1073/pnas.2605701123\",\"url\":\"https://doi.org/10.1073/pnas.2605701123\",\"pmid\":\"42475565\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析高速觅食时的听觉行为，在回声定位蝙蝠依赖双耳声级差定位线索的基础上，发现其会牺牲双耳定位线索以聚焦目标听觉，验证了定向耳廓在增强声呐探测和减少干扰中的优势，获得了相应研究进展，为理解蝙蝠高速捕食中的听觉策略提供了相关研究价值。\"},{\"title\":\"Human and animal morbillivirus strains causing chronic neurological infections share key genotypic and phenotypic traits.\",\"title_cn\":\"引起慢性神经系统感染的人类和动物麻疹病毒属毒株共享关键基因型和表型特征。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-14\",\"authors\":\"Daniel Roji M, Geiselhardt F, Beythien G et al.\",\"abstract\":\"Long-term persistent measles virus (MeV) infection of the central nervous system (CNS) can result in subacute sclerosing panencephalitis (SSPE), an invariably fatal late neurological complication of measles. Analogous SSPE-like chronic diseases have also been reported in adult dogs, cetaceans, and more recently harbor seals following infection by canine distemper virus (CDV), dolphin morbillivirus (DMV), and phocine distemper virus (PDV), respectively. Here, we characterize different animal morb\",\"doi\":\"10.1073/pnas.2604205123\",\"url\":\"https://doi.org/10.1073/pnas.2604205123\",\"pmid\":\"42412932\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过比较分析，在人类麻疹病毒与动物麻疹病毒属毒株引起慢性神经系统感染的基础上，发现这些毒株共享关键基因型和表型特征，获得了相应研究进展，为理解相关慢性神经疾病的发病机制提供了价值。\"},{\"title\":\"A transcription factor modulates dermal architecture to generate structural and pigment color diversity in lizards.\",\"title_cn\":\"一种转录因子通过调节皮肤结构，在蜥蜴中产生结构和色素颜色的多样性。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Aguilar P, Andrade P, Brejcha J et al.\",\"abstract\":\"The way organisms perceive the world influences their evolution. Many animals detect ultraviolet (UV) light invisible to humans, creating sensory contexts that alter the selective landscape for coloration. Here, we dissected the molecular basis of a UV-reflecting color morph in common wall lizards, uncovering its association with a noncoding region upstream of the transcription factor\",\"doi\":\"10.1073/pnas.2604532123\",\"url\":\"https://doi.org/10.1073/pnas.2604532123\",\"pmid\":\"42384684\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过剖析普通壁蜥中一种反射紫外光色型的分子基础，在转录因子上游非编码区关联研究的基础上，发现该区域调控皮肤结构以产生结构和色素颜色多样性，获得了相应研究进展，为理解动物颜色进化与感官环境的关系提供了相关研究价值。\"},{\"title\":\"Monitoring major biodiversity stronghold in war zones: Model predicts Lake Chad remains Africa's most important wetland for waterbirds.\",\"title_cn\":\"战乱地区主要生物多样性堡垒监测：模型预测乍得湖仍是非洲最重要的水鸟湿地。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Defos du Rau P, Godeau U, Carenton N et al.\",\"abstract\":\"Lake Chad is both one of the largest transboundary wetlands in Africa and a major biodiversity hotspot. As such, Lake Chad would require sound and long-term biodiversity monitoring, but it is also a war zone. Using several mitigation measures, we succeeded in surveying a major part of it in 2022 to estimate the abundance of wildlife. This study marked the first comprehensive population estimates for some species. Compared to previous total count approaches, we introduced an aerial distance sampl\",\"doi\":\"10.1073/pnas.2603538123\",\"url\":\"https://doi.org/10.1073/pnas.2603538123\",\"pmid\":\"42378274\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过空中距离采样等缓解措施，在2022年对乍得湖大部分区域进行野生动物丰度调查，首次为部分物种提供了全面种群估计。基于此，模型预测乍得湖仍是非洲最重要的水鸟湿地，获得了战乱地区生物多样性监测的相应研究进展，为冲突区域生态保护策略提供了相关研究价值。\"},{\"title\":\"Natural history on canvas: Brueghel knew about bird-eating noctule bats.\",\"title_cn\":\"画布上的自然史：勃鲁盖尔了解食鸟夜蝠。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Romero-Vidal P, Sánchez-Navarro S, Tena E et al.\",\"abstract\":\"A recent study has provided the first direct evidence that the greater noctule bat (\",\"doi\":\"10.1073/pnas.2536525123\",\"url\":\"https://doi.org/10.1073/pnas.2536525123\",\"pmid\":\"42372166\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析勃鲁盖尔画作中的细节，在相关研究对象的基础上，验证了画作描绘了食鸟夜蝠捕食鸟类的行为，获得了关于该蝙蝠自然史早期记录的相应研究进展，为理解历史时期物种生态行为的相关研究提供了参考价值。\"},{\"title\":\"Genomic and structural evidence of SARS-CoV-2 and MERS-CoV in migratory birds.\",\"title_cn\":\"迁徙鸟类中SARS-CoV-2和MERS-CoV的基因组及结构证据。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Cao J, Liu S, Su C et al.\",\"abstract\":\"Migratory birds are the natural reservoir of influenza A virus (IAV), but their role as a carrier of SARS-CoV-2 remains unclear. Here, we report the identification of three almost full-length viral genome sequences of SARS-CoV-2 variants of concern (VOCs) in Tundra swans. These sequences are named hCoV-19/Tundra swan/Jiangxi/IMCAS_M1/2021 (IMCAS_M1), hCoV-19/Tundra swan/Jiangxi /IMCAS_M2/2021 (IMCAS_M2), and hCoV-19/Tundra swan/Jiangxi/IMCAS_M3/2021 (IMCAS_M3). IMCAS_M1 and IMCAS_M3 have the sam\",\"doi\":\"10.1073/pnas.2400023123\",\"url\":\"https://doi.org/10.1073/pnas.2400023123\",\"pmid\":\"42372155\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过基因组与结构分析，在迁徙鸟类（苔原天鹅）中鉴定出三株近乎全长的SARS-CoV-2关切变异株基因组序列，并发现其中两株序列一致，同时获得MERS-CoV的相关基因组证据。该发现为理解迁徙鸟类在冠状病毒传播中的潜在作用提供了相应研究进展，为相关生态监测与风险评估提供了参考价值。\"},{\"title\":\"Neural tissues and chondrostean traits in a Carboniferous actinopterygian.\",\"title_cn\":\"石炭纪辐鳍鱼中的神经组织和软骨硬鳞鱼特征。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Caron AM, Tietjen K, Coates MI\",\"abstract\":\"Ray-finned fishes (Actinopterygii) represent over half of extant vertebrate species, but their early evolutionary history is largely unresolved. Current phylogenetic estimates, corroborated by discoveries of preserved neural tissues, place most Palaeozoic actinopterygians outside the crown group and leave the deep roots of major extant divisions depauperate. Moreover, apparent fossil brains in early fishes are minuscule relative to endocranial chamber space, implying that endocasts are poor indi\",\"doi\":\"10.1073/pnas.2610438123\",\"url\":\"https://doi.org/10.1073/pnas.2610438123\",\"pmid\":\"42372151\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析石炭纪辐鳍鱼化石中的神经组织保存证据，在早期辐鳍鱼系统发育关系的基础上，验证了多数古生代辐鳍鱼位于冠群之外的观点，并发现其脑部化石相对于颅腔空间极小，获得相应研究进展，为理解现存主要辐鳍鱼类群的深层演化根源提供了相关研究价值。\"},{\"title\":\"A general framework for predicting the ecological effects of range expansions in marine systems.\",\"title_cn\":\"预测海洋系统中范围扩张生态效应的通用框架。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-07-07\",\"authors\":\"Beshai RA, Sorte CJB\",\"abstract\":\"Warming global temperatures are driving species to shift beyond their historical geographic ranges into novel, expanded ranges, where they may have both positive and negative effects on recipient populations. Although no framework currently exists to anticipate these effects, invasion biology theory suggests expanders' effects may be predictable from expanders' historical roles and trophic positions. We conducted a global synthesis of over 1,200 population-level effects of marine range-expanding\",\"doi\":\"10.1073/pnas.2600491123\",\"url\":\"https://doi.org/10.1073/pnas.2600491123\",\"pmid\":\"42372141\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过全球综合分析方法，在汇总超过1200个海洋范围扩张种群效应数据的基础上，验证了扩张物种的历史角色与营养位置可预测其对接收种群的正负生态效应，获得了构建预测海洋范围扩张生态效应通用框架的研究进展，为评估气候驱动物种迁移的生态后果提供了理论依据。\"},{\"title\":\"Unique fingerprint of marine ectotherm body size change during hyperthermal crises.\",\"title_cn\":\"海洋变温动物体型在高热危机期间变化的独特指纹。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Nätscher PS, De Baets K, Kiessling W\",\"abstract\":\"The term \\\"Lilliput Effect\\\" describes a substantial decrease in the average body size of fossil assemblages during major environmental perturbations in Earth's history, which is reported in many paleontological studies. The limited regional, temporal and taxonomic focus of most studies, however, has sparked discussions concerning its generality. Additionally, even though a negative relationship between warming and body size has been established in recent marine ectotherms, the environmental and m\",\"doi\":\"10.1073/pnas.2505564123\",\"url\":\"https://doi.org/10.1073/pnas.2505564123\",\"pmid\":\"42335231\",\"category\":\"paleontology\",\"ai_summary\":\"该研究团队通过分析海洋变温动物化石记录，在探讨“利利普特效应”普遍性的基础上，发现体型变化在高热危机期间呈现独特指纹，获得了相应研究进展，为理解变温动物对气候危机的响应提供了相关价值。\"},{\"title\":\"Physiology is a hidden dimension of diversity in the radiation of woodland salamanders.\",\"title_cn\":\"生理学是林地蝾螈辐射分化中一个隐藏的多样性维度。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Alomar NM, Camarillo H, Burress ED et al.\",\"abstract\":\"Morphological evolution can be explosive, producing visually spectacular adaptive radiations like Caribbean anoles, Malagasy vangas, and African Rift Lake cichlids. Yet morphological stasis, the long-term retention of a conserved body plan, is often observed across evolutionary radiations. Woodland salamanders (\",\"doi\":\"10.1073/pnas.2523895123\",\"url\":\"https://doi.org/10.1073/pnas.2523895123\",\"pmid\":\"42330273\",\"category\":\"evolution\",\"ai_summary\":\"该研究团队通过比较分析，在林地蝾螈辐射分化中形态趋同保守的研究基础上，发现生理特征（如代谢率等）存在显著且多样的分化，验证了生理学是这一辐射中隐藏的多样性维度，获得了相应研究进展，为理解形态停滞类群中多样性的产生机制提供了相关研究的价值。\"},{\"title\":\"Horseshoe bats foraging in the wild adjust sensing to separate prey echoes from background clutter.\",\"title_cn\":\"野生菊头蝠在觅食时调整感知以将猎物回声与背景杂波分离。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Yovel Y, Stidsholt L, Mimran Y et al.\",\"abstract\":\"How animals handle immense incoming sensory information and regulate sensing is difficult to study under natural conditions. Using miniature GPS tags with microphones we monitored the sensing of freely foraging greater horseshoe bats. Bats stayed in acoustic contact with the environment and caught insects while commuting and in short flights from a perch. Bats adjusted their call frequency to maintain the highest-frequency echoes from background in a forward-directed, spatially limited sector at\",\"doi\":\"10.1073/pnas.2525520123\",\"url\":\"https://doi.org/10.1073/pnas.2525520123\",\"pmid\":\"42330269\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过微型GPS与麦克风标签监测野生大菊头蝠的自由觅食行为，在飞行及栖息短距捕食过程中，发现蝙蝠通过调整发声频率，将背景最高频回声维持在前向受限空间扇区内，从而分离猎物回声与背景杂波，验证了其动态感知调节机制，为理解动物在自然条件下处理复杂感官信息提供了相关研究价值。\"},{\"title\":\"Allopatric coevolution: Migratory predators may facilitate mimicry between geographically nonoverlapping species.\",\"title_cn\":\"异域共演化：迁徙捕食者可能促进地理上不重叠物种之间的拟态。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-30\",\"authors\":\"Topper A, Ben-Oren Y, Kolodny O\",\"abstract\":\"A natural assumption in evolutionary biology is that to coevolve, species must interact with each other and should therefore co-occur. However, many evolutionary dynamics may be mediated by migratory or vector-borne agents, raising the possibility of coevolutionary interactions between allopatric species. In mimicry theory, a recurring assumption is that all species participating in a mimicry system must be sympatric, because predators must encounter both model and mimic/co-mimic to confuse betw\",\"doi\":\"10.1073/pnas.2527304123\",\"url\":\"https://doi.org/10.1073/pnas.2527304123\",\"pmid\":\"42313983\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过理论分析，在异域物种间可能通过迁徙捕食者产生间接相互作用的基础上，验证了地理上不重叠的物种之间可发生拟态共演化，获得了相应研究进展，为理解迁徙介导的演化动态提供了相关价值。\"},{\"title\":\"Dark diversity framework reconciles Darwin's naturalization conundrum for freshwater fish invasions.\",\"title_cn\":\"暗多样性框架调和了达尔文归化难题在淡水鱼类入侵中的应用。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Zhang WG, Xu M, Fan SY et al.\",\"abstract\":\"The spread of invasive species poses a major threat to global biodiversity, yet predicting successful establishment of exotic species in novel environments remains challenging. Darwin's naturalization conundrum is a longstanding debate over whether exotic species closely or distantly related to native communities are more likely to succeed. Despite its long history, empirical studies continue to yield conflicting evidence. Here, we introduce the dark diversity concept, which refers to species th\",\"doi\":\"10.1073/pnas.2604929123\",\"url\":\"https://doi.org/10.1073/pnas.2604929123\",\"pmid\":\"42268899\",\"category\":\"conservation\",\"ai_summary\":\"该研究团队通过引入暗多样性框架，在淡水鱼类入侵的达尔文归化难题基础上，验证了外来物种与本地群落亲缘关系对其成功建群的影响，获得了调和长期争议的相应研究进展，为预测入侵物种建立成功率及生物多样性保护提供了相关研究价值。\"},{\"title\":\"Integrating trophic importance into conservation of terrestrial vertebrates.\",\"title_cn\":\"将营养重要性纳入陆生脊椎动物的保护中。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Hao X, Holyoak M, Zhang Z et al.\",\"abstract\":\"There is global consensus on the need to prioritize conservation efforts to prevent biodiversity loss and defaunation. Most current conservation initiatives focus on areas with high species diversity or many threatened species, treating species independently and neglecting trophic interactions. To address these oversights, we developed a framework to quantify species' roles along continuums of trophic importance (TI) and global endangerment (GE), estimated from a global terrestrial meta-food web\",\"doi\":\"10.1073/pnas.2605237123\",\"url\":\"https://doi.org/10.1073/pnas.2605237123\",\"pmid\":\"42263132\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过构建全球陆地meta食物网框架，在量化物种营养重要性（TI）与全球濒危程度（GE）连续谱的基础上，发现将营养相互作用纳入保护优先级评估可更全面识别关键物种，获得了整合营养角色于陆生脊椎动物保护决策的相应研究进展，为优化生物多样性保护策略提供了相关价值。\"},{\"title\":\"Memory, chaos, and noise in ecological forecasting.\",\"title_cn\":\"生态预测中的记忆、混沌与噪声。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-09\",\"authors\":\"Munch SB, Rogers TL\",\"abstract\":\"Ecological populations fluctuate for reasons that are often ascribed-separately-to historical legacies, intrinsic nonlinear dynamics, or stochastic noise. Yet these forces rarely act in isolation. We assembled a global database of 302 abundance time series spanning birds, mammals, fishes, insects, and plankton to ask how memory, nonlinearity, and dynamical stability interact to shape predictability. We used empirical dynamic modeling to estimate the memory length and classified time series stabi\",\"doi\":\"10.1073/pnas.2604256123\",\"url\":\"https://doi.org/10.1073/pnas.2604256123\",\"pmid\":\"42224580\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过实证动态建模方法，在分析全球302个鸟类、哺乳动物、鱼类、昆虫及浮游生物丰度时间序列数据的基础上，发现记忆长度、非线性动力学与随机噪声共同作用塑造了生态预测的可预测性，获得了关于生态预测中记忆、混沌与噪声相互作用机制的研究进展，为理解生态种群波动的预测局限性提供了相关研究价值。\"},{\"title\":\"Female dolphins use individual vocal labels to track coercive males.\",\"title_cn\":\"雌性海豚使用个体声音标签来追踪胁迫性雄性。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-16\",\"authors\":\"Bouchard A, Allen SJ, Sørensen PM et al.\",\"abstract\":\"Animals rely on identity signaling to navigate social relationships, assess potential mates, and avoid costly interactions. While species- and group-level recognition signals can provide fitness advantages by preventing inbreeding depression and hybridization, our understanding of the role that individual identity signals can play in mate choice is notably lacking. In species with coercive mating systems, females must carefully evaluate male behavior to minimize risks while also maximizing repro\",\"doi\":\"10.1073/pnas.2531602123\",\"url\":\"https://doi.org/10.1073/pnas.2531602123\",\"pmid\":\"42224502\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析雌性海豚的声音信号行为，在个体身份识别信号与配偶选择关系的研究基础上，发现雌性海豚能够利用个体声音标签追踪具有胁迫性的雄性，从而在强制性交配系统中评估雄性行为以降低风险并优化繁殖收益，获得了关于个体身份信号在配偶选择中作用的研究进展，为理解动物社会互动中的身份识别机制提供了相关价值。\"},{\"title\":\"Arctic ecosystems shaped mammalian dispersal and diversification before the Cretaceous-Paleogene mass extinction.\",\"title_cn\":\"北极生态系统在白垩纪-古近纪大灭绝前塑造了哺乳动物的扩散与多样化。\",\"title_cn_summary\":\"\",\"journal\":\"Proc Natl Acad Sci U S A\",\"date\":\"2026-06-02\",\"authors\":\"Shelley SL, Eberle JJ, Erickson GM et al.\",\"abstract\":\"High-latitude terrestrial ecosystems are commonly viewed as marginal environments to deep-time evolutionary innovation, yet their role in shaping biotic dispersal, diversification, and survivorship remains poorly understood. The Upper Cretaceous Prince Creek Formation of northern Alaska (paleolatitude ~80-85°N) yields the most northerly known Mesozoic mammals and provides a rare opportunity to examine the ecological and biogeographic roles of polar terrestrial ecosystems. Here, we describe three\",\"doi\":\"10.1073/pnas.2601794123\",\"url\":\"https://doi.org/10.1073/pnas.2601794123\",\"pmid\":\"42150091\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析阿拉斯加北部白垩纪晚期王子溪组（古纬度约80-85°N）的化石材料，在已知最北的中生代哺乳动物记录基础上，描述了三种相关研究对象，验证了北极高纬度陆地生态系统在白垩纪-古近纪大灭绝前对哺乳动物扩散与多样化具有塑造作用，获得了相应研究进展，为理解极地生态系统在深时生物演化中的生态与生物地理角色提供了相关研究价值。\"},{\"title\":\"Language-like statistical structure arises in learned signaling: evidence from birdsong.\",\"title_cn\":\"语言类统计结构在学习信号中出现：来自鸟类鸣叫的证据。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-08-07\",\"authors\":\"Kirby S, Okanoya K, Garland EC et al.\",\"abstract\":\"All languages have statistically coherent subsequences (e.g., words) whose frequency distribution follows a power law. These properties facilitate language learning in humans, making them good candidates for arising through cultural transmission as a way to help faithful transmission across generations. Recently, both properties were found in whale song, which is also culturally transmitted, leading to the strong prediction that they should be found wherever complex sequential signaling is cultu\",\"doi\":\"10.1126/sciadv.aea3015\",\"url\":\"https://doi.org/10.1126/sciadv.aea3015\",\"pmid\":\"42566530\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析鸟类鸣叫的学习信号，在文化传播研究的基础上，验证了语言类统计结构（如词频幂律分布）在非人类物种中的出现，获得了相应研究进展，为理解语言特征经由文化演化形成的普遍机制提供了相关研究价值。\"},{\"title\":\"Global patterns and drivers of extinction risk in island endemic terrestrial vertebrates.\",\"title_cn\":\"岛屿特有陆生脊椎动物灭绝风险的全球格局与驱动因素\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-08-07\",\"authors\":\"Zhang Y, Wang J, Li Y et al.\",\"abstract\":\"Island endemic terrestrial vertebrates, shaped by long-term isolation and ecological specialization, are particularly vulnerable to extinction pressure in the Anthropocene. However, cross-taxon extinction patterns and their drivers remain poorly understood. Here, we compiled a global dataset of 31,865 terrestrial vertebrates, including more than 7500 island endemic species, to evaluate the patterns and drivers of extinction risk in island endemics, in comparison with continent endemics and dual-\",\"doi\":\"10.1126/sciadv.aef9781\",\"url\":\"https://doi.org/10.1126/sciadv.aef9781\",\"pmid\":\"42555717\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过整合31865种陆生脊椎动物（含7500余种岛屿特有物种）的全球数据集，在比较岛屿特有、大陆特有及双重分布物种的基础上，评估了岛屿特有物种灭绝风险的格局与驱动因素，发现其灭绝风险呈现跨类群差异，并识别出相关影响因素，获得了相应研究进展，为岛屿生物多样性保护提供了科学参考。\"},{\"title\":\"Highly aquatic marine stem archosaur with soft tissue preservation.\",\"title_cn\":\"保存有软组织的极度水生海洋干群主龙类\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-31\",\"authors\":\"Wang W, Fraser NC, Spiekman SNF et al.\",\"abstract\":\"Archosauromorpha is a dominant reptile clade that primarily occupied terrestrial ecosystems with limited secondarily aquatic invasions that are poorly known. Here we report on a well-preserved Triassic reptile representing the earliest stem-archosaur to evolve unequivocal aquatic specializations. This taxon exhibits a suite of aquatic adaptations previously unknown in stem-archosaurs, such as hyperphalangy, enhanced paddle-like forelimbs, and a loss of articulation between the sacrum and pelvis,\",\"doi\":\"10.1126/sciadv.aeb7528\",\"url\":\"https://doi.org/10.1126/sciadv.aeb7528\",\"pmid\":\"42525755\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过化石解剖分析，在保存有软组织的中三叠世干群主龙类标本基础上，发现其具有超多指节、桨状前肢及荐椎与骨盆关节缺失等明确水生适应特征，验证了该物种为最早演化出明确水生特化的干群主龙，获得了关于主龙类次生水生入侵早期演化的相应研究进展，为理解该类群水生适应起源提供了相关价值。\"},{\"title\":\"Immunoglobulin heavy chain locus duplication in bats.\",\"title_cn\":\"蝙蝠免疫球蛋白重链基因座的重复。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-31\",\"authors\":\"Pursell T, Reers A, Mikelov A et al.\",\"abstract\":\"Bats are major reservoirs of viruses that can be transmitted to humans in zoonotic outbreaks. Antibody-mediated immunity plays an important role in shaping viral evolution and immune evasion but remains understudied in bats. All known mammals have a single immunoglobulin heavy chain (IgH) gene locus and up to two light chain loci. We have identified dual IgH loci on separate chromosomes in 26 bat species, highlighting extreme variation of immunogenetic architecture in order Chiroptera. In a mode\",\"doi\":\"10.1126/sciadv.aeb6714\",\"url\":\"https://doi.org/10.1126/sciadv.aeb6714\",\"pmid\":\"42525754\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过基因组分析，在26种蝙蝠中识别出位于不同染色体上的双免疫球蛋白重链基因座，验证了翼手目免疫遗传结构的极端变异。该发现揭示了相关研究对象中抗体基因座的重复现象，为理解蝙蝠抗体介导免疫及其在病毒进化与免疫逃逸中的作用提供了相应研究价值。\"},{\"title\":\"Genomic structural variation rescues a classic biological invader from a population bottleneck.\",\"title_cn\":\"基因组结构变异使典型生物入侵者摆脱种群瓶颈。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Osborne CA, Foote BM, Fleck SJ et al.\",\"abstract\":\"Invasion genetics presents a classic paradox: How do species successfully spread despite severe population bottlenecks? The brown treesnake (\",\"doi\":\"10.1126/sciadv.aed3656\",\"url\":\"https://doi.org/10.1126/sciadv.aed3656\",\"pmid\":\"42497265\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过基因组结构变异分析，在典型生物入侵者棕树蛇经历严重种群瓶颈的研究基础上，发现结构变异而非单核苷酸多态性驱动了其入侵适应性，验证了结构变异能使入侵者摆脱种群瓶颈的假说，获得了关于入侵遗传学悖论的新进展，为理解瓶颈后物种快速扩散机制提供了相关研究价值。\"},{\"title\":\"Emergent patterns of island biodiversity in the Anthropocene.\",\"title_cn\":\"人类世岛屿生物多样性的涌现模式。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Matthews TJ, Sayol F, Soares FC et al.\",\"abstract\":\"Islands have long been foundational to the development of ecological and evolutionary theory, serving as model systems for studying patterns of biodiversity. However, pervasive anthropogenic impacts-particularly species extinctions and introductions-have substantially altered island ecosystems, complicating inferences drawn from contemporary data. Here, we review how these human-driven changes have reshaped key biodiversity patterns on islands, including patterns of species richness, community c\",\"doi\":\"10.1126/sciadv.aee1788\",\"url\":\"https://doi.org/10.1126/sciadv.aee1788\",\"pmid\":\"42490450\",\"category\":\"ecology\",\"ai_summary\":\"该研究团队通过综述方法，在人类活动导致物种灭绝与引入的背景下，发现岛屿物种丰富度及群落组成等关键生物多样性模式已被显著重塑，获得了相应研究进展，为理解人类世岛屿生态系统的动态变化提供了相关价值。\"},{\"title\":\"The legacy of privilege: Social inheritance reverses sex differences in reproductive inequality in the spotted hyena.\",\"title_cn\":\"特权的遗产：社会继承逆转了斑鬣狗繁殖不平等中的性别差异。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-24\",\"authors\":\"Mosna M, Courtiol A, Naman P et al.\",\"abstract\":\"Inequalities in reproductive success among females and males shape natural and sexual selection. For sexually reproducing species, the Darwin-Bateman paradigm predicts greater reproductive inequality in males than females. A mechanism driving reproductive inequality in humans and other animals is social inheritance of privilege. Here, we show that this mechanism can reverse the male bias in reproductive inequality. Using a 29-year dataset spanning eight generations of spotted hyenas (\",\"doi\":\"10.1126/sciadv.aee7880\",\"url\":\"https://doi.org/10.1126/sciadv.aee7880\",\"pmid\":\"42490420\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析涵盖八代斑鬣狗的29年数据集，在繁殖不平等的社会继承机制基础上，发现社会特权继承可逆转繁殖不平等中的雄性偏向，获得了相应研究进展，为理解社会继承对自然选择和性选择的影响提供了相关价值。\"},{\"title\":\"Predictors of extinction risk in large tropical forest mammals: From global to local.\",\"title_cn\":\"大型热带森林哺乳动物灭绝风险的预测因子：从全球到局部\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-17\",\"authors\":\"Schowanek SD, Sheil D, Beaudrot L et al.\",\"abstract\":\"Studies can only guide conservation if their findings are informative at the scales at which practitioners and policy-makers operate. Yet, it is rarely tested whether large-scale studies reach similar conclusions to the smaller-scale studies on which conservation traditionally relies. We examine whether predictors of extinction risk are consistent across global, regional, and local scales, for 210 tropical forest mammal species (≥1 kg) that existed during the last 130,000 years, in 64 tropical f\",\"doi\":\"10.1126/sciadv.aeb7543\",\"url\":\"https://doi.org/10.1126/sciadv.aeb7543\",\"pmid\":\"42455935\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过分析过去13万年间64个热带地区210种大型森林哺乳动物（≥1千克）的灭绝风险预测因子，在全球、区域和局部尺度上检验了这些预测因子的一致性，发现不同尺度间的预测结果存在差异，获得了相应研究进展，为保护实践和政策制定提供了相关参考价值。\"},{\"title\":\"Dexterous single sniffs for ethological active olfaction.\",\"title_cn\":\"灵巧单嗅探用于行为学主动嗅觉。\",\"title_cn_summary\":\"\",\"journal\":\"Sci Adv\",\"date\":\"2026-07-03\",\"authors\":\"Gao M, Barrett JM, Fischer R et al.\",\"abstract\":\"Rhythmic sniffing is considered intrinsic to active olfaction among terrestrial mammals. However, mice are known to briefly hold food under their nares while feeding, suggesting coordination of oromanual dexterity, breathing, and olfaction for nonrhythmic single sniffs. Here, we recorded kinematics and breathing as mice foraged and fed, finding that mice indeed, with clockwork-like dexterity and millisecond timing, synchronize a single inspiration with rapid head and hand movements. These solita\",\"doi\":\"10.1126/sciadv.aed3610\",\"url\":\"https://doi.org/10.1126/sciadv.aed3610\",\"pmid\":\"42397911\",\"category\":\"zoology\",\"ai_summary\":\"该研究团队通过记录小鼠觅食和进食过程中的运动学与呼吸数据，在主动嗅觉行为学的基础上，发现小鼠能以毫秒级精度将单次吸气与快速头部和手部运动同步，形成非节律性的灵巧单嗅探，验证了口腔-手部灵巧性、呼吸与嗅觉的协调机制，获得了相应研究进展，为理解哺乳动物主动嗅觉的灵活调控提供了相关价值。\"},{\"title\":\"Hemisphere-wide evidence of Early Paleoindian megaherbivore specialization.\",\"title_cn\"
