ons in NOS3 (encoding\",\"doi\":\"10.1093/molbev/msag144\",\"url\":\"https://doi.org/10.1093/molbev/msag144\",\"pmid\":\"42275597\",\"category\":\"zoology\"},{\"title\":\"Mutation rate estimate and population genomic analysis reveals decline of koalas prior to human arrival.\",\"title_cn\":\"突变率估计与群体基因组分析揭示考拉在人类到来之前的种群衰退。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-06-04\",\"authors\":\"Kovacs TGL, Foley NM, Silver LW et al.\",\"abstract\":\"The koala (Phascolarctos cinereus), an iconic Australian marsupial, has experienced substantial historical and contemporary population declines. Identifying the drivers of these declines has been hindered by limited genomic data and uncertainty regarding the koala mutation rate. Here, we report a direct estimate of the koala mutation rate, based on genome sequences of four parent-offspring trios, yielding a mean of 6.12 × 10-9 mutations per base pair per generation (95% confidence interval: 5.03\",\"doi\":\"10.1093/molbev/msag108\",\"url\":\"https://doi.org/10.1093/molbev/msag108\",\"pmid\":\"42262248\",\"category\":\"ecology\"},{\"title\":\"Phylogenomic analysis of vocal fold length evolution reveals links between vocal and auditory systems in terrestrial mammals.\",\"title_cn\":\"声带长度演化的系统发育基因组学分析揭示陆生哺乳动物发声系统与听觉系统之间的联系。\",\"title_cn_summary\":\"\",\"journal\":\"Mol Biol Evol\",\"date\":\"2026-07-02\",\"authors\":\"Zhou X, Liu F, Liu M et al.\",\"abstract\":\"Vocal fold length is a primary anatomical determinant of pitch and fundamental frequency in terrestrial mammal vocalizations, playing a key role in social communication, mate attraction, and competition. However, its phenotypic diversification and genetic basis remain unclear. Here, using a phylogenetic genotype-to-phenotype mapping (PhyloG2P) framework to 75 species representing Primates, Carnivora, and Artiodactyla, we investigate the evolutionary dynamics and genetic architecture of relative \",\"doi\":\"10.1093/molbev/msag126\",\"url\":\"https://doi.org/10.1093/molbev/msag126\",\"pmid\":\"42184971\",\"category\":\"zoology\"},{\"title\":\"Exploring legal- and health-risk messaging to reduce demand for elephant skin.\",\"title_cn\":\"探索法律与健康风险信息传播以减少对象牙皮肤的需求\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Duan B, Posada-Baynham Z, Yong J et al.\",\"abstract\":\"Asian elephants (Elephas maximus) are poached for an illegal trade in their skins, which are used in traditional medicine in Africa and Asia. We explored whether messages about the legal and health risks of using elephant skin for medicinal purposes (stomach illness) could reduce such consumption. We conducted a randomized controlled trial intervention experiment based on a health belief model. We showed 1673 residents at China's Yunnan-Myanmar border comic strips that portrayed these risks (leg\",\"doi\":\"10.1111/cobi.70342\",\"url\":\"https://doi.org/10.1111/cobi.70342\",\"pmid\":\"42322633\",\"category\":\"conservation\"},{\"title\":\"Uncovering correlates of decline and critical refuges for a threatened terrestrial mammal.\",\"title_cn\":\"揭示受威胁陆生哺乳动物种群衰退的相关因素及关键庇护所。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Maitz NM, Ward MS, Rhodes JR et al.\",\"abstract\":\"Globally, the geographic ranges of numerous species are contracting. Identifying spatiotemporal patterns of threat impact can illuminate why species decline in some parts of their range but persist in others. We developed a correlative approach to identify species' response thresholds and locate ecological refuge areas associated with persistence to inform conservation planning and management. We integrated changes in realized niche characteristics for a threatened Australian mammal, the brush-t\",\"doi\":\"10.1111/cobi.70314\",\"url\":\"https://doi.org/10.1111/cobi.70314\",\"pmid\":\"42204851\",\"category\":\"zoology\"},{\"title\":\"Translocation effects on regional and local population viability and connectivity.\",\"title_cn\":\"易地迁移对区域和局部种群生存力及连通性的影响。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Sánchez Arribas E, Planillo A, Premier J et al.\",\"abstract\":\"Translocations and reintroductions aim to improve the viability of isolated populations and promote connectivity for large carnivores. However, there is no established framework for assessing their success. We used the Eurasian lynx (Lynx lynx) in western and central Europe to assess the impact of translocations on the viability of six populations and their interconnectivity. Lynx populations are small and isolated and have low genetic diversity. Population reinforcements have been carried out, \",\"doi\":\"10.1111/cobi.70321\",\"url\":\"https://doi.org/10.1111/cobi.70321\",\"pmid\":\"42117344\",\"category\":\"ecology\"},{\"title\":\"Changes in the transformative potential of action proposals in Finnish Red Lists from 1986 to 2019.\",\"title_cn\":\"芬兰红色名录中行动提案变革潜力从1986年至2019年的变化。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Arponen A, Salomaa A, Fabritius H et al.\",\"abstract\":\"Red lists provide critical knowledge regarding biodiversity decline, especially in Finland, where broad assessments have been made regularly since the 1980s. They deliver information on the threat status of species and ecosystems, propose actions to guide conservation policy, and have the potential to spur transformative change. We examined whether the transformative potential of the proposals has changed over time. We analyzed the contents qualitatively and quantitatively of seven Finnish Red L\",\"doi\":\"10.1111/cobi.70312\",\"url\":\"https://doi.org/10.1111/cobi.70312\",\"pmid\":\"42089359\",\"category\":\"ecology\"},{\"title\":\"Improving the use of expert opinion in disease risk analysis for conservation translocations.\",\"title_cn\":\"提升保护性迁移中疾病风险分析对专家意见的利用\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Ewen JG, Canessa S, Andrews CE et al.\",\"abstract\":\"Conservation translocations are subject to considerable uncertainty and risk, of which disease is one of the most recognized. To address disease risks, several protocols for qualitative disease risk analysis (qDRA) exist and are used for responsible conservation translocation planning. Existing qDRA protocols usually rely on expert judgment, but they lack quantitative aggregation of elicited estimates, transparent treatment of uncertainty, and explicit comparison of alternative disease risk mana\",\"doi\":\"10.1111/cobi.70292\",\"url\":\"https://doi.org/10.1111/cobi.70292\",\"pmid\":\"42032846\",\"category\":\"conservation\"},{\"title\":\"The entanglement between the IUCN Red List and international biodiversity law.\",\"title_cn\":\"IUCN红色名录与国际生物多样性法之间的交织关系\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Claerhoudt R\",\"abstract\":\"The International Union for Conservation of Nature (IUCN) Red List of Threatened Species (red list) is of fundamental importance for nature conservation and biodiversity protection. I considered the interaction between the red list and international biodiversity law (IBL), the legal regime that aims to protect biodiversity at a global level. The red list is deeply embedded in each of the five global biodiversity treaties. As the most authoritative database on species conservation status, the red\",\"doi\":\"10.1111/cobi.70298\",\"url\":\"https://doi.org/10.1111/cobi.70298\",\"pmid\":\"42021118\",\"category\":\"conservation\"},{\"title\":\"Integrating traditional practices, livelihoods, and conservation with Indigenous-led furbearer camera trapping.\",\"title_cn\":\"将传统实践、生计与保护相结合，开展原住民主导的毛皮动物相机监测。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Carroll KA, Grey F, Anderson N et al.\",\"abstract\":\"Contemporary conservation goals have a greater chance of success when practitioners collaborate with Indigenous communities. The importance of such collaborations has spurred calls by Western and Indigenous researchers to engage in equitable coproduction of ecological research that integrates multiple ways of knowing. However, Indigenous-led conservation research is exceedingly rare. We conducted a case study, applicable globally, in which an Indigenous community experiencing intense industrial \",\"doi\":\"10.1111/cobi.70290\",\"url\":\"https://doi.org/10.1111/cobi.70290\",\"pmid\":\"42001395\",\"category\":\"ecology\"},{\"title\":\"A global ranking of the relative vulnerability of marine mammals to macroplastic pollution.\",\"title_cn\":\"全球海洋哺乳动物对大型塑料污染相对脆弱性的排名\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Fredette-Roman C, Polidoro B, Rolsky C et al.\",\"abstract\":\"Plastic pollution poses a threat to marine mammals across the globe. However, quantitative research on the impacts of plastic pollution in marine mammals is lacking because of the ethical and practical issues that prevent experimentation on these species and the opportunistic nature of observational studies. Trait-based vulnerability indices offer a way to estimate the relative vulnerability of marine species to environmental stressors based on available knowledge about species life-history trai\",\"doi\":\"10.1111/cobi.70271\",\"url\":\"https://doi.org/10.1111/cobi.70271\",\"pmid\":\"41982042\",\"category\":\"zoology\"},{\"title\":\"Assessing differences among elasmobranch nurseries to aid conservation based on a genomics framework.\",\"title_cn\":\"评估软骨鱼 nursery 间的差异以基于基因组学框架辅助保护\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Swift DG, Barker AM, Driggers WB et al.\",\"abstract\":\"Elasmobranch nurseries often differ in environmental conditions, demographics, and use patterns. These differences affect the distribution of genetic variation among nurseries. However, conservation and management strategies often fail to account for such differences because they are difficult to characterize. We assessed differences in connectivity, genetic variation, and numbers of breeders among scalloped hammerheads (Sphyrna lewini) sampled in five nurseries in the western North Atlantic Oce\",\"doi\":\"10.1111/cobi.70280\",\"url\":\"https://doi.org/10.1111/cobi.70280\",\"pmid\":\"41972468\",\"category\":\"genetics\"},{\"title\":\"Use of drone-derived high-resolution elevation data to improve species distribution models for a primate in mountainous areas.\",\"title_cn\":\"利用无人机高分辨率高程数据改进山区灵长类物种分布模型\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Wen K, Luo Y, Rao Z et al.\",\"abstract\":\"Accurate models of species distributions in mountainous ecosystems are essential for effective conservation, yet reliance on open‑access medium‑resolution elevation products often obscures fine-scale habitat heterogeneity critical for wildlife. We evaluated whether high-resolution digital surface models (DSMs) (≤1 m) based on data from an unmanned aerial vehicle (UAV) enhanced species distribution models (SDMs) relative to medium‑resolution satellite-based ALOS World 3D (AW3D) DSMs (≥30 m) for F\",\"doi\":\"10.1111/cobi.70274\",\"url\":\"https://doi.org/10.1111/cobi.70274\",\"pmid\":\"41972408\",\"category\":\"zoology\"},{\"title\":\"Argali sheep responses to a core conservation zone in the Gobi Desert over 12 years.\",\"title_cn\":\"戈壁沙漠核心保护区对盘羊12年响应研究\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Ekernas LS, Reading RP, Wingard G et al.\",\"abstract\":\"Conserving core habitat is a widely employed, but rarely evaluated, management strategy to benefit species and broader levels of biodiversity. Yet, few researchers have rigorously evaluated core area management's effectiveness in improving demographic parameters, especially in Central Asia, where the global cashmere trade-which incentivizes massive livestock increases and environmental degradation-threatens 70% of the region's large mammals. In a 12-year study, we used a before-after field manip\",\"doi\":\"10.1111/cobi.70264\",\"url\":\"https://doi.org/10.1111/cobi.70264\",\"pmid\":\"41958002\",\"category\":\"zoology\"},{\"title\":\"A more-than-human political ecology of Indonesian songbird trade.\",\"title_cn\":\"印度尼西亚鸣禽贸易的超人类政治生态学\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Fiennes S, Hardianto N, Anasari SD et al.\",\"abstract\":\"Since its inception, conservation science has considered wildlife trade a problem. In focusing on conservation outcomes, conservationists almost completely ignore the welfare of traded animals and plants and the harms they endure. We developed a political ecology approach that incorporates the interconnectedness of people with animals and natural habitats (more than human) to study the Indonesian bird trade, which is deeply culturally embedded, monetized, and speciose. We used marketplace observ\",\"doi\":\"10.1111/cobi.70275\",\"url\":\"https://doi.org/10.1111/cobi.70275\",\"pmid\":\"41957994\",\"category\":\"zoology\"},{\"title\":\"Fish diversity and community turnover across protection zones in multiuse marine protected areas.\",\"title_cn\":\"多用途海洋保护区内保护分区间的鱼类多样性与群落周转。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Zeng X, Zeng C, Zhou Y et al.\",\"abstract\":\"Multiuse marine protected areas (MMPAs) with varying levels of protection in different zones are increasingly being adopted to balance conservation and socioeconomic goals. However, the effect of these zone-based strategies on fish diversity is not well understood. We used environmental DNA surveys across zones with different protection levels (fully protected, highly protected, and lightly protected) in three typical Chinese MMPAs, while controlling for environmental factors and human activitie\",\"doi\":\"10.1111/cobi.70262\",\"url\":\"https://doi.org/10.1111/cobi.70262\",\"pmid\":\"41902613\",\"category\":\"ecology\"},{\"title\":\"Providing regular and frequent maps of losses and gains of farmland birds based on European monitoring data.\",\"title_cn\":\"基于欧洲监测数据提供农田鸟类损失与增益的定期高频地图\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Herrando S, Pocull G, Fraixedas S et al.\",\"abstract\":\"Knowledge of species distributions is essential for informing policies on nature conservation and restoration. However, updating them on a regular basis and doing so in a harmonized manner at the international level is difficult. The European Bird Census Council integrated national monitoring data covering 5 years to update farmland bird distributions and assessed how they changed. We used these data on 50 farmland bird species to generate 10×10 km maps showing their probability of occurrence fr\",\"doi\":\"10.1111/cobi.70268\",\"url\":\"https://doi.org/10.1111/cobi.70268\",\"pmid\":\"41877448\",\"category\":\"zoology\"},{\"title\":\"Evaluating synthetic substitutes to reduce illegal harvesting and support species recovery.\",\"title_cn\":\"评估合成替代品以减少非法采伐并支持物种恢复\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Malgaonkar AS, Whittington-Jones G, Dickerson T et al.\",\"abstract\":\"Providing synthetic substitutes is a widely promoted strategy to shift consumer demand away from wildlife products derived from threatened species. Yet, there is little evidence on whether product substitution prevents illegal or unsustainable harvesting and contributes to the recovery of threatened populations. Drawing on the Furs for Life Zambia initiative, which supplied synthetic furs known as heritage furs to replace leopard furs traditionally worn during Lozi royal ceremonies in western Za\",\"doi\":\"10.1111/cobi.70266\",\"url\":\"https://doi.org/10.1111/cobi.70266\",\"pmid\":\"41877435\",\"category\":\"zoology\"},{\"title\":\"Using customs data to understand overlooked trade in non-CITES birds between Africa and Asia.\",\"title_cn\":\"利用海关数据揭示非洲与亚洲之间被忽视的非CITES鸟类贸易。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Davies A, Andersson AA, Martin RO et al.\",\"abstract\":\"The international trade in live birds poses risks to animals, people, and biodiversity. To effectively mitigate these risks, decision-makers require information on the volume, dynamics, and direction of trade. Despite Africa once being the largest exporter of birds by region, very little data exist on recent trade in live birds not listed on the appendices of the Convention on International Trade in Endangered Species of Wild Fauna and Flora (CITES). We used UN Comtrade data to explore trade in \",\"doi\":\"10.1111/cobi.70265\",\"url\":\"https://doi.org/10.1111/cobi.70265\",\"pmid\":\"41869900\",\"category\":\"zoology\"},{\"title\":\"Overlap of nonbreeding wandering albatrosses with fisheries and implications for colony-specific population trajectories at South Georgia.\",\"title_cn\":\"非繁殖期漂泊信天翁与渔业的分布重叠及其对南乔治亚岛特定种群数量变化轨迹的影响\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Warwick-Evans V, Pearmain EJ, Phillips RA\",\"abstract\":\"Bycatch in fisheries is one of the most serious threats to pelagic seabirds, causing major population declines. Mitigation measures can reduce bycatch substantially, but many fisheries fail to apply best practices, and seabird mortality remains high. Seabirds often segregate at sea according to sex and life-history stage, and bycatch risk can vary accordingly. Few studies have tested whether spatial segregation among colonies in foraging areas affects bycatch risk. We tracked nonbreeding wanderi\",\"doi\":\"10.1111/cobi.70260\",\"url\":\"https://doi.org/10.1111/cobi.70260\",\"pmid\":\"41869890\",\"category\":\"zoology\"},{\"title\":\"Drivers of bat researchers' intent to adopt field hygiene practices.\",\"title_cn\":\"蝙蝠研究人员采纳野外卫生实践意向的驱动因素。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Coleman JL, Macdonald EA, Rutrough AL et al.\",\"abstract\":\"Infectious disease is a growing threat to wildlife, with zoonotic transmission most likely at the human-wildlife interface. One underappreciated activity at this interface is fieldwork with wild animals, but associated risks can be mitigated through field hygiene (FH) practices, such as using personal protective equipment and other appropriate behaviors. Following the dissemination of International Union for Conservation of Nature FH guidelines for bat researchers, we investigated factors that a\",\"doi\":\"10.1111/cobi.70252\",\"url\":\"https://doi.org/10.1111/cobi.70252\",\"pmid\":\"41863123\",\"category\":\"zoology\"},{\"title\":\"Regulatory compliance and support for altered management of the exotic pet trade.\",\"title_cn\":\"外来宠物贸易的监管合规与变更管理支持\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Pratt EN, Lockwood JL, King EG et al.\",\"abstract\":\"Globally, the exotic pet trade has contributed to species invasion, disease, and animal welfare risks. Although scientists have advocated for increased trade regulation, the success of management and regulatory efforts depends on compliance by participants in the exotic pet trade. We used a regulatory compliance framework to investigate exotic pet trade participants' support for proposed changes to regulations. In 2023, we administered online surveys to 1653 exotic pet owners, breeders, and sell\",\"doi\":\"10.1111/cobi.70257\",\"url\":\"https://doi.org/10.1111/cobi.70257\",\"pmid\":\"41854093\",\"category\":\"zoology\"},{\"title\":\"Strengthening biodiversity conservation and One Health through ranger monitoring of wildlife health in protected areas.\",\"title_cn\":\"通过保护区护林员监测野生动物健康，加强生物多样性保护与“一体化健康”\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Montecino-Latorre D, Olson SH, Denstedt E et al.\",\"abstract\":\"The lack of wildlife health (WH) surveillance systems leaves critical gaps in biodiversity conservation and One Health protection. Integrating rangers patrolling protected areas (PAs) into WH monitoring represents a cost-effective and scalable opportunity to address these gaps at key human-wildlife interfaces and nature strongholds. For the past 2.5 years, organizations across 4 countries have collaborated to pilot this integration. The approach involved establishing a practical definition of he\",\"doi\":\"10.1111/cobi.70241\",\"url\":\"https://doi.org/10.1111/cobi.70241\",\"pmid\":\"41852111\",\"category\":\"zoology\"},{\"title\":\"Contrasting vulnerability profiles for insular assemblages of birds and mammals facing global change.\",\"title_cn\":\"岛屿鸟类和哺乳动物群落面对全球变化的脆弱性特征对比。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Marino C, Benítez-López A, Butt N et al.\",\"abstract\":\"Island biota is currently threatened by global anthropogenic pressures. The limited ability of island species to track suitable conditions and their inherent sensitivity to anthropogenic changes make insular biota highly vulnerable to global threats. Although vulnerability assessments of species to single threats individually have been conducted, the vulnerability of island faunas to multiple global change drivers has not. We evaluated the relative vulnerability of 266 insular bird and mammal sp\",\"doi\":\"10.1111/cobi.70261\",\"url\":\"https://doi.org/10.1111/cobi.70261\",\"pmid\":\"41830546\",\"category\":\"zoology\"},{\"title\":\"Perceived costs as drivers of wildlife management preferences in rural Tanzanian communities.\",\"title_cn\":\"感知成本作为坦桑尼亚农村社区野生动物管理偏好的驱动因素。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Kiffner C, Raycraft J, Becchina R et al.\",\"abstract\":\"Effectively managing human-wildlife interactions is crucial for fostering coexistence on shared landscapes. Management options are most effective when aligned with the preferences of people directly affected by wildlife, yet little is known about how socioecological factors influence these preferences. Integrating responses from 680 rural residents of northern Tanzania and remotely sensed data, we parameterized a Bayesian hierarchical model to test predictions of the hazard-acceptance model. We \",\"doi\":\"10.1111/cobi.70251\",\"url\":\"https://doi.org/10.1111/cobi.70251\",\"pmid\":\"41800693\",\"category\":\"zoology\"},{\"title\":\"Relationship of temperature with declines and persistence of Myotis lucifugus after white-nose syndrome.\",\"title_cn\":\"白鼻综合征后温度与鼠耳蝠（Myotis lucifugus）数量下降及存续的关系。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Barnes TM, Wolfe JD, Kurta A et al.\",\"abstract\":\"White-nose syndrome (WNS), caused by the fungus Pseudogymnoascus destructans (Pd), ranks among the most devastating wildlife diseases in recent history and is driving severe declines in North American bats. Identifying environmental factors that influence both the severity of population crashes and the potential for population persistence is essential for effective mitigation. We used a long-term dataset from hibernacula across Michigan's Upper Peninsula to evaluate how temperature variation aff\",\"doi\":\"10.1111/cobi.70236\",\"url\":\"https://doi.org/10.1111/cobi.70236\",\"pmid\":\"41709622\",\"category\":\"zoology\"},{\"title\":\"Rural and urban attitudes to conflict and cooperation with wildfowl conservation directives in a community in China.\",\"title_cn\":\"中国某社区城乡民众对野生鸟类保护指令的冲突与合作态度\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Miao Z, Zhang W, Wang Q et al.\",\"abstract\":\"Regulations prohibiting retaliatory killing of wildlife are widespread, but their efficacy depends on individuals' perceptions of, adherence to, and willingness to cooperate with these rules. We investigated the willingness of rural communities in China to cooperate with measures to reduce human-wildfowl conflict by examining the potential influence of individual attitudes and social factors on this willingness. Through a public survey and choice experiments with 1381 participants (344 rural res\",\"doi\":\"10.1111/cobi.70247\",\"url\":\"https://doi.org/10.1111/cobi.70247\",\"pmid\":\"41693107\",\"category\":\"zoology\"},{\"title\":\"Calibration of the species threat abatement and restoration metric's threat abatement component in a Costa Rican landscape.\",\"title_cn\":\"在哥斯达黎加景观中校准物种威胁消减与恢复指标中的威胁消减组成部分。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Mair L, Brooks TM, Jimenez RR et al.\",\"abstract\":\"Achieving global conservation policy goals requires the ability to set and measure progress toward science-based targets for biodiversity. The species threat abatement and restoration (STAR) metric was developed to enable actors to set science-based targets for species. STAR scores quantify the potential contribution of actions to abate threats and restore habitat to reduce species extinction risk in a particular place and can be aggregated and disaggregated among species, threats, and areas of \",\"doi\":\"10.1111/cobi.70231\",\"url\":\"https://doi.org/10.1111/cobi.70231\",\"pmid\":\"41684046\",\"category\":\"ecology\"},{\"title\":\"An experimental approach to assess the combined effects of multiple stressors on a large vertebrate species.\",\"title_cn\":\"一种评估多种压力源对大型脊椎动物物种联合效应的实验方法。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Pirotta E, Harris CM, Schwacke LH et al.\",\"abstract\":\"The design of experiments to investigate the combined effects of multiple stressors requires exposing target organisms to multiple combinations of stressor doses. Concurrent manipulation of stressors is often infeasible with wildlife, but long-lasting health effects allow individual health to be used as an integrator of prior stressor exposure. The population of bottlenose dolphins in Barataria Bay, Louisiana, experienced long-lasting health effects after exposure to oil from the Deepwater Horiz\",\"doi\":\"10.1111/cobi.70224\",\"url\":\"https://doi.org/10.1111/cobi.70224\",\"pmid\":\"41664509\",\"category\":\"zoology\"},{\"title\":\"Assessing the performance of surrogate species in spatial conservation planning.\",\"title_cn\":\"评估替代物种在空间保护规划中的表现。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Liu Y, Wang J, Wu H et al.\",\"abstract\":\"Selecting effective surrogate species is essential for improving conservation planning efficiency under limited resources. However, the selection process is often hindered by conceptual ambiguities and inconsistent methodologies. Moreover, most existing studies focus on assessing surrogate species but fail to integrate them into practical spatial conservation planning. We developed a multidimensional effectiveness index (EI) that integrates umbrella, keystone, flagship, and protection dimensions\",\"doi\":\"10.1111/cobi.70233\",\"url\":\"https://doi.org/10.1111/cobi.70233\",\"pmid\":\"41655053\",\"category\":\"conservation\"},{\"title\":\"Role of transit countries in global illegal wildlife trade.\",\"title_cn\":\"过境国在全球非法野生动植物贸易中的作用。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Niu J, Chen X, Xu W et al.\",\"abstract\":\"Illegal wildlife trade is an important branch of global environmental crime. It relies heavily on transit countries to promote the cross-border movement of illegal wildlife products by boosting markets, laundering services, processing and packaging products, and concealing routes. However, transit countries' strategic role is not well understood. We constructed a dataset of 15 years of illegal wildlife seizure cases from the Center for Advanced Defense Studies (C4ADS) air seizure database and Wi\",\"doi\":\"10.1111/cobi.70226\",\"url\":\"https://doi.org/10.1111/cobi.70226\",\"pmid\":\"41639024\",\"category\":\"zoology\"},{\"title\":\"Effects of landscape context on avian specialist response to increased surface temperature in protected areas.\",\"title_cn\":\"景观背景对保护区内鸟类特化种响应地表温度升高的影响\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Rudge LJ, Holland AM, Shriver WG\",\"abstract\":\"Human development is a driver of global change and a major threat to biodiversity. Protected areas maintain and support biodiversity, but outside stressors, such as climate change and land use change, can negatively influence natural resources within protected areas. We examined the effects of land surface temperature and the surrounding landscape context on the structure and composition of the breeding bird community in national parks in the Mid-Atlantic (USA). We used avian point count surveys\",\"doi\":\"10.1111/cobi.70230\",\"url\":\"https://doi.org/10.1111/cobi.70230\",\"pmid\":\"41630359\",\"category\":\"zoology\"},{\"title\":\"Combining detection dogs with air extraction methodology to expose wildlife trafficking in containerized cargo.\",\"title_cn\":\"结合检测犬与空气抽取方法，揭露集装箱货物中的野生动物走私。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Moloney GK, Shute NM, Brien GG et al.\",\"abstract\":\"Persistent demand for wildlife-derived products perpetuates international trafficking and the exploitation of legitimate globalized transport networks. The annual movement of millions of shipping cargo containers, of which few are inspected due to resource constraints, facilitates the smuggling of large quantities of wildlife contraband. Rapid, noninvasive screening tools are essential for border control agencies to effectively detect and intercept wildlife trafficking attempts, though such tool\",\"doi\":\"10.1111/cobi.70225\",\"url\":\"https://doi.org/10.1111/cobi.70225\",\"pmid\":\"41618878\",\"category\":\"zoology\"},{\"title\":\"Using incentive payments to promote human-carnivore coexistence.\",\"title_cn\":\"利用激励性支付促进人类与食肉动物共存。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Pekor A, Jansson I, Munka O et al.\",\"abstract\":\"For many large carnivores, minimizing the financial burden they impose on local people is critical to their conservation. Incentive-based programs that provide people with financial benefits for taking pro-conservation actions or achieving conservation goals are a promising tool for promoting human-carnivore coexistence. Although the number of incentive-based programs aimed at conserving large carnivores is growing, there has been little published research on the use of this approach. We reviewe\",\"doi\":\"10.1111/cobi.70216\",\"url\":\"https://doi.org/10.1111/cobi.70216\",\"pmid\":\"41608878\",\"category\":\"conservation\"},{\"title\":\"Geographic risks to functional groups of mammals and birds from habitat loss in Mexico.\",\"title_cn\":\"墨西哥哺乳动物和鸟类功能群因栖息地丧失面临的地理风险。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Mayani-Parás F, Botello F, Moreno CE et al.\",\"abstract\":\"There is a need to quantify the impact of habitat loss due to anthropogenic factors on different aspects of biodiversity, such as functional trait diversity represented by functional groups (FGs). We developed a metric to assess the weighted risk of loss of habitat for 33 FGs of mammals and 36 FGs of birds in Mexico based on potential distribution of species and percentage of distributions lost due to habitat loss according to the Mexican land use and vegetation map. We also determined species' \",\"doi\":\"10.1111/cobi.70218\",\"url\":\"https://doi.org/10.1111/cobi.70218\",\"pmid\":\"41542745\",\"category\":\"zoology\"},{\"title\":\"Evaluating the empirical basis for threat attribution in the IUCN Red List.\",\"title_cn\":\"评估IUCN红色名录中威胁归因的经验基础。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Humphries E, Smith IM, Ziebell M et al.\",\"abstract\":\"Understanding the impacts of different threats on species is key to successful conservation interventions and policies. The International Union for Conservation of Nature (IUCN) assesses threats to species, and the organization's Red List of Threatened Species is a key conservation tool. We quantified the degree to which threats in IUCN assessments for 3 vertebrate groups (birds, amphibians, and ray-finned fishes) were based on species-specific quantitative empirical data. To do this, for 2142 I\",\"doi\":\"10.1111/cobi.70213\",\"url\":\"https://doi.org/10.1111/cobi.70213\",\"pmid\":\"41540933\",\"category\":\"zoology\"},{\"title\":\"Equity considerations in the proposed wildlife protocol to the Convention against Transnational Organized Crime.\",\"title_cn\":\"拟议的《联合国打击跨国有组织犯罪公约》野生动物议定书中的公平考量。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-08-01\",\"authors\":\"Osorio CP\",\"abstract\":\"Wildlife trafficking poses a critical threat to global biodiversity, contributes to organized crime, and has disproportionate impacts on underserved and Indigenous communities. Although international legal instruments, such as the Convention on International Trade in Endangered Species of Wild Fauna and Flora, and institutional collaborations, such as the International Consortium on Combating Wildlife Crime, aim to combat wildlife trafficking, social equity remains insufficiently addressed in gl\",\"doi\":\"10.1111/cobi.70220\",\"url\":\"https://doi.org/10.1111/cobi.70220\",\"pmid\":\"41536019\",\"category\":\"zoology\"},{\"title\":\"Role of freshwater availability and terrestrial land-cover change in the distribution of a declining, terrestrial, insectivorous bird.\",\"title_cn\":\"淡水可得性与陆地土地覆盖变化对一种衰退的陆生食虫鸟类分布的影响\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Eden CF, Gillings S, Broughton RK et al.\",\"abstract\":\"Insectivorous, Afro-Palearctic migrant birds provide cross-border ecosystem services, but many are declining rapidly. The complex life cycle of migrant birds makes their conservation difficult, but understanding where they spend time during the breeding season can help indicate where those actions will be most effective. We used the spotted flycatcher (Muscicapa striata), a declining, Afro-Palearctic, migratory insectivore and habitat generalist, as a model to examine how river density and land-\",\"doi\":\"10.1111/cobi.70219\",\"url\":\"https://doi.org/10.1111/cobi.70219\",\"pmid\":\"41536007\",\"category\":\"zoology\"},{\"title\":\"An integrated approach to balance freshwater connectivity restoration and invasion risk.\",\"title_cn\":\"一种平衡淡水连通性恢复与入侵风险的综合方法。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Arkilanian A, Coté D, Wiersma YF et al.\",\"abstract\":\"Habitat fragmentation negatively affects many native migratory fish populations. However, this fragmentation can also prevent the spread and establishment of invasive species. We modified the dendritic connectivity index (DCI), a commonly used freshwater connectivity metric, to account for multiple invasive dispersal pathways in estimates of invasive species connectivity. We considered dispersal from source populations in the outlet by limiting the diadromous form of the DCI to consider dispersa\",\"doi\":\"10.1111/cobi.70215\",\"url\":\"https://doi.org/10.1111/cobi.70215\",\"pmid\":\"41531369\",\"category\":\"zoology\"},{\"title\":\"Synthesizing beaver coexistence messaging with the capability, opportunity, and motivation behavior model.\",\"title_cn\":\"将海狸共存信息与能力、机会和动机行为模型相结合。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Erickson BD, Jones MS\",\"abstract\":\"In the western United States, conservation practitioners are increasingly working with private landowners to restore habitat for North American beavers (Castor canadensis) and to use nonlethal mitigation techniques when beavers damage crops and infrastructure. Effective communication is critical for promoting coexistence, yet on-the-ground conservation messaging seldom links to behavior change theories. We conducted 23 semistructured interviews with practitioners to examine the approaches they u\",\"doi\":\"10.1111/cobi.70210\",\"url\":\"https://doi.org/10.1111/cobi.70210\",\"pmid\":\"41502085\",\"category\":\"ecology\"},{\"title\":\"Functional homogenization of terrestrial mammals outside protected areas in the Hengduan Mountains, China.\",\"title_cn\":\"中国横断山脉保护区外陆生哺乳动物的功能同质化。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Li X, Hu W, Onditi KO et al.\",\"abstract\":\"Despite the crucial role of human impacts on biodiversity loss, many assessments of this loss focus on single metrics, such as species richness, and overlook the multidimensional effects of human activities. Because of its importance to ecosystem functioning, we investigated the functional diversity of medium- and large-sized mammal assemblages in protected and unprotected mountain forests in the Hengduan Mountains of southwest China. We hypothesized that anthropogenic pressures outside protecte\",\"doi\":\"10.1111/cobi.70214\",\"url\":\"https://doi.org/10.1111/cobi.70214\",\"pmid\":\"41502084\",\"category\":\"zoology\"},{\"title\":\"Prioritizing bat roosts for conservation with a global multicriteria bat roost priority index based on community science.\",\"title_cn\":\"基于社区科学的全球多标准蝙蝠栖息地优先保护指数，用于优先保护蝙蝠栖息地。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"López-Bosch D, Tanalgo K, Puig-Montserrat X et al.\",\"abstract\":\"Prioritization in conservation is crucial for the development of efficient and effective decision-making policies. For many decades, the importance of some species and their habitats has been assessed and applied in conservation legislation, but bats and their diurnal roosts have ofbeen overlooked. Several approaches have been used to categorize bat roosts based on their conservation importance. However, such assessments are often limited to expert-level assessments, are developed for specific r\",\"doi\":\"10.1111/cobi.70189\",\"url\":\"https://doi.org/10.1111/cobi.70189\",\"pmid\":\"41408925\",\"category\":\"ecology\"},{\"title\":\"A link between increased temperature and avian body condition in a logged tropical forest.\",\"title_cn\":\"气温升高与采伐热带森林中鸟类身体状况之间的联系。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Uwimbabazi M, Muhanguzi G, Eryenyu D et al.\",\"abstract\":\"The combined effects of anthropogenic disturbances, such as logging and climate change, remain poorly understood; yet, they are the main threats to tropical biodiversity. Most tropical African countries lack long-term climate data, so climate impacts on biodiversity cannot be assessed. However, individuals experience weather, rather than climate, such that climate effects could be seen as the cumulative effects of weather over time. We used morphometric data collected in 1996-2000 and 2017-2021 \",\"doi\":\"10.1111/cobi.70190\",\"url\":\"https://doi.org/10.1111/cobi.70190\",\"pmid\":\"41332173\",\"category\":\"zoology\"},{\"title\":\"Effects of parachute science on local research capacity.\",\"title_cn\":\"降落伞科学对当地研究能力的影响。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Yang L, Chen T, Chapman CA et al.\",\"abstract\":\"Strengthening research capacity is essential to address the global biodiversity crisis. Yet, parachute science often undermines this goal, and its prevalence, costs, and benefits are unclear. We analyzed 13,502 publications on primate research that we extracted from Scopus (1960-2022) to evaluate the effects of parachute science on local research capacity across primate-range countries. We categorized these publications as local (LRP), collaborative (CRP), or parachute science (PSRP) research pu\",\"doi\":\"10.1111/cobi.70184\",\"url\":\"https://doi.org/10.1111/cobi.70184\",\"pmid\":\"41292135\",\"category\":\"conservation\"},{\"title\":\"Differences in climate change impacts on reptile embryos and adults.\",\"title_cn\":\"气候变化对爬行动物胚胎与成体影响之差异。\",\"title_cn_summary\":\"\",\"journal\":\"Conserv Biol\",\"date\":\"2026-06-01\",\"authors\":\"Jiang ZW, Wang NY, Qi S et al.\",\"abstract\":\"Species experience climate change impacts throughout their life cycle; yet, embryos are rarely considered in vulnerability assessments and conservation planning. We conducted a global-scale analysis of developmental traits and climate change effects on embryonic development in 48 oviparous reptiles. We also compared the climate change effects on embryos and adults to identify geographic areas where the 2 life stages are most vulnerable to such effects. In a comparison between adults and embryos \",\"doi\":\"10.1111/cobi.70176\",\"url\":\"https://doi.org/10.1111/cobi.70176\",\"pmid\":\"41236878\",\"category\":\"conservation\"},{\"title\":\"Host phylogeny and diet shape gut microbiome and virome in wild small mammals of Gongga Mountain, China.\",\"title_cn\":\"宿主系统发育和饮食塑造中国贡嘎山野生小型哺乳动物的肠道微生物组和病毒组。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"He LW, Tang RX, Liu SY et al.\",\"abstract\":\"Gut microbiotas play pivotal roles in host adaptation, yet their composition and function in high-altitude small mammals remain poorly characterized. This study investigated how host phylogeny (order-level) and dietary habits shape the gut microbiome and virome of three mammalian orders (Eulipotyphla, Rodentia, Lagomorpha) in Gongga Mountain, a biodiversity hotspot on the Qinghai-Xizang Plateau. Metagenomic sequencing of 219 samples from 22 species revealed order-specific microbial signatures: E\",\"doi\":\"10.24272/j.issn.2095-8137.2025.448\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.448\",\"pmid\":\"42533584\",\"category\":\"zoology\"},{\"title\":\"Genome-wide SNVs revealed reticulate evolutionary history of a Eurasian-African songbird radiation (\",\"title_cn\":\"全基因组SNV揭示欧亚-非洲鸣禽辐射的网状进化历史\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Jiang C, Liu Y, Zhu WW et al.\",\"abstract\":\"Phylogenomics has the power to reveal complex evolutionary hypotheses across taxa, thereby allowing important glimpses into the evolutionary history, such as incomplete lineage sorting (ILS) and introgression among closely related species. The  系统发育基因组学能够揭示分类单元间复杂的演化假说，为重构演化历史提供关键证据，如不完全谱系分选（ILS）和基因渐渗等现象。黑喉石䳭复合种由\",\"doi\":\"10.24272/j.issn.2095-8137.2025.266\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.266\",\"pmid\":\"42533579\",\"category\":\"zoology\"},{\"title\":\"Task learning drives adaptive vocal adjustments in echolocating bats.\",\"title_cn\":\"任务学习驱动回声定位蝙蝠的适应性发声调整。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Wang Q, Ye H, Luo J\",\"abstract\":\"Vocal production learning (VPL), a core ability underlying human speech, is rare among mammals. Apart from humans, two of the four identified VPL mammalian lineages (cetaceans and bats) are echolocators, exhibiting remarkable vocal flexibility for echolocation. It has been posited that enhanced vocal flexibility can facilitate the evolution of VPL, which operates at longer time scales. However, empirical data linking vocal flexibility to VPL is still lacking. Using a psychophysical reinforcement\",\"doi\":\"10.24272/j.issn.2095-8137.2025.350\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.350\",\"pmid\":\"42457411\",\"category\":\"zoology\"},{\"title\":\"Global Camera Trapping Inventory (GCTI) v.1.0: A worldwide inventory of camera-trapping studies for spatial biodiversity analysis.\",\"title_cn\":\"全球相机陷阱调查名录（GCTI）v.1.0：用于空间生物多样性分析的全球相机陷阱研究名录。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Liang LW, Fatimah A, Qian Q et al.\",\"abstract\":\"Camera traps have significantly advanced biodiversity monitoring by enabling standardized, noninvasive detection of medium- and large-sized wildlife across broad spatial scales. However, the lack of data sharing within the camera-trapping community, particularly during the early development of the field, has restricted the availability of public species-occurrence records and limited the integration of camera-trap evidence into global spatial analyses. Data sensitivity, especially for threatened\",\"doi\":\"10.24272/j.issn.2095-8137.2025.340\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.340\",\"pmid\":\"42457409\",\"category\":\"zoology\"},{\"title\":\"Whether and how nestlings of Japanese tits respond to nest predator risk: Testing active and passive growth responses.\",\"title_cn\":\"日本山雀雏鸟是否以及如何应对巢捕食风险：检验主动与被动生长反应。\",\"title_cn_summary\":\"\",\"journal\":\"Zool Res\",\"date\":\"2026-07-18\",\"authors\":\"Liu QZ, Yu JP, Shao FB et al.\",\"abstract\":\"Nestling growth is known to be passively constrained by parental feeding and actively mediated by growth-regulating hormones. While nest predation pressures can vary across geographic regions, few studies have focused on whether and how nestling growth patterns are adjusted in response to differences in predation pressure. We selected two breeding populations of Japanese tits  雏鸟的生长受到亲鸟递食量的被动限制，同时依赖生长调节激素的主动调控。不同地理区域的巢捕食压力存在差异，但鲜有研究关注雏鸟在不同压力环境下的生长模式是否存在变化以及如何变化。本研究以分布于吉林省和辽宁省的大山雀（\",\"doi\":\"10.24272/j.issn.2095-8137.2025.338\",\"url\":\"https://doi.org/10.24272/j.issn.2095-8137.2025.338\",\"pmid\":\"42457408\",\"category\":\"ecology\"}]";

      const rawPapers = JSON.parse(papersJson);

      let currentIndex = 0;
      const annotations = JSON.parse(localStorage.getItem('annotations') || '{}');

      while (currentIndex < rawPapers.length && annotations[rawPapers[currentIndex].pmid]) {
        currentIndex++;
      }

      function loadPaper() {
        if (currentIndex >= rawPapers.length) {
          document.getElementById('paperCard').style.display = 'none';
          document.getElementById('doneMessage').style.display = 'block';
          const total = Object.keys(annotations).length;
          document.getElementById('progress').textContent = `完成！共标注 ${total} 篇`;
          return;
        }

        const paper = rawPapers[currentIndex];
        document.getElementById('paperCard').style.display = 'block';
        document.getElementById('doneMessage').style.display = 'none';
        document.getElementById('paperTitle').textContent = paper.title;
        document.getElementById('paperTitleCn').textContent = paper.title_cn || '';
        document.getElementById('paperMeta').innerHTML = 
          `<span class="tag ai">AI标签: ${paper.category || 'unknown'}</span>` +
          `${paper.journal} · ${paper.date}`;
        document.getElementById('paperAbstract').textContent = paper.abstract || '无摘要';
        document.getElementById('progress').textContent = 
          `第 ${currentIndex + 1} / ${rawPapers.length} 篇 · 已标注 ${Object.keys(annotations).length} 篇`;
      }

      function annotate(isRelevant) {
        const paper = rawPapers[currentIndex];
        annotations[paper.pmid] = {
          title: paper.title,
          title_cn: paper.title_cn || '',
          relevant: isRelevant,
          ai_category: paper.category || '',
          journal: paper.journal,
          date: paper.date,
        };
        localStorage.setItem('annotations', JSON.stringify(annotations));
        currentIndex++;
        loadPaper();
      }

      function exportResults() {
        const blob = new Blob([JSON.stringify(annotations, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'annotations.json';
        a.click();
        URL.revokeObjectURL(url);
      }

      function resetAll() {
        if (confirm('确定要清除所有标注吗？此操作不可恢复。')) {
          localStorage.removeItem('annotations');
          currentIndex = 0;
          location.reload();
        }
      }

      function goBack() {
        if (currentIndex > 0) {
          currentIndex--;
          const paper = rawPapers[currentIndex];
          delete annotations[paper.pmid];
          localStorage.setItem('annotations', JSON.stringify(annotations));
          loadPaper();
        }
      }

      // 绑定全局作用域方便 HTML 中的 onclick 调用
      window.annotate = annotate;
      window.exportResults = exportResults;
      window.resetAll = resetAll;
      window.goBack = goBack;

      loadPaper();
    })();</script></body></html>
