name: 一次性补全 History 期刊

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Show backfill context
        run: |
          date -u
          test -f src/data/history_backfill.json && echo "Backfill marker exists" || echo "Backfill marker does not exist"

      - name: Fetch and freeze missing history journals
        run: python -u src/backfill_history.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit fixed history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/papers.json src/data/history_backfill.json
          git diff --cached --quiet || git commit -m "backfill missing history journals"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install

      - name: Install rolldown WASI binding
        run: npm install @rolldown/binding-wasm32-wasi --no-save

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
