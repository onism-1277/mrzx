name: 每日论文更新

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 调试
        run: |
          pwd
          ls -la
          ls -la src/ || echo "NO SRC"
          find . -name "*.py" || echo "NO PY FILES"
        
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装依赖
        run: pip install requests
        
      - name: 运行脚本
        run: python3 src/fetch_papers.py
        
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: 构建
        run: |
          npm install
          npm run build
          
      - name: 部署
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
